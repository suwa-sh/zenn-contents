source:
  title: "政府共通のファイル共有で、正規の相手以外のアクセスが7月30日から11月12日まで確認された"
  url: null
  path: "notes/zenn/articles/itmedia-co-jp-2611-2000003381-p8_20261122.md"
  primary:
    - title: "デジタル庁「ガバメントソリューションサービスで提供しているファイル共有サービス上のファイルの漏えいの可能性について」（2026年11月20日）"
      url: "https://www.digital.go.jp/press/a966ee61-478c-4194-8f13-f97599fae986"
    - title: "デジタル庁「ガバメントソリューションサービスへの不正アクセスによる職員等の個人情報の漏えいの可能性について」（2026年9月11日）"
      url: "https://www.digital.go.jp/news/2026-0911-01"
  retrieved_at: "2026-11-23"
archetype:
  primary: incident
  secondary: [governance]
one_liner: "デジタル庁は、政府共通のファイル共有で許した相手以外のアクセスを2026年7月30日から11月12日まで確認しています。"
key_points:
  - claim: "正規の共有相手は、許した相手の集合で決まります。"
    evidence: "ガバメントソリューションサービスのファイル共有とは / まとめ"
    status: fact
  - claim: "公表は、2026年7月30日から2026年11月12日まで、その集合の外からのアクセスがあったと確認しています。"
    evidence: "11月20日の公表が確認している範囲"
    status: fact
  - claim: "検知と、ファイル共有の提供停止は、同じ2026年11月12日です。"
    evidence: "11月20日の公表が確認している範囲"
    status: fact
  - claim: "ファイルの一部の漏えいは可能性、個人情報の含有は想定です。"
    evidence: "11月20日の公表が確認している範囲 / 注意点"
    status: fact
mental_models:
  - type: structure
    key_message: "見るずれは、許した相手の集合と実際のアクセス主体の差"
    reason_needed: "組織の外にいる関係者は正規の相手に入るので、内外で切ると許可の内側まで外に出るため"
example:
  description: "組織外の事業者を共有に入れていても、その相手は許した相手です。"
  hypothetical: false
  evidence: "ガバメントソリューションサービスのファイル共有とは / 共有の許可を運用で持つ境界 の 1"
applicability:
  - "共有の相手リストを、作ったあとも見直すとき"
decision_criteria:
  - "許した相手は、共有を作ったときのリストのままですか。"
  - "リストの外からのアクセス期間を確認しましたか。"
  - "検知した日に、提供を止めましたか。"
  - "検知後すぐに、外部通信を遮断しましたか。"
  - "今回の共有へ、9月11日の件数と経路、保管場所を重ねる一次資料はありますか。"
limitations:
  - "件数、対象機関、経路は、2026年11月20日の公表に書いてありません。"
  - "起点の2026年7月30日は、現時点の調査結果です。より前のアクセスが加わる余地があります。"
  - "約24.6万件は、2026年9月11日の別ページにある個人情報の件数です。"
  - "現時点で未確認なのは、個人情報の二次被害です。"
  - "2026年9月の事案と今回が同一かは、公表の範囲外です。"
unknowns:
  - "経路、件数、対象機関、7月30日より前のアクセスは、2026年11月20日の公表の範囲外"
  - "2026年9月11日の事案と今回が同一かは、公式が書いていない"
  - "個人情報保護委員会への報告事由、本人通知、大臣会見の口頭説明は、この公表の範囲外"
reviewed: true
