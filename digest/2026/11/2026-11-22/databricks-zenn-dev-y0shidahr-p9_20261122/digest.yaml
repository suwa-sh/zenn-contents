source:
  title: "Databricks上のエージェント誤答を4種のコンテキスト失敗に切り分ける"
  url: null
  path: "notes/zenn/articles/databricks-zenn-dev-y0shidahr-p9_20261122.md"
  primary:
    - title: "Drew Breunig, How Long Contexts Fail (2025-06-22)"
      url: "https://www.dbreunig.com/2025/06/22/how-contexts-fail-and-how-to-fix-them.html"
    - title: "y0shidahr「Databricksのエージェントがおかしいとき、4つの「コンテキストの失敗」を見分けて直す」"
      url: "https://zenn.dev/y0shidahr/articles/2d1fb00790d0ad"
    - title: "Databricks, Built-in LLM judges (Last updated Sep 15, 2026)"
      url: "https://docs.databricks.com/aws/en/mlflow3/genai/eval-monitor/concepts/judges/"
  retrieved_at: "2026-11-23"
archetype:
  primary: decision
  secondary: [architecture]
one_liner: "Databricks上のエージェント誤答は、モデルを替えずに3行で残します。"
key_points:
  - claim: "残す3行は、不足、害の名前2つ、本文の有無です。本文（誤りの元の文）が残っていなければ、ラベルを確定しません。"
    evidence: "まとめ / 同じ質問で分ける手順 > 残す3行"
    status: fact
  - claim: "Poisoningは、モデル自身の以前の出力の誤りを再参照することです。"
    evidence: "4つの短い定義 / トレース上の出所 / 残す3行の1"
    status: fact
  - claim: "Distractionは、コンテキストへの過集中です。"
    evidence: "4つの短い定義 / トレース上の出所「定義そのものは、コンテキストへの過集中」"
    status: fact
  - claim: "Confusionは無関係な文書か似たツール、Clashは食い違う文書やツールです。この4つは、必要事実があるときの害の名前です。"
    evidence: "4つの短い定義 / トレース上の出所 / 同じ質問で分ける手順「事実がある側は、害のラベル」"
    status: fact
  - claim: "必要な事実が無い失敗は、4つの名前の外です。見る例は、検索の空、権限、索引の更新漏れです。"
    evidence: "注意点 > 定義どうしの重なり / 同じ質問で分ける手順 > 残す3行の1"
    status: fact
mental_models:
  - type: behavior
    key_message: "誤答は、本文が残っていて必要事実があるときだけ、害の主と副に進む"
    reason_needed: "本文の有無と事実の有無で進む先が変わるため"
example:
  description: "無関係な文書が返っても、必要事実が無ければ不足です。必要事実があるとき、古い文と新しい文書の食い違いはClashです。"
  hypothetical: false
  evidence: "同じ質問で分ける手順 > 残す3行の1"
applicability:
  - "Databricks上のエージェントが依頼と違う答えを返したとき"
  - "同じ質問で、直しの前後を採点で比べるとき"
decision_criteria:
  - "誤りを生んだ本文は、トレースに残っていますか。"
  - "必要事実は、コンテキストにありますか。"
  - "害では、同時に当てはまる名前を2つ残していますか。"
  - "古い索引に必要事実が無いとき、不足にしましたか。"
limitations:
  - "名前は重なり、1件が1ラベルとは限りません。2つの名前に順位は付けません。"
  - "4つの名前は、製品の機能名ではありません。"
  - "採点機能は、失敗の名前を返しません。"
unknowns:
  - "Triggered sync が失敗したとき、古いベクトルが検索に残るか"
  - "ジャッジ用モデルの名前、課金、リージョン、ライフサイクル"
  - "旧 MCP URL で PAT が使えるか、内部向けの要求数の枠と同じか"
reviewed: true
