  primary:
    - title: "Elizabeth. AI Isn't Replacing SREs. It's Deskilling Them. Observability Real Talk. 2026-02-28"
      url: "https://newsletter.signoz.io/p/ai-isnt-replacing-sres-its-deskilling"
