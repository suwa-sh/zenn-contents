source:
  title: "変異を生成してもテストの穴は件数では決まらない"
  url: null
  path: "notes/zenn/articles/zenn-dev-miyakona-mutation-p8_20261109.md"
  primary:
    - title: "miyakona「変異は生成できても、テストの穴はそれだけでは見つからない」"
      url: "https://zenn.dev/miyakona/articles/mutation-generator-needs-structural-review"
    - title: "Practical Mutation Testing at Scale: A view from Google (arXiv:2102.11378v2)"
      url: "https://arxiv.org/html/2102.11378v2"
    - title: "A Comprehensive Study on Large Language Models for Mutation Testing (arXiv:2406.09843v5)"
      url: "https://arxiv.org/html/2406.09843v5"
  retrieved_at: "2026-11-10"
archetype:
  primary: decision
  secondary: [algorithm, research]
one_liner: "コミット済み差分の追加行を意図的に壊しても、作った件数やテストが落ちずに残った件数では、テストの穴は決まらない。残ったものは穴、等価、未分類に分ける。"
key_points:
  - claim: "変異は、動いているコードを意図的に壊した版である。この仕組みはコミット済み差分の追加行から壊した版を JSON で作り、既存テストへ渡す。テストが落ちたものは検出、落ちずに残ったものは緑（生き残り）である"
    evidence: "差分の変異生成とは"
    status: fact
  - claim: "壊し方は2系統ある。字句の生成器は、ソースを切った単位の置換で、最小例は比較演算子だけを入れ替える。何を集めるか、どの引数を渡すか、どの分岐を通すか（実行させるか、消すか）は、構造を見る担当が作り、置換表には載っていない"
    evidence: "差分の変異生成とは / 件数は miyakona 氏の概数である"
    status: fact
  - claim: "ハーネスは変異を1件ずつテストへ当てる側で、実装は散文だけである。当てる前のテストが緑であること、ファイルごとに狭めたテストが緑なら全体も再実行すること、タイムアウトと置換失敗は検出にも緑にも混ぜないこと、を定義している"
    evidence: "ハーネスが1件ずつ当てる"
    status: fact
  - claim: "緑が残ったら、仕分けの担当が穴、等価、未分類のいずれかにし、入力の範囲と観測対象を残す。穴はテストが守っていない壊れ方、等価は壊しても観測する振る舞いが変わらない変異、未分類はまだ付けていない残りである"
    evidence: "ハーネスが1件ずつ当てる"
    status: fact
  - claim: "生成件数と緑の件数は完了条件にしない。空の変異一覧は終了コード 0 でも穴が無かったことにはならない"
    evidence: "差分確認で完了とみなす条件"
    status: fact
mental_models:
  - type: structure
    key_message: "追加行から字句の生成器と構造を見る担当が1つの JSON を作り、ハーネスが緑だけを穴、等価、未分類の仕分けへ渡す。件数では終わらない"
    reason_needed: "検出、時間切れ、置換失敗と、緑の仕分けを同じ完了条件に混ぜないため"
example:
  description: "修正Bはページングの修正2件のうち、手書きが見つけた操作を字句の生成器が再現しなかった方である。集める先へ対象グループだけを積む、引数の渡し先へ対象グループだけを渡す、そのグループ用の分岐を消す。対象グループの中身の分類は記事に無い"
  hypothetical: false
  evidence: "件数は miyakona 氏の概数である"
applicability:
  - "壊した版の JSON を既存のハーネスへ渡し、対象をコミット済み差分に限るなら、自作の小さな生成器を選びたい"
  - "条件の固定やブロックの空文化だけが目的なら、自作せず既存ツールの演算子を、既定で有効かまで見て選びたい"
decision_criteria:
  - "緑を穴、等価、未分類のいずれかにし、未分類は未完了のまま残す。生成器が問題ないとしただけでは通さない"
  - "等価の証明が終わるまでレビューを止めない。証明が無いものを等価として通すことと、未分類のまま残すことを分ける"
  - "緑が偏ったファイルは、比較演算子が密集しているだけか、ログや定数のような優先度の低いコードかを見て、構造を見る担当の入力にし、偏り自体は穴にしない"
  - "既存の JSON 実行へ載せ、対象を差分に限るなら小さな生成器に理由がある。条件の固定やブロックの空文化だけなら、PIT や Stryker の演算子を既定グループの有無まで見て選ぶ"
limitations:
  - "件数は miyakona 氏の概数で、同じ変異集合の前後比較ではなく、時間と見つかった穴の増分は測っていない。修正A（ページングの修正のもう一方）の最終版に残った緑は、穴か等価か未分類のままで、穴だったか等価だったかは記事から決まらない"
  - "2026-11-09 時点で公開リポジトリの所在は確認できていない。記録が読めない、形式が不正、記録したテストに失敗があるとき、止めるのがハーネスか生成器かは掲載されていない"
  - "JSON の形を宣言する検証器の呼び出しは記事に無い。トップレベルのテストコマンドを空にし、変異ごとのテストだけを書くと、当て直す全体が無くなるという注意が散文にある"
  - "等価の完全な証明をレビュー完了の門にすると手続きが終わらない。Wang らの論文は、等価な変異の判定は一般の入力に対して止まる手続きだけでは判定し切れない、と書いている"
  - "差分の読み取りは通常の1つの親との差分用で、複数の親をまとめた形式には対応しない"
unknowns:
  - "修正Aの最終版に残った緑が穴だったか等価だったかは、記事から決まらない"
  - "記録が読めない、形式が不正、記録したテストに失敗があるとき、止めるのがハーネスか生成器かは掲載されていない"
  - "対象グループの中身が何の分類かは、記事に書かれていない"
reviewed: true
