source:
  title: "AIで作ったアプリの引き渡しを、動作・結果・失敗時・運用の4段階で切る"
  url: null
  path: "notes/zenn/articles/ai-zenn-dev-techstudiolab-p7_20261109.md"
  primary:
    - title: "AIで作ったアプリ、画面が動いたら完成？引き渡し前の4段階"
      url: "https://zenn.dev/techstudiolab/articles/ai-generated-app-four-levels-of-done"
  retrieved_at: "2026-11-10"
archetype:
  primary: decision
  secondary: [governance]
one_liner: "AIで作ったアプリの完成は、画面が動く、結果が仕様どおり、失敗時に扱える、運用担当者が手順で利用を開始できる、の4段階で記録する。"
key_points:
  - claim: "完成を一つの語にすると、開発者と利用者の認識がずれやすいので、通過には確認した事実を残す。第1段階は決めた操作を実行できること、第2段階はデータが仕様どおりに扱われること、第3段階はデータを壊さず利用者が次に取る行動が分かること、第4段階は運用担当者が決めた手順で利用を開始できることである"
    evidence: "4つの段階の表（通過の判断）"
    status: fact
  - claim: "操作IDは、登録操作ごとに付ける一意の識別子で、再送が同じ操作だと分かる。通信が切れたとき、成功とも失敗とも出さず確認中だと利用者に伝える記録は第3段階、操作IDから登録結果を見る照会は第4段階である"
    evidence: "引き渡し前の4段階とは / 段階ごとに残す記録"
    status: fact
  - claim: "掲載の例は、一つのプロセス（そのプログラムの実行）の中で順番に登録する。内容が違う再送の拒否は、第3段階ではなく第2段階の確認である"
    evidence: "操作IDをテストに書いた例 / 第2段階と第3段階の確認範囲"
    status: fact
  - claim: "確認項目の判定は未確認、合格、不合格、対象外で、合格の数だけを数えると未確認の問題と利用開始を妨げる不具合を見落とす。承認は引き渡し可、条件付き可、不可で、他人のデータを更新できる状態は不可と書く"
    evidence: "チェックリストと承認欄 / 承認の三択"
    status: fact
  - claim: "テストをAIに作らせるときも、完成条件を先に渡し、どの段階の確認を見ているかを確かめる。掲載の2件は第2段階だけで、通信を切る確認と照会は見ていない"
    evidence: "操作IDをテストに書いた例 / 生成したテストを受け取るときは"
    status: fact
mental_models:
  - type: structure
    key_message: "図が第1段階から第3段階をアプリの振る舞いにまとめたのは記事の要約である。第3段階の通過判断は、利用者が次に取る行動が分かるところまで含む。図の「利用者に渡せる」は、運用担当者が決めた手順で利用を開始できることである"
    reason_needed: "記事の要約より、第3段階の通過判断の方が広い。第4段階の名前と、通過の判断も別である"
example:
  description: "備品「マウス」を数量3で登録する掲載のテスト。同じ操作IDと数量3の再送は1件のまま、同じIDで数量5は保存前に拒否され数量3が残る"
  hypothetical: false
  evidence: "操作IDをテストに書いた例"
applicability:
  - "画面が動いた報告だけで、業務データを扱うアプリを渡す前に、完成の記録を分けたい"
  - "再送や通信断のあと、利用者が再登録してよいかを、運用担当者が調べられるようにしたい"
  - "生成したテストが、どの完成条件を見ているかを、受け取るときに確かめたい"
decision_criteria:
  - "ログイン、登録、検索が動いた報告を、第1段階より先の証拠にしていないか"
  - "再送のたびに新しい操作IDを発行する実装を、第2段階の証拠にしていないか"
  - "第3段階として、通信が切れたとき成功とも失敗とも出さず確認中だと利用者に伝え、権限の無い更新をサーバーが拒否してデータが変わらない記録があるか"
  - "第4段階では、利用開始の手順を運用担当者が実施できた記録と、利用者ごとの権限、バックアップからの復旧手順、照会、連絡先と対応担当、利用者へ渡した操作手順を、分けて残しているか"
  - "データを保存しない試作で復旧手順、照会、連絡先と対応担当を外すときは理由を残し、受け手が開発者本人ならその旨を書いて、担当を分けられたとは書かないか"
limitations:
  - "手順の提案であり、導入件数や障害件数の測定報告ではない"
  - "ボタンを押すたびに新しい操作IDを付ける呼び方では、二度押しを止めない。プロセスが終わると記録は消え、同じ操作IDは新しい登録になる"
  - "同時の登録と、サーバーが止まった場合は未確認である。本番では、操作IDの一意性をデータベースで保証し、登録した内容とその操作IDの結果を一つのトランザクションで保存する必要がある、と記事は書く"
  - "第4段階の5項を記録しても、開発者がデータベースを開き、運用担当者が横で一度見た記録でも照会は満たせる。連絡先を開発者本人にしても、連絡先の項目は満たせる"
  - "バックアップからの復旧手順は手順を確認した事実で、戻す作業の実施、所要時間、輪番、アプリログの保管場所、1件だけの取消は含まない。操作IDの発行者と表示する画面、照会失敗後の再試行、条件付き可の境界、このリストで渡した件数は、元の公開記事からは決まらない"
unknowns:
  - "操作IDを誰が発行し、利用者のどの画面に出すか"
  - "照会も失敗したとき、未登録としての再試行へ進む条件"
  - "条件付き可に入れてよい残件の境界。記事が対比するのは、検索結果の表示順の軽微な問題と、一般利用者が他人のデータを更新できる問題である"
  - "このチェックリストで実際に引き渡したアプリの件数"
reviewed: false
