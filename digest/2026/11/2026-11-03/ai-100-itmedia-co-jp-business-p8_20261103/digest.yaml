source:
  title: "利用率100%のあと、エージェントを組み立てる時間は誰の職務か"
  url: null
  path: "notes/zenn/articles/ai-100-itmedia-co-jp-business-p8_20261103.md"
  primary:
    - title: "ITmedia ビジネス「その日、メルカリは『業務を止めた』」2026-11-02"
      url: "https://www.itmedia.co.jp/business/articles/2611/02/news032.html"
    - title: "メルカリ FY2026.6 4Q 決算説明資料"
      url: "https://pdf.irpocket.com/C4385/xoA3/ieAo/Ip3B/oYI9.pdf"
    - title: "mercan「#0 メルカリ『AI Agent Day』始動」"
      url: "https://careers.mercari.com/mercan/articles/60180/"
    - title: "メルカリ プレスリリース「CTOの木村俊也がCHRO兼CAIOに就任」2026-06-01"
      url: "https://about.mercari.com/press/news/articles/20260601_chrocaio/"
    - title: "同じ説明資料パッケージの財務CSV"
      url: "https://pdf.irpocket.com/C4385/xoA3/ieAo/Ip3B/R8TF.csv"
  retrieved_at: "2026-11-04"
archetype:
  primary: governance
  secondary: [decision]
one_liner: "メルカリの利用率100%の次に決めるのは、エージェントを組み立てる時間を誰の職務にするかです。上長のその場の裁量だけに置くと、「時間がない」が残ります。"
key_points:
  - claim: "100%は、2026年1月末のグループ従業員から休職者、退職確定者、鹿島アントラーズ雇用者を除いた人数に対し、通期注記が挙げる ChatGPT、Gemini、Claude、Cursor、LiteLLM、Notion AI のいずれかを利用した比率である。100%の「月1回以上」は通期注記ではなく2026年7月の取材の説明である"
    evidence: "## 決算が書いた利用率と開発量 / ## 100%の範囲と、利用の窓"
    status: fact
  - claim: "2週間に1回「無駄ではない」と伝えても「時間がない」は残り、少数の上司はその時間を止めた、と人事とAIの責任者である木村俊也氏は語っている。対策の AI Agent Day は、2026年5月から非エンジニア約1,000名が対象で、1バッチは事前2週間、当日、事後2週間の約1か月である"
    evidence: "## 取材が残した衝突と、会社が切った単位 / ## 口頭の後押しが残したもの"
    status: fact
  - claim: "7.6倍は2024年6月期と2026年6月期の通期同士、1.9倍は2025年6月期第2四半期と2026年6月期第2四半期の四半期同士で、どちらもコード変更量を当時のエンジニア人数で割った値である。同じ2会計年度の連結売上収益は約1.22倍、コア営業利益は約2.34倍である"
    evidence: "## 決算が書いた利用率と開発量 / ## コード変更量と、同じ期間の売上"
    status: fact
  - claim: "記事の判断は、構築時間を上長の裁量から切り離し、事前と事後を含む役割の時間として切り、その中にコンプライアンスと、デザインや品質の最終判断を名指しすることである"
    evidence: "## 構築時間を職務として切る / ## 切る単位は、当日の1日ではない / ## ブロックの中に、人が残す判断を名指しする"
    status: interpretation
  - claim: "見る対象を利用率とコード変更量から、渡した仕事（どの仕事を渡したかの一覧）と、人が残した判断（コンプライアンスと、デザインや品質の最終判断）へ移すのは、この記事の提案である。決算が書いたのは再設計を一体で進める方向までで、その一覧を評価項目にしたとは書いていない"
    evidence: "## 評価で見る対象は、事実と提案を分ける / ## まとめ"
    status: interpretation
mental_models:
  - type: structure
    key_message: "組み立てる時間を上長の裁量に置くと「時間がない」が残る。職務として切る先は、専門判断を含む事前・当日・事後のブロックである"
    reason_needed: "口頭の後押しと当日1日の催しを、会社が切ったプログラムの長さだと読むと、時間の単位を取り違える"
example:
  description: "AI Agent Day の対象には執行役と執行役員も含まれる。午前は Notion AI でスキルの概念を体験し、午後は Claude Cowork で自分の業務のスキルを作る。スキルは会社記事 mercan の企画者が使い回しの効くプロンプトのような概念と説明するエージェントの能力。Claude Cowork は同記事がデスクトップ上の安全な作業環境と書く道具"
  hypothetical: false
  evidence: "## 取材が残した衝突と、会社が切った単位"
applicability:
  - "主要AIツールは配ったが、組み立てる時間を上長のその場の裁量に置いている"
  - "構築の研修を、当日の1日だけで終えようとしている"
  - "利用率やコード変更量を、評価の本体に置こうとしている"
decision_criteria:
  - "100%を出すとき、2026年1月末、除外3種、通期注記の6ツールのいずれかの利用をセットにし、月1回は取材の説明として注記から離す"
  - "7.6倍を2会計年度の通期同士、1.9倍を四半期同士の、人数あたりコード変更量と書き、同じ文に混ぜない"
  - "構築時間の単位が、事前と事後を含むブロックか。当日1日だけになっていないか"
  - "そのブロックに、コンプライアンスと、デザインや品質の最終判断が名指しであるか"
  - "評価では、決算の再設計の方向と、渡した仕事と人が残した判断を見る提案を分ける"
limitations:
  - "100%は、決算説明資料の見出しの「全従業員」より狭い。注記は、週次、毎日、アカウントを持っているだけ、のどれとも書いていない"
  - "7.6倍を届いた機能や事業成果の倍率として読むと、注記の対象から外れる"
  - "前年比の売上収益 +19% とコア営業利益 +60% は、その2会計年度とは別の窓である。決算は、これを7.6倍の原因だとは書いていない"
  - "第2四半期の注記の Claude Code と、通期の注記の Claude のどちらが集計を変えたかは、2026年11月3日時点の一次資料に答えがない"
  - "止めた上司は何人で、どの仕事を止め、AI Agent Day のあとどうなったかは、2026年11月3日時点の一次資料に答えがない。評価の再設計が実施済みか、事後2週間が上長に止められない職務時間かも、同じ時点の一次資料に答えがない"
unknowns:
  - "100%の「利用」を、どの窓で数えたか。注記は時点とツール名までで、月次とも週次とも書いていない"
  - "通期注記が Claude Code を Claude と書き換えたのは、集計対象の変更か、呼称のまとめか"
  - "構築時間を止めた上司は何人で、どの仕事を止め、AI Agent Day のあとどうなったか"
  - "評価の再設計は、2026年11月時点で実施済みか、方針のままか"
  - "事後2週間の定着は、上長が止められない職務時間として守られているか"
reviewed: true
