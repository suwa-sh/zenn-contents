    reason: "週次枠の中の先止まりであり、3つの計算の分離とは別の判断なので本文の確認項目に残す"
  - item: "画面ごとの共有の内訳"
    reason: "含まれる利用枠の意味にまとめた。図の要素を 7 個以下にするため"
  - item: "5 時間のローリングと週次の固定時刻、API の RPM と TPM、支出上限の HTTP 429"
    reason: "リセットの種類と API 側の止まり方は本文の確認項目と注意点に残す。図は計算の分離だけを示す"
  - item: "月次APIクレジットから usage credits への矢印"
    reason: "入らない関係である。Console への矢印のラベルに「usage credits には入らない」と書いた"
layout:
  direction: top-to-bottom
  aspect_ratio: "16:9"
evidence:
  - "### 1 つのアカウントの中の枠 / 個人アカウントの中には、含まれる利用枠と、名前が似ていて別計算のクレジットがある"
  - "### 含まれる利用枠 / 確認済みの Ultra には、5 時間ごとにリセットされるセッション上限がない。週ごとの上限は残る"
  - "### 月次の API クレジット / 月次 API クレジットは Claude、Claude Code、Cowork の usage credits には適用されない"
