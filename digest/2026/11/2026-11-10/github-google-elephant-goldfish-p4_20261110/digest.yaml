source:
  title: "Elephant-Goldfish Modelは仕様の深文脈と突き返しの文脈を分ける"
  url: null
  path: "notes/zenn/articles/github-google-elephant-goldfish-p4_20261110.md"
  primary:
    - title: "google/elephant-goldfish-model"
      url: "https://github.com/google/elephant-goldfish-model"
    - title: "Introducing the Elephant-Goldfish Model plugin (Google Open Source Blog, 2026-10-22)"
      url: "https://opensource.googleblog.com/2026/10/introducing-elephant-goldfish-model-plugin.html"
  retrieved_at: "2026-11-11"
archetype:
  primary: architecture
  secondary: [decision]
one_liner: "Elephant-Goldfish Modelは、仕様を書く深文脈と、穴を返す検証者を分ける。検証者に文脈が無いと呼べるのは、親の会話を渡さないことまでである。"
key_points:
  - claim: "EGM は Apache-2.0 のプラグインである。Elephant（プロジェクトとこれまでの決定を持つセッション）が概念メモと設計文書を書く。Goldfish（親の会話をコピーせず新しく起動するサブエージェント）は設計文書を読んで穴を返す。人間がトレードオフを決めてから実装に進む"
    evidence: "冒頭 / Elephant-Goldfish Modelとは"
    status: fact
  - claim: "レビュー技能が実行するのは Stage 5 から Stage 9 の 5 段である。Stage 1 から 4 はこの技能の手順に無い。Stage 5 は俯瞰、Stage 6 は理解テスト、Stage 7 は批判、Stage 8 は修正後の再俯瞰、Stage 9 は実装準備である。Stage 6 だけが読書リストを渡さない。先に言い換えを書かせ、言い換えられない節は Blocker である。ペルソナ（その段の読み方）と文書規格（指摘の書き方）は渡る。読書リストを外す規則は、読めるファイルをその段のために閉じる規則ではない"
    evidence: "レビューの五段 / 段ごとに分かれる受け渡し"
    status: fact
  - claim: "指摘の採否は Elephant の会話に戻る。分類は修正案、反論、人間への引き上げ、見送りの 4 つである。解決役は、Goldfish が読めなかった知識だけで指摘を退けず、人間に上げる。理解の穴は反論の対象にしない"
    evidence: "レビューの五段"
    status: fact
  - claim: "収束は、未決着の Blocker と Major（未決着だとループを終わらせない重さ）が無いラウンドが 2 回続くまでである。Nit（残っていてもループを止めない指摘）は残ってよい。技能の上限は 5 ラウンドである。解決役の自動適用は修正案だけを適用し、反論、引き上げ、見送りは飛ばす"
    evidence: "レビューの五段"
    status: fact
  - claim: "公表の「ゼロ文脈」は、何も渡さないという意味には読めない。親の会話はどの段にも渡さない。文書規格（段に紐づく採点規格）は常に渡る。読書リストは Stage 6 だけ外す。指示ファイル（ホストが子に注入する指示）はホスト次第である。層の名前はプラグインの用語ではなく、公開されている入出力を分ける呼び方である"
    evidence: "四つの層"
    status: fact
mental_models:
  - type: structure
    key_message: "Stage 6 は親の会話と読書リストを外し、設計文書とペルソナは渡す。指示ファイルはホスト次第である"
    reason_needed: "ゼロ文脈を親の会話が無いことと、読書リストも指示ファイルも無いことを、同じものとして読まないため"
example:
  description: "Stage 6（理解テスト）は読書リストを渡さず、言い換えできない節を Blocker にする。Stage 9（実装準備）は参照ファイルを渡し、文書のパスと今あるソースコードを照合する。ソースが一致しても、仕様が文書だけで実装できる証拠にはならない"
  hypothetical: false
  evidence: "レビューの五段 / 四つの層"
applicability:
  - "仕様の穴探しを、詳しいエージェントにもう一度読ませる手順で止めず、検証者に渡す層を指定する"
  - "サブエージェントを作れないホストでは、そのレビューを Goldfish と呼ばない。EGM 自身がそこで停止する"
  - "小さな既知の修正には、この 5 段を必須にしない"
decision_criteria:
  - "親の会話を渡さない実行ができないホストのレビューを、Goldfish と呼んでいないか。サブエージェントを作れない場合も、そこで停止し、Goldfish と呼ばない"
  - "指示ファイルに入っている前提を、レビュアーも読んでいるものとして扱い、疑わせたい仮定を検証対象として明示しているか。レビュアーに伏せたい前提を、依頼本文にも書いていないか"
  - "理解テストとソース照合を別の結果として残し、後者の合格を、仕様が自分だけで閉じている証拠にしていないか"
  - "Goldfish が誤解した箇所を、詳しい側の記憶で消していないか。反論するなら、レビュアーが読めた根拠を残しているか"
  - "収束を指摘がゼロと扱っていないか。未実行のレビュアーがいる回を成功に数えていないか。ホストの利用上限で止まった段を、レビュー済みにしていないか"
limitations:
  - "ブログの「Goldfish は 3 段」は 2026年10月22日時点の説明である。対象は 2026年11月10日時点の main で、レビューは 5 段である。プラグイン版は 0.1.1 で、1.0 の前は非互換のワークフロー変更があり得る"
  - "利用者数や完走回数は品質の証拠にならない。通常レビューとの品質、時間、トークンの比較は Issue #61 が未実装のままである"
  - "Issue #237 が open のあいだ、未解決の報告では Codex はプロジェクトとユーザーの指示が、Antigravity はプロジェクトの指示が、子から見えた。Claude Code は 2.1.271 以降で利用者、プロジェクト、ローカルの指示ファイルを外せるが、管理側のポリシーは残る。2.1.271 未満は隔離の検証済み環境として扱わない"
  - "ファイルシステムの隔離ではない。レビュアーは読めるファイルを読める。Stage 6 も、読めるファイルを技術的に閉じる規則ではない"
  - "未マージの pull request #344 は、2026年11月10日の main の実測ではない。後の修正で反論の根拠が消えても指摘が既決のまま残り、開いた Major があっても、未決着の Blocker と Major が無い回が 2 回続くと収束し得ると現行規則を読んでいる。プロンプト試験であり、複数ラウンドの実ループは未実施と、その提案自身が書いている"
unknowns:
  - "Issue #237 が、Codex と Antigravity の現行版でまだ再現するか。文書は 2026年11月3日時点の報告を未解決として残し、実機での再試験結果は含まない"
  - "未決着の Blocker と Major が無い回が 2 回続くとき、複数ラウンドの実ループで Major を閉じ忘れないか。#344 はプロンプト試験で、ライブ統合は未実施と書いている"
  - "ブログの「毎日数千人」の定義と期間。確認した文書の中に、ブログ以外の一次系列は無い"
reviewed: true
