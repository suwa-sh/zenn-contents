source:
  title: "Astryxは人とエージェントの共作に契約を三箇所へ分ける"
  url: null # Zenn 下書き (published: false)。公開 URL なし
  path: "notes/zenn/articles/astryx-github-meta-astryx-p8_20261110.md"
  primary:
    - title: "meta/astryx（基準コミット b6b0c68）"
      url: "https://github.com/meta/astryx/commit/b6b0c68ad570ca85c8028aa1d4e416ac76453023"
    - title: "Introducing Astryx（2026年6月18日）"
      url: "https://astryx.atmeta.com/blog/introducing-astryx"
    - title: "公開 MCP"
      url: "https://astryx.atmeta.com/mcp"
    - title: "夜間テストの記録 meta/astryx#3164"
      url: "https://github.com/meta/astryx/issues/3164"
  retrieved_at: "2026-11-11"
archetype:
  primary: architecture
  secondary: [decision]
one_liner: "Astryx は、Meta が公開した画面部品のデザインシステムです。契約（誰がどのファイルを根拠にしてよいか）は、コンポーネント文書、プロジェクト手順、承認済み仕様に分かれ、人が見るカタログは入りません。"
key_points:
  - claim: "公開 MCP（エージェントが文書を引く入口）と CLI は、型・例・助言を含むコンポーネント文書を返す。初期化（利用者プロジェクトへ手順を書く操作）が書くのは、始め方、CLI の引き方、避ける書き方で、版に固定した契約全文は持たない"
    evidence: "配っているものの特徴 / 契約は三箇所に分かれるときの読み方"
    status: fact
  - claim: "公開 MCP の取得は、型、例、助言、アクセシビリティの合格基準、入れるコマンドを返すが、仕様の優先順位、実装が契約に届いていない箇所、承認状態は返さない。助言に付く印は真でも偽でも実行時に渡した値を拒まず、偽はその助言が誤りという意味ではない"
    evidence: "三つの出口という概念構造（get(\"Button\")）"
    status: fact
  - claim: "原則は、渡した値は描き、デザイン上の意見は文書と例に置くことである。禁止の組み合わせを検証するスキーマは、公開資料からは見つかっていない"
    evidence: "配っているものの特徴 / 禁止の組み合わせは機械検証されない"
    status: fact
  - claim: "中核パッケージ @astryxdesign/core の公開版は、npm latest と GitHub Release の 0.7.11 で、README は Beta のままである。基準コミットの 0.7.12 は次の宣言で、この公開版ではない"
    evidence: "配っているものの特徴 / 到達宣言と Beta"
    status: fact
  - claim: "記事は、入っている版の CLI とその版の文書を画面を書く側の正本にし、公開 MCP の install 行と props（型・既定値・必須）は採用しないことを勧めている。変える側の正本は、対象プラットフォームの承認済み仕様と検証先のテストである"
    evidence: "推奨する正本の置き方"
    status: interpretation
mental_models:
  - type: structure
    key_message: "共作の契約は、コンポーネント文書・プロジェクト手順・承認済み仕様の三箇所に分かれ、人のカタログは別の出口である"
    reason_needed: "実行前に読む面、変更を拘束する面、人がブラウザで見る面が同じ系統の別出口であり、カタログを契約の三箇所に入れると読み違える"
example:
  description: "Button では、コンポーネント文書が href をリンクとして描き、同じ文書の助言はページ遷移にボタンを使うなと言い、承認済み仕様は href があり操作できない状態でなければリンク要素になると書く。助言は描き方とは別の文である"
  hypothetical: false
  evidence: "契約は三箇所に分かれるときの読み方"
applicability:
  - "入っている版の文書を、エージェントに渡して画面を書かせる"
  - "公開の入口で部品を探し、入っている版の CLI で中身を確定する"
  - "自分のデザインシステムで、人のカタログと、エージェントが引く文書・振る舞いの契約を分ける"
decision_criteria:
  - "未決の作業状態（待ちや実行中の見た目）の文書を、エージェントのプロトコルの仕様として引用していないか"
  - "承認済み仕様をまとめて渡し、Web の契約と、実験中の別プラットフォーム（Swift の文字入力など）の契約を混ぜていないか"
  - "人のカタログだけを正本にして、型、承認済み仕様、実装が契約に届いていない箇所を落としていないか"
  - "導入記事の「依存が無い」を、React 19 と StyleX（スタイルを書く必須の依存）が要らない根拠にしていないか"
  - "150 以上のアクセシブルな部品、社内 13,000 アプリ、社内 8 年、本番向けという宣言を、日付つきの自己申告以外にしていないか"
limitations:
  - "公開日は社内 8 年の裏取りにならず、150 以上の数え方は公開資料にない"
  - "Button の承認済み仕様は、暗いアクセント上の hover と pressed でコントラストが 4.5:1 を下回ると書く。公開 MCP が返す合格基準とは別にこの不足は返さず、0.7.11 での再測定も公開されていない"
  - "チャートと実験用パッケージは中核パッケージと同じ入れ方ではなく、利用者が入れる React Native は基準のコミットにない。基準コミットの承認済み仕様が作り方の比較に React Native を挙げても、提供の決定ではない"
  - "脆弱性の検索 0 件は、無い証明ではない。公開 MCP のレート制限と認証なしの範囲は、2026年11月10日の資料では未確認"
  - "2026年8月5日の一夜の記録では、Button の文書を読んだ 10 プロンプト中 8 つで、その文書の prop ではない onPress が出て、型が拒否した。CLI の文書は正しく、文書は直さず、0.7.11 の現在の失敗率でもない"
unknowns:
  - "150 以上という公式の数え方の分母"
  - "13,000 アプリと 8 年を、公開後のどの範囲に読み替えてよいか"
  - "公開 MCP のレート制限と、認証なし応答のサポート範囲"
  - "onPress が 0.7.11 の文書を読んだ現在のモデルでも同じ割合で出るか"
  - "Button の 4.35:1 と 4.02:1 が 0.7.11 のビルド済み CSS でまだ再現するか"
  - "2026年7月10日の「計画していない」と、2026年10月24日の仕様が比較候補に React Native を名指しすることを、提供の有無とどう読み分けるか"
reviewed: true
