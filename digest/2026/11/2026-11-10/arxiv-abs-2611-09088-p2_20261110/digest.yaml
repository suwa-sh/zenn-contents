source:
  title: "日常の設定変更が崩すハーネスの実行順と保持状態"
  url: null
  path: "notes/zenn/articles/arxiv-abs-2611-09088-p2_20261110.md"
  primary:
    - title: "When Routine Operations Break Architectural Pattern Relationships in LLM Agent Harnesses"
      url: "https://arxiv.org/abs/2611.09088"
  retrieved_at: "2026-11-11"
archetype:
  primary: research
  secondary: [architecture]
one_liner: "ハーネスのピンした版では、プラグインが有効でも、実行前の政策判断が外れることがある。呼ばれる順と残る状態が、通常操作で書き換わる。"
key_points:
  - claim: "プラグインが載っていても、政策判断を運ぶのは呼ばれる順（先が列を終えると後ろへ届かない）と、残る状態（保存した許可や、編集の出どころの印）である。再適用（実体を破棄して作り直すこと）でできた新しい実体が私的状態の印を持たないと、制約されるはずの編集が実行される"
    evidence: "### ホスト、アセンブリ、割当 / ### 来歴ラベルがインスタンスと履歴でずれる"
    status: fact
  - claim: "DeepSeek Harness（エージェントの実行環境）では、政策プラグインが観察するモードから禁止を執行するモードへの切替が、政策プラグインを末尾へ再登録する。承認プラグインが先に列を終えると政策へ届かず、プラグインは有効なまま、操作者が承認した禁止編集が実行される"
    evidence: "### コールバック順が政策の前で終わる / ## 通常操作が書き換える順と状態"
    status: fact
  - claim: "OpenCode（別の実行環境）2.2.5 で「always」が編集許可を残すと、要求は既許可になり、Permission Reviewer（尋ねる前に政策を当てるプラグイン）は棄権する。「ask（その都度尋ねる）」だけをレビューする約束は守るが、執行点の責務（実行前に指定政策が禁止を判断すること）は外れる"
    evidence: "### 保存した許可がレビュー資格を外す"
    status: fact
  - claim: "同じ切替でも、列の後ろに置いたホスト自身の同意（プラグインの承認ではなく、実行環境自身が持つ同意）は、検証した列で執行点の要件を残した。操作の名前だけでは、要件を外すかは予測できない"
    evidence: "## 検証した条件で要件を満たした割当 / ## 注意点"
    status: fact
  - claim: "論文は、要件を外す頻度を測っておらず、「通常操作をすれば関係は壊れる」という割合には読めない。読む単位は、どの要件か、どの版か、どの操作の列かである"
    evidence: "## 注意点 / ## まとめ"
    status: fact
mental_models:
  - type: structure
    key_message: "図の「関係」は、実行前の政策判断のことである。ピンした版では、通常操作が順と状態を書き換え、プラグインが有効なままでも指定政策を外すことがある"
    reason_needed: "プラグインが有効であることと、政策が実行前に判断することを、同じことだと読むとレビュー項目を誤る"
example:
  description: "DeepSeek Harness 0.2.1-rc.2 で、政策を先に並べた観察するモードは、選んだ編集（政策が評価したかを見る対象）1 件を評価した。文書化された切替のあとは、選んだ編集 5 件中 0 件しか政策が評価しなかった。操作者が承認すると、禁止編集が実行された"
  hypothetical: false
  evidence: "### コールバック順が政策の前で終わる"
applicability:
  - "政策プラグインと承認プラグインを、同じ呼び出し列に載せる"
  - "「always」で許可を残し、以後の要求を既許可にする"
  - "レビューを、ツール名の在庫から、判断の経路と状態の寿命へ広げる"
decision_criteria:
  - "指定政策への経路が呼び出し列だけのとき、開始、切替、設定保存、無効化と再有効化のどれが、その順を書き換えるかを見る"
  - "保存した許可が政策の資格を外すなら、常設の承認を政策判断の代わりにしない"
limitations:
  - "意図的に選んだ多重ケース研究で、損失の頻度は測っていない"
  - "DeepSeek Harness の対象版は developer preview である。列を終える承認は、その承認が対象にするツールについて、かつ政策より前のときだけ、政策を経由しない実行を起こす"
  - "every-edit（先に拒否された編集も含め、受け取った編集をすべて評価する要件）を外すと違反の集合は小さくなる。禁止編集が政策を経由せず実行された主結果は、執行点の責務の違反として残る"
  - "停止したメンバーを再登録まで除外する、という共有黒板（誰が参加しているかの共有）の読みは研究側の読みである。再開プロンプトを再登録と見れば、共有黒板プラグインの配信は正しい、と論文は書く"
  - "独立した追試は 2026-11-10 時点で未発見である。パターン責務の元論文（AgentOps catalogue）の本文、実験補足、列を終えるプラグイン 6 個の残りの名前は、この記事では未確認である"
unknowns:
  - "独立した追試は 2026-11-10 時点で見つかっていない"
  - "AgentOps catalogue の該当節が、本論文の転記と一致するか"
  - "列を終える分岐を持つ 6 個のうち、Governance と Airlock 以外の名前は実験補足にあり、この記事では未確認"
  - "安定版の DeepSeek Harness、およびコード比較のみとした後続の Deep Agents と LangChain で、同じ操作列がどうなるか"
reviewed: true
