source:
  title: "エージェント開発で意図的なペースが監督機会を残す条件"
  url: null
  path: "notes/zenn/articles/arxiv-abs-2611-09550-p3_20261110.md"
  primary:
    - title: "Reichel ほか「Deliberate Pacing for Human Oversight in Agentic Software Development」"
      url: "https://arxiv.org/abs/2611.09550"
  retrieved_at: "2026-11-11"
archetype:
  primary: research
  secondary: [governance]
one_liner: "意図的なペースは、開発を遅くする名前ではない。自律実行の進むタイミングを調整し、人が監督できる機会をつくる、論文のビジョンの名前である。"
key_points:
  - claim: "速度は単位時間あたりの産出、ペースはその配分である。意図的なペースが調整するのは、エージェントの自律実行が進むタイミングであり、開発を遅くすること自体は目的に含まれない"
    evidence: "意図的なペースとは"
    status: fact
  - claim: "意図的なペースから分かれる調整は3つである。重大な決定の実装前に止める。人のレビューが終わるまで次の活動を始めない。中間結果を人に見せる時点を移す"
    evidence: "3つの調整 / 概念の関係"
    status: fact
  - claim: "情報が無い時点で止めても、何を変えるかは決まらず、意味のある監督には届かない。情報が揃ったあとで、その決定を前提にした成果物を見るだけなら、影響できる時点は後にずれ、この場合も意味のある監督には届かない"
    evidence: "意味のある監督"
    status: fact
  - claim: "3つの調整とは別に、要求の確認、実装のレビュー、テストオラクルの独立した確認は、必ずしも互いに代わりにはならない。実装を後から見ても、必要を外した要求を必ず埋め合わせられるわけではない"
    evidence: "確認の位置は代わりにならない"
    status: fact
  - claim: "この論文の現在の版はビジョンと研究計画であり、効果の大きさ、人の判断を待つ時間、作業をまとめる境目、変更の行数の定義は無い"
    evidence: "測っていないことと、未来形の研究計画"
    status: fact
mental_models:
  - type: structure
    key_message: "意味のある監督は、理解できる情報とその時点の影響が揃って初めて成立する"
    reason_needed: "人を挟んだかどうかと、まだ決定を変えられる時点かを取り違えないため"
example:
  description: "エージェントがアーキテクチャ上の依存を選び、部品とテストまで人に聞かずに進むと、見た時点では複数の成果物がその決定を前提にできている。1つ目の調整は、依存を選んだあと、その部品とテストができる前に止める"
  hypothetical: false
  evidence: "3つの調整"
applicability:
  - "重大な決定を実装へ進める前に、人が見て変えられる位置を残したい"
  - "確認の種類を増やすのではなく、既存の確認を、まだ決定を変えられる時点に置きたい"
  - "効果の実証ではなく、監督の条件の名前としてこの論文を引用したい"
decision_criteria:
  - "止める時点に、決定を理解できる情報があり、かつその時点で決定を変えられるか"
  - "判断に足る情報が無い状態で、進んでいる自律実行を止めていないか"
  - "中間結果を出す時点を遅らせすぎて、影響できる時点が、成果物が決定を前提にできたあとへずれていないか"
  - "区間は、秒数や差分行数ではなく、重大な決定が実装へ進む前の状態で切っているか"
  - "止めずに進める区間を置くなら、その区間では実装前の影響機会を使っていないと明示しているか"
limitations:
  - "効果量は未測定である。第4節は、面接、実行トレース、準実験、シミュレーションをこれから行う、と未来形で書いている"
  - "何を重大と見なすかの手続、人の判断を待つ時間の長さ、情報の量のしきい値は、この論文に無い"
  - "論文は、完了後のレビューが実装前の介入と同じ影響機会を持たないことがある、と書いている。常に持たない、とは断定していない"
  - "動機の文献20件は、人が自分で開発を意図的に遅くした理由の探索であり、エージェントを止める効果は測っていない。どの20件を選んだかの一覧は論文の本文に無い"
  - "2026年11月10日時点で、会議とジャーナルへの採録は未確認である。リポジトリ検索が0件でも、実装が無いことの証明にはならない"
unknowns:
  - "どの決定を重大と見なし、実装前に止めるかの判定手続は、依存選択の例だけで、論文に無い"
  - "待ち時間、バッチ境界、差分サイズを後の版が操作的に定義するかは、2026年11月10日時点の v1 では未決である"
  - "止めない実行と事後評価で足りる条件は何か。論文が中心の未決問題にしている"
reviewed: true
