evidence:
  - "10倍は何と比べた数字か: 休止が大半の対話だけを10倍の自己申告の対象にし、常時稼働、GPU、TPU、完全な Pod、Arm、Autopilot は Agent Sandbox 側の条件として分ける"
  - "隔離と実行と学習の分担: Worker のプールの隔離は gVisor か microVM かを指定し、寄贈のあとでもこの選択は残る"
