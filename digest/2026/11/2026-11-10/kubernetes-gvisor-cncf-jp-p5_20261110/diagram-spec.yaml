type: structure
title: "10倍は休止が大半の対話だけ"
message: "10倍の自己申告は休止が大半の対話だけに使い、隔離は gVisor か microVM を自分で選ぶ"
source: "notes/zenn/articles/kubernetes-gvisor-cncf-jp-p5_20261110.md"
components:
  - id: idle
