  aspect_ratio: "16:9"
evidence:
  - "システムコンテキスト図: AI ツールは解析対象ソース（参照専用）と仕様リポジトリへ矢印。フレームワークは仕様リポジトリへ矢印"
  - "コンテナ図: init.sh から specs へ、gates.sh から specs へ"
  - "特徴: gates.sh の exit 0 を完了の必要条件にする。解析対象は参照専用"
  - "init.sh: 解析対象の隣に独立した git リポジトリを作る"
