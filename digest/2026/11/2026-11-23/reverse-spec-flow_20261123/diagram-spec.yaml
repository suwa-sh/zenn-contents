type: structure
title: "仕様は隣で検査する"
message: "解析対象は変えず、隣の仕様リポジトリで検査の成功を完了の必要条件にする"
source: "notes/zenn/articles/reverse-spec-flow_20261123.md"
components:
  - id: source
