    meaning: "読み取り専用。フレームワークは対象を変更しない"
  - id: writer
    label: "書く側のAI"
    meaning: "仕様を書く実行環境。対応はホストで宣言する"
  - id: fw
    label: "reverse-spec-flow"
    meaning: "init.sh で、解析対象の隣に独立した git リポジトリを作る配布物"
  - id: specs
    label: "仕様"
    meaning: "納品単位。実装事実層と、目的によっては本質層を置く"
  - id: gates
    label: "gates.sh"
    meaning: "完了判定の実行体。exit 0 が完了の必要条件"
groups:
