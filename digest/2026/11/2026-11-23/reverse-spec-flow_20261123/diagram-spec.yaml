    label: "仕様リポジトリ"
    members: [specs, gates]
relationships:
  - from: writer
    to: source
    label: "参照する"
  - from: fw
    to: specs
    label: "初期化する"
  - from: writer
    to: specs
    label: "書く"
  - from: gates
    to: specs
    label: "判定する"
omitted:
  - item: "開発者と HOLD"
    reason: "人の停止点は限界に残す。図が伝えるのはリポジトリの境界と完了判定"
  - item: "仕様を使う側のAI"
    reason: "書き終えたあとの読み手であり、作る境界の本体ではない"
  - item: "Phase 0 から Phase 4、Playbook、purpose"
    reason: "工程と目的別の厳しさは核心ポイントと具体例に残す"
layout:
