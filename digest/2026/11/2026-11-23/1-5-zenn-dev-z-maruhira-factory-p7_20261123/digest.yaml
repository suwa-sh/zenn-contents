archetype:
  primary: decision
  secondary: [architecture]
one_liner: "1人がスプリントごとにこなせる点数は1.5倍、という自己申告です。丸平氏は増分を、Issueを流す流れの外に置きます。"
key_points:
  - claim: "丸平氏の自作は、Issueを10分ごとに拾います。これを、設計と実装のプルリクエストまで流します。"
    evidence: "ソフトウェアファクトリーとは / Issue からマージまで"
    status: fact
  - claim: "人は設計を見ます。実装は、想定外のコードと、手動でしか確かめられない動作だけ見ます。"
    evidence: "ソフトウェアファクトリーとは / Issue からマージまで"
    status: fact
  - claim: "流れを動かした人以外のプルリクエストを、権限のある人がマージできます。"
    evidence: "ソフトウェアファクトリーとは「マージ権限を持つレビュアーが、ファクトリーのプルリクエストを直接見てマージできます」"
    status: fact
  - claim: "丸平氏は1.5倍を、手順を言葉にしたこと、待ちのあいだの別作業、権限者のマージに置きます。言葉にした手順は、自分で動かすときにも効きます。"
    evidence: "1.5倍を組織の指標に写さない / まとめ"
    status: fact
  - claim: "丸平氏は、Issueを流す機能が製品になっても、Issueの書き方、受け入れの条件、誰がどこを見るかは残ると予想します。"
    evidence: "測るなら4つを混ぜない「Issue の書き方、受け入れ、誰がどこを見るかは、起動が製品になっても残ります」"
    status: interpretation
mental_models:
  - type: structure
    key_message: "丸平氏は1.5倍を、Issueを流す流れの外に置く"
    reason_needed: "増分の置き場所が、起動の箱ではなく隣の3つにあるため"
example:
  description: "変更の自動検査が通っていれば、人はテストを見ません。"
  hypothetical: false
  evidence: "ソフトウェアファクトリーとは「テストは、CI が通っていれば見ません」"
applicability:
  - "自作の開発の流れを続けるか決めるとき"
  - "1.5倍を、他のチームの目標に写すか決めるとき"
  - "Issueを流す機能が製品になったあと、残すものを選ぶとき"
decision_criteria:
  - "Issueを流せるかだけで、採用を決めていますか。"
limitations:
  - "3か月の自己申告は、納期前の残業で2倍近くを1.5倍に割り引いたものです。割引の式は未確認です。"
  - "完了した仕事が増えていなくても、点数は見積の切り方で増え得ます。"
  - "流れを直す時間は、点数の外です。1.5倍はその時間を使った期間の倍率です。"
  - "実行は手元の機械なので、夜と休日は止まります。クラウドとの違いは未確認です。"
  - "1.5倍は、他のチームの目標には写しません。スプリントの長さ、基準の点数、短くなった時間の長さ、マージ後の欠陥は未確認です。"
unknowns:
  - "スプリントの長さ、基準の点数、残業の割引の式、件数の台帳"
  - "リードタイムがどの区間で何時間減ったか、マージ後の欠陥"
  - "クラウドにすると何が違うか"
  - "少人数が何人か、設計以外のモデルの製品系列"
reviewed: true
