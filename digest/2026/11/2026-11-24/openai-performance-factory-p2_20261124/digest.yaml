    - title: "Okay Zed, Cyrus Forbes, How OpenAI’s Performance Factory keeps ChatGPT fast (OpenAI, 2026-11-19)"
      url: "https://openai.com/index/how-openai-performance-factory-keeps-chatgpt-fast/"
    - title: "同記事の日本語版 (OpenAI, 2026-11-19)"
      url: "https://openai.com/ja-JP/index/how-openai-performance-factory-keeps-chatgpt-fast/"
