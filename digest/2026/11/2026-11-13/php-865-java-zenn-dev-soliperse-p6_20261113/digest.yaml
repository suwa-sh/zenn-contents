archetype:
  primary: decision
  secondary: [governance]
one_liner: "発注側が叶小钗氏の手順から書く完了条件は、禁止リスト、比べる項目、無視と比べない対象の3枚です。"
key_points:
  - claim: "作業の単位は URL です。前編の確認項目は、渡す値、分岐、戻り値、データベース、副作用、異常時です。"
    evidence: "作業の単位は URL"
    status: fact
  - claim: "同じリクエストの応答を、PHP と Java で比べます。手順は、差があるときだけキャッシュを外し、外しても残る差を業務の処理の差とします。"
    evidence: "同じリクエストを両系へ送る / まとめ"
    status: fact
  - claim: "無視する例は、処理時間、リクエストごとの ID、文字列と数値の差です。"
    evidence: "同じリクエストを両系へ送る"
    status: fact
  - claim: "見た誤りは、禁止リストへ1件ずつ足します。"
    evidence: "865行のルールファイル"
    status: fact
  - claim: "注文の約 −0.8% は、Java 7,418 件と PHP 7,475 件の再計算と合う自己申告です。"
    evidence: "見出しで通りやすい読み / 注文が約 −0.8%、受け入れを3枚に分ける"
    status: fact
mental_models:
  - type: structure
    key_message: "完了条件は、禁止リスト、比べる項目、無視する項目と比べない対象の3枚に分ける。3枚に無い挙動は、誰が目で見るかを決める"
    reason_needed: "行数や日数ではなく、検査の仕様のどこまでを完了と呼ぶかを分けるため"
example:
  description: "公開例の項目は、商品ID、題名、価格、元の価格などです。末尾は省略で、例に無い項目を見ていなかったとは言えません。"
  hypothetical: false
  evidence: "同じリクエストを両系へ送る"
applicability:
  - "移行の完了を、応答比較の仕様で書くときです。"
  - "見た誤りを禁止リストへ足してから実装させるときです。"
decision_criteria:
  - "比べる項目の全リストを別に書きましたか。"
  - "落とす不一致を完了条件へ列挙しましたか。"
  - "応答に出ない在庫や決済を比べない対象に書きましたか。"
  - "リストに無い挙動が差分の外で通る穴を書きましたか。"
  - "3枚に無い挙動の目視担当を決めましたか。"
limitations:
  - "865行の禁止リストのファイルは、2026年11月13日の検索では見つかっていません。"
  - "キャッシュを外す条件の文と、外したとき増える差の分類が並び、どちらを実装したかは未確認です。"
  - "データベースと副作用は、応答に無ければ比較の外です。在庫、決済、応答のあと処理も同じです。"
  - "注文件数が、値を隠したあとの数かは分かりません。"
  - "営収 −0.6% は、式と数えた期間が非公開なので、台帳が公開されるまで採用しません。"
unknowns:
  - "キャッシュを外す条件の文と、外したとき増える差の分類のどちらを実装したかは未確認です。"
  - "注文件数が、値を隠したあとの数かは分かりません。"
  - "公開文の PHP 行数は、本文54万と結語57万で食い違います。"
reviewed: true
