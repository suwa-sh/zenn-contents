archetype:
  primary: governance
  secondary: [architecture, decision]
one_liner: "Anthropicは2026年11月5日、アカウントの所属と直前検査と事後記録を分けました。"
key_points:
  - claim: "制御は、アカウントの所属、送る直前の検査、事後の記録に分かれる"
    evidence: "三つの置き場所 / Claude Enterpriseの個人アカウント遮断とDLP連携とは"
    status: fact
  - claim: "社内ネットは、管理された通信の入口だけで止める"
    evidence: "企業ネットワーク"
    status: fact
  - claim: "組織か委託先のサーバが、許可か拒否を返すまで待つ"
    evidence: "Claude Enterpriseの個人アカウント遮断とDLP連携とは / inference hooks"
    status: fact
  - claim: "サインアウトは、APIキーと実行中のクラウドセッションと、予定した繰り返しを終わらせない"
    evidence: "サインアウトが終わらせないもの / Admin APIのサインアウト"
    status: fact
  - claim: "Claude Codeの管理設定でログイン固定を置くと、APIキーと認証トークンと、鍵を返す補助は起動時に止まる"
    evidence: "Claude Codeのmanaged settings / ローカルCLIの持ち込み鍵"
    status: fact
mental_models:
  - type: structure
    key_message: "所属の固定、直前の検査、事後の記録は、届く出口が別である"
    reason_needed: "個人ログインの遮断を、持ち込み鍵の停止や送信前検査と一つのスイッチとして読むと、届かない出口を止めたことになる"
example:
  description: "企業ドメインでない個人メールは、この請求の対象外である。カスタムスキルと外部サービスへの接続は移らない。HIPAA対応か、顧客管理の暗号鍵の組織へ請求で移す人は、新しく始める"
  hypothetical: false
  evidence: "企業ドメインの個人アカウント"
applicability:
  - "コーディングエージェントの権限を揃える前"
  - "個人アカウントを業務データから切るか決めるとき"
  - "送信の直前に許可か拒否で止める検査を置くとき"
decision_criteria:
  - "検証済みドメインの個人アカウントを、請求開始から30日で移しますか。"
  - "管理端末では、サインインの前から組織を固定しますか。"
  - "自分のAPIキーを、セッションの開始時に止めますか。"
  - "検査が失敗したとき、リクエストを止めますか。"
  - "この検査で、画像とファイルの生データまで見ていますか。"
limitations:
  - "検査が失敗したときの初めの設定は、リクエストを通す"
  - "設定した割合から外れた依頼は、止める設定でも検査を飛ばす"
  - "デスクトップの切替は、最初のサインイン前も、30日使わないあとも覆わない"
  - "直前検査は、API専用の組織と、BedrockとGoogle Cloudでは使えない"
  - "事後のログと、端末の中の検知は操作を止めない"
unknowns:
  - "Microsoft Foundry上の会話が直前検査の対象か"
  - "ファイル書き出しだけの専用イベントがあるか"
  - "検査の処理地域"
  - "強制モードと判定の強制が同じ設定か"
  - "遮断が開く失敗回数"
  - "追加料金の有無。読んだ発表とヘルプには整数が無く、価格ページは未読"
reviewed: true
