  primary:
    - title: "Ubie、Software Factoryの先へ"
      url: "https://zenn.dev/ubie_dev/articles/45501469c9c044"
    - title: "厚生労働省、医療情報システムの安全管理に関するガイドライン第7.0版の案内"
      url: "https://www.mhlw.go.jp/stf/shingi/0000516275_00006.html"
  retrieved_at: "2026-11-14"
archetype:
  primary: decision
  secondary: [governance, architecture]
one_liner: "Ubieの社内エージェントを全社へ広げるとき、写すのは5つの分離です。"
key_points:
  - claim: "依頼者本人の認可は、その人のセッションだけで、複数人が結果を見る場からは使えない。その場は、閲覧範囲用の資格情報で動く"
    evidence: "エージェントは2種 / 権限が分かれる層"
    status: fact
  - claim: "資格情報はサンドボックスの中に置かず、許可した宛先への通信にだけ載せる"
    evidence: "呼び出しと、実行の置き場所 / 停止と、人が残している判断"
    status: fact
  - claim: "承認を外せるのは、資格情報が許可先以外へ届かず、その役割が戻せると判断したときだけ"
    evidence: "全社へ広げるときに分ける5つ / まとめ"
    status: fact
  - claim: "閲覧範囲の資格情報は、モデルが読む規範とは別に、ツール呼び出しのたびにかかる"
    evidence: "開発の事例を、他の職務へそのまま当てない"
    status: fact
  - claim: "法務では、エージェントの最初の回答と、担当者があとで下した判断の差で、モデルへ渡す指示を更新する"
    evidence: "法務スキルの更新記録 / 停止と、人が残している判断"
    status: fact
mental_models:
  - type: structure
    key_message: "全社へ広げる前に、5つの分離を項目ごとに書く"
    reason_needed: "開発の手順一式を写すと、主体や閲覧範囲や資格情報の届く範囲が空欄のまま他の職務へ広がるため"
example:
  description: "複数人が結果を見る場で、依頼者の権限のまま読むと、経営会議の情報がパートナーに見える"
  hypothetical: false
  evidence: "記事が分けている理由"
applicability:
  - "開発以外の職務へ、社内エージェントを広げる前の設計"
decision_criteria:
  - "起動経路ごとに、誰の資格情報かを書いたか"
  - "その場に誰がいるかで、見える範囲を分けたか"
  - "保存先と送信先モデルを、法令と会社の選択に分けたか"
  - "許可済みの操作で起きうることを、承認を外す条件に含めたか"
  - "戻せるかの判断を、基盤を作るチームの外に置いたか"
limitations:
  - "複数人が結果を見る場に紐づかない起動の、資格情報の持ち主は、公開記事にない"
  - "後戻りできない変更の一覧は、公開範囲では空欄"
  - "改善の提案を誰が取り込むかは、公開記事にない"
  - "別の社内基盤の利用率や問い合わせ時間は、このエージェントの成績ではない"
  - "医療情報のガイドラインの確認文は、処理場所を日本に固定する義務とは文言が違う"
unknowns:
  - "複数人が見る場に紐づかない起動、アラート起点、セッション外の改善が、誰の資格情報でツールを呼ぶか"
  - "後戻りできない変更の一覧と、開発以外の職務で何が不可逆か"
  - "改善の提案を誰が取り込むか。棄却した提案をどう記録するか"
reviewed: true
