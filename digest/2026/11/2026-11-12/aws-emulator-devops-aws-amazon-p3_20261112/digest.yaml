source:
  title: "AWS Emulatorでエージェントのクラウド操作をローカルで受ける"
  url: null
  path: "notes/zenn/articles/aws-emulator-devops-aws-amazon-p3_20261112.md"
  primary:
    - title: "What is AWS Emulator?"
      url: "https://docs.aws.amazon.com/emulator/latest/userguide/what-is-service.html"
    - title: "Security in AWS Emulator"
      url: "https://docs.aws.amazon.com/emulator/latest/userguide/security.html"
    - title: "Pointing your AWS SDK at AWS Emulator"
      url: "https://docs.aws.amazon.com/emulator/latest/userguide/point-sdk-to-emulator.html"
    - title: "Test your applications against AWS locally with AWS Emulator"
      url: "https://aws.amazon.com/blogs/aws/test-your-applications-against-aws-locally-with-aws-emulator/"
  retrieved_at: "2026-11-13"
archetype:
  primary: decision
  secondary: [architecture]
one_liner: "AWS Emulator は、コーディングエージェントの資源作成をローカルで受けます。権限は実 AWS で確かめます。"
key_points:
  - claim: "AWS Emulator は、CLI と SDK の呼び出しを自分のマシンや CI で受ける。資源はメモリに置き、停止すると消える"
    evidence: "AWS Emulatorとは / 状態はプロセスのメモリだけ"
    status: fact
  - claim: "未実装の操作は HTTP 501 で落ちる。応答が AWS と揃う度合いは、サービスと機能でばらつく"
    evidence: "1つのエンドポイントで受ける / 注意点 / 同じ結果、という一文の範囲"
    status: fact
  - claim: "権限の評価は AWS と同じではない。AWS が拒否する要求が成功しうる"
    evidence: "注意点 / IAM とリソースポリシー"
    status: fact
  - claim: "アカウントやリージョンを変えても、状態は分かれない"
    evidence: "状態はプロセスのメモリだけ / 向け替えても届かない呼び出し"
    status: fact
  - claim: "エミュレータが動かす Lambda の関数コードは、実行ユーザーの権限でファイルを読み書きできる。エージェントへの指示文にも書いておく"
    evidence: "状態はプロセスのメモリだけ / 推奨する分け方"
    status: fact
mental_models:
  - type: structure
    key_message: "短い作成と入力検証はエミュレータのメモリへ、権限と境界の確認は実 AWS へ分ける"
    reason_needed: "呼び出しの向け先を一段にすると、エミュレータ上の成功を権限や境界の正しさと取り違えるため"
example:
  description: "エミュレータは呼び出し元の Account を 000000000000 と返す。起動直後に aws sts get-caller-identity で確かめ、違う値なら実 AWS を呼んでいるので作業を止める"
  hypothetical: false
  evidence: "実行環境を二段にする / 推奨する分け方"
applicability:
  - "バケットやテーブルを作り、入力の検証エラーを見る短い試行"
decision_criteria:
  - "使う操作は、応答を AWS と比べる公開試験の一覧 (GitHub) にあるか"
  - "使う操作の大半は、501 を返さずに通るか"
  - "権限のテストは、実 AWS で確かめているか"
limitations:
  - "向け先は環境変数 AWS_ENDPOINT_URL で決める。これが無いシェルは、見つかった資格情報で実 AWS を呼ぶ"
  - "テレメトリは既定でオン。操作の回数や OS の種類などを送り、要求と応答の中身は送らない"
  - "長時間の起動と負荷は未検証"
  - "本番データは入れない。テストデータだけを使う"
  - "公開試験がカバーしない挙動は、正しく動いていても未確認。実 AWS で確かめる"
unknowns:
  - "どのサービスがエミュレータ内の IAM を評価するかは security の頁で名指しされていない"
  - "User Guide の日本語版は未確認で、英語版との差は不明"
  - "公開されているスコアファイルの 1 行を公式の 1 fidelity test と呼べるかは突合していない"
reviewed: true