source:
  title: "PYF（プロダクト予算科目フィット）とは何か、BtoB新規事業での使いどころ"
  url: null
  path: "notes/zenn/articles/pyf-product-yosan-kamoku-fit_20261112.md"
  primary:
    - title: "栗原康太「PYF（Product Yosan-kamoku Fit：プロダクト予算科目フィット）という考え方」株式会社才流"
      url: "https://sairu.co.jp/method/110306/"
    - title: "企業会計基準委員会 移管指針第8号"
      url: "https://www.asb-j.jp/jp/wp-content/uploads/sites/4/kichu_20251016_35.pdf"
    - title: "企業会計基準委員会 企業会計基準適用指針第33号"
      url: "https://www.asb-j.jp/jp/wp-content/uploads/sites/4/ecl20261016_23.pdf"
    - title: "国税庁 No.5461 ソフトウェアの取得価額と耐用年数"
      url: "https://www.nta.go.jp/taxes/shiraberu/taxanswer/hojin/5461.htm"
  retrieved_at: "2026-11-13"
archetype:
  primary: decision
  secondary: [governance]
one_liner: "PYF（プロダクト予算科目フィット）は、顧客の年度予算のどの用途から払うかを見る視点です。その用途の名前を提案書で変えても、資産にはなりません。"
key_points:
  - claim: "予算科目は会計の勘定科目ではない。年度予算で支出を計画するときの用途別の項目で、研修費、業務委託費、広告宣伝費、システム投資費が例である"
    evidence: "PYF（プロダクト予算科目フィット）とは / 概要"
    status: fact
  - claim: "PYF が見るのは課題の有無や解決策の良さではなく、支払いがどの用途別予算から出るかである。才流の記事は、新規予算より既存予算の再配分の方が稟議の説明がしやすい、と書く"
    evidence: "PYF（プロダクト予算科目フィット）とは / 特徴"
    status: fact
  - claim: "PSF が予算について見るのは対価を払う意思まで、BANT は予算がどう特定されいつ承認されるかまでで、いずれも費目の名前は見ない。この対比は記事の整理である"
    evidence: "既存の営業・事業開発の枠組みとどう違うか"
    status: interpretation
  - claim: "資産になる経路があるのは、顧客がソフトウェアを取得する契約（移管指針第8号では将来の収益獲得または費用削減が確実なときだけ無形固定資産）、機械と一体でなければ機能しないソフトウェアを機械の取得原価に含める契約、特定の機器などの使用を顧客が支配するリース契約（企業会計基準適用指針第33号）である。月額の利用料を資産にする記述は第11項にない"
    evidence: "「設備投資として提案する」と資産計上は別の話 / 実務上の結論"
    status: fact
  - claim: "2026年11月12日時点の才流の用語集とフィットジャーニーには PYF が入っておらず、どの段階に入れるかは指定がない。効きやすいのは年度予算が硬く大きな既存費目に契約の実態を合わせられるとき、という位置づけは元記事の筆者の判断である"
    evidence: "PYF はどんな場面で効くのか"
    status: interpretation
mental_models:
  - type: structure
    key_message: "予算科目は支払いのラベル。資産になるかは、そのラベルではなく契約の中身で決まる"
    reason_needed: "費目名を変えることと、資産計上できることを同じ操作として読まないため"
example:
  description: "製造業向け SaaS は、ソフトウェア利用料から設備投資へ、提案先を情報システム部門から生産技術部門や工場長へ変えた、と才流の記事にある。資産計上できるかは契約形態と会計基準によると才流自身が留保し、契約の中身は非公開なので経路は判断できない"
  hypothetical: false
  evidence: "「設備投資として提案する」と資産計上は別の話 / 注意点 / 事例には検証できない部分がある"
applicability:
  - "顧客の年度予算が硬く、すでに大きな費目があり、契約の実態をその費目に合わせられる"
  - "評価は高いのに受注しないとき、原因を予算科目のずれとして切り分ける"
  - "提供形態を変えると、別の科目から支払えるかを確認する"
decision_criteria:
  - "今期の用途別予算と、そこから支払える契約の中身をセットで聞く。費目名だけを変えない"
  - "ソフトウェアの月額利用を、設備投資として資産計上できると約束しない"
  - "決裁者が支出を動かせるなら、小さい既存費目に価格を寄せない（筆者の判断）"
  - "その用途にまだ支払っていない相手には、既存科目への合わせを中心にしない"
  - "失注の原因を、科目の不一致、市場適合の未達、決裁者の不在、決断の先送りに分ける"
limitations:
  - "才流の記事が書く効果は定性的で、受注率、期間、金額、市場規模の数値はない"
  - "製造業向け SaaS と、業務改善ではなく AI 活用プロジェクトとして提案した事例は匿名で検証できない。AI の事例は経営の投資優先度も効く、と才流の記事の著者が限定している"
  - "研究会を教育研修費で払えるよう研修動画を加えたという記述は、2026年11月12日の公開ページでは確認できない。ページに無いことから動画追加自体は否定できず、才流の記事の著者は研修動画の付加価値も効いていると認めている"
  - "再配分の方が稟議を通りやすいという通過率の公開データは、その逆を示すものも含めて見つからなかった。略称 PYF は、給料から先に貯蓄へ回す Pay Yourself First とも重なる"
  - "会計は不明なら費用とし、税務（国税庁 No.5461）は将来の収益獲得や費用削減にならないことが明らかな場合だけ取得価額から外す。条件が違うので、資産になると一律には言えない"
unknowns:
  - "PYF をフィットジャーニーのどの段階に入れるかは、才流の記事が指定していない"
  - "製造業向け SaaS の事例が、取得、機械への組み込み、リースのどの経路だったかは、契約が非公開のため判断できない"
  - "研究会に研修動画を加えたこと自体は、公開ページに無いことからは否定できない"
reviewed: true
