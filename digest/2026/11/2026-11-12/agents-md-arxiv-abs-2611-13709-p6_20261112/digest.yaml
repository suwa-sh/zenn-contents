source:
  title: "AGENTS.mdなどの指示は成果物検査で守られるものと守られないものに分かれる"
  url: null
  path: "notes/zenn/articles/agents-md-arxiv-abs-2611-13709-p6_20261112.md"
  primary:
    - title: "Do They Do as They Are Told?"
      url: "https://arxiv.org/html/2611.13709"
  retrieved_at: "2026-11-13"
archetype:
  primary: research
  secondary: [decision]
one_liner: "AGENTS.md のような指示ファイル（プロジェクトの指示を渡すファイル）では、変更されたファイルに痕跡が残る文だけが検査でき、測れた指示の多くは両端に割れ、中間は少ない。"
key_points:
  - claim: "測定の単位はファイル全体ではなく、ファイルに直接書いてあり、実行でき、変更されたファイルから判定できる指示 1 件である。遵守は、その指示が対象とする種類のファイルを変更したコミットに対して、検査スクリプト（守ったかをファイルから返すプログラム）が返す真偽で、従う気だったかは見ない"
    evidence: "### 測定の単位"
    status: fact
  - claim: "候補文 14,902 件のうち測れたのは 2,053 件（13.8%）だけである。その 2,053 件では平均 59.8%、中央値 100%、常に守る 54.4%、一度も守らない 37.3%、中間 8.3% で、平均はコミットの遵守率ではなく、中央値 100% は両端への割れから来る"
    evidence: "### 遵守率の分布 / ### 平均と中央値の分母"
    status: fact
  - claim: "全標本では、コードに残る規約（中央値 100%、平均 63.6%）が、テストの有無や実行（平均 49.2%、中央値 37.5%）より高い。対象のコミットを 3 件以上、5 件以上に限っても有意なのはこの対だけで、開発手順（コミット形式やブランチのような作業手順）の対比較は有意差が消え、フックや CI へすべて移す根拠にはしない"
    evidence: "## どの種類の指示が成果物に残るか"
    status: fact
  - claim: "同じ再計算のあと残る差は、Copilot が Claude Code より高い一点で、カテゴリとリポジトリは統制されていない。製品の優劣としては読めない"
    evidence: "## エージェントごとの差 / ### 効果、範囲、再計算"
    status: fact
  - claim: "生成した検査の抜き取り 94 件では、71.3% だけが指示を正しく実装していた"
    evidence: "### 検査スクリプトのずれ"
    status: fact
mental_models:
  - type: structure
    key_message: "指示の文のうち、変更されたファイルに痕跡が残るものだけが検査対象になる。検査できた指示は、常に守る側、一度も守らない側、その中間に割れる"
    reason_needed: "ファイルに書いたことと、成果物の検査で守られたことを同じだと読むと、置けない指示までファイルに残す"
example:
  description: "「プルリクエストの前に lint を実行する」は実行できても、コミット後のファイルだけでは実行したかが残らないことがある。コードに残る規約は検査の対象になり、コミット形式やブランチはフックか CI の方が向く可能性がある"
  hypothetical: false
  evidence: "## ファイルに残すものと外で止めるもの / 種類ごとの切り分けの表"
applicability:
  - "変更されたファイルに痕跡が残る命令を、指示ファイルに 1 振る舞いずつ残す"
  - "テストや lint の合否、禁止、秘密、権限、人の承認を、CI か、操作の前に止めるフックか、permissions.deny（指定した操作を、モデルの判断より前に拒否する設定）で止める"
  - "エージェントを替えたあと、同じ指示の遵守を測り直す"
decision_criteria:
  - "その文は、変更されたファイルに痕跡が残って、合格と不合格が決まるか"
  - "生成した検査を、人が見てから CI に入れるか"
  - "Claude が 200 行未満で遵守が落ちにくいと書く CLAUDE.md（Claude 用の指示ファイル）と、Codex が 32 KiB 超を切る読み込み合計とを、超えていないか"
  - "リポジトリの概要を足して成功率が上がる前提にせず、コストの増減は対象のリポジトリで測るか"
limitations:
  - "指示が無いコミットとの比較はなく、指示ファイルが遵守を上げたとは言えない。公開 GitHub と Copilot、Claude Code、Codex の 3 つに限る"
  - "観測可能（変更されたファイルを見て遵守を判定できる、というラベル）の精度は 85.0% で、そのラベルが付いた 6,552 件は上限である"
  - "例を条件にしてしまう誤りは遵守率を下げる。対象外のコミットへの根拠なしの真（採用した検査スクリプト 4,123 件の 62.3%）は適用の絞り込みが除き、二つのどちらが大きいかは未定量である"
  - "検査の対象になるかは、変更されたファイルに痕跡が残るかで決まる。検査そのものは変更前と変更後の全文を見るので、触る前からあった違反を、そのコミットの非遵守に数えることがある"
  - "論文が示す再計算用の一式は 2026-11-12 に開けず、数値の再計算はできない。フックと CI が 37.3% を減らすか、割れの原因、別の環境で同じになるかは分かっていない"
unknowns:
  - "両端への割れが、モデルの既定の動作なのか、指示の書き方なのか"
  - "非公開リポジトリと、この 3 つ以外のエージェントで同じ分布になるか"
reviewed: true
