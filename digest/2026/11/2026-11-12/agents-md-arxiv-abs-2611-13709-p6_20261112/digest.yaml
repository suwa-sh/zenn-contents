source:
  title: "AGENTS.mdなどの指示は成果物検査で守られるものと守られないものに分かれる"
  url: null
  path: "notes/zenn/articles/agents-md-arxiv-abs-2611-13709-p6_20261112.md"
  primary:
    - title: "Do They Do as They Are Told?"
      url: "https://arxiv.org/html/2611.13709"
  retrieved_at: "2026-11-13"
archetype:
  primary: research
  secondary: [decision]
one_liner: "成果物から検査できた AGENTS.md などの指示は、常に守られるか一度も守られないかに割れます。"
key_points:
  - claim: "測定の単位は指示 1 件です。自動生成した検査プログラムが、コミットで変更されたファイルから守ったかを判定します"
    evidence: "### 測定の単位 / ### 候補から検査スクリプトまで"
    status: fact
  - claim: "指示ファイルから取り出した文のうち、測れたのは 13.8% です"
    evidence: "### 候補から検査スクリプトまで"
    status: fact
  - claim: "測れた指示の 54.4% は、検査したコミットすべてで守られ、37.3% は一度も守られません"
    evidence: "### 遵守率の分布"
    status: fact
  - claim: "コードに残る規約の指示は、テストの有無や実行の指示より守られます"
    evidence: "## どの種類の指示が成果物に残るか"
    status: fact
mental_models:
  - type: structure
    key_message: "指示の文のうち、変更されたファイルに痕跡が残るものだけが検査対象になる。検査できた指示は、常に守る側、一度も守らない側、その中間に割れる"
    reason_needed: "ファイルに書いたことと、成果物の検査で守られたことを同じだと読むと、置けない指示までファイルに残す"
example:
  description: "「プルリクエストの前に lint を実行する」は、実行してもコミット後のファイルに痕跡が残らないことがあります。痕跡が残らない指示は、検査の対象になりません"
  hypothetical: false
  evidence: "## ファイルに残すものと外で止めるもの"
applicability:
  - "指示ファイルの文を、守られたか検査できる形に書き直すときです"
  - "禁止事項や承認が要る操作を、CI や権限設定で止めるときです"
decision_criteria:
  - "その文は、成果物だけで合格と不合格が決まるか"
  - "エージェントを替えたあと、遵守を測り直したか"
limitations:
  - "指示が無いコミットと比べていないため、守られたのが指示ファイルの効果とは言えません"
  - "対象は公開 GitHub と、Copilot・Claude Code・Codex の 3 つです"
  - "Copilot の遵守率は Claude Code より高いですが、製品の優劣としては読めません"
  - "抜き取りでは、自動生成した検査の 28.7% が指示を正しく実装していませんでした"
  - "CI などの外の仕組みが、守られない指示を実際に減らすかは分かっていません"
unknowns:
  - "両端への割れが、モデルの既定の動作なのか、指示の書き方なのか"
  - "非公開リポジトリと、この 3 つ以外のエージェントで同じ分布になるか"
reviewed: true