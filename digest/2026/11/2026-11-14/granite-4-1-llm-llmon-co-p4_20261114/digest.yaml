source:
  title: "Granite 4.1のLLMONは指示と外部文を別ブロックで渡す"
  url: null
  path: "notes/zenn/articles/granite-4-1-llm-llmon-co-p4_20261114.md"
  primary:
    - title: "IBM Granite ブログ（2026-11-12）"
      url: "https://huggingface.co/blog/ibm-granite/llmon-an-llm-native-markup-language-now-in-granite"
    - title: "Shbita ほか、Post-Training Large Language Models with LLMON、arXiv:2610.38120v1"
      url: "https://arxiv.org/abs/2610.38120"
    - title: "granite-4.1-3b-llmon-preview"
      url: "https://huggingface.co/ibm-granite/granite-4.1-3b-llmon-preview"
    - title: "ツールキット generative-computing/llmon"
      url: "https://github.com/generative-computing/llmon"
