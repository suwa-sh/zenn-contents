type: structure
title: "許可した送信元と当日ログで記録と遮断を分ける"
message: "連続試行は、許可した送信元と当日のログが一致するかで、試験の記録と遮断の判断に分かれる"
source: "notes/zenn/articles/ai-cloudflare-adapting-to-p6_20261114.md"
components:
  - id: trial
    label: "連続試行"
    meaning: "同じ発信元が短い時間に、パスや結果を変えながら続く試行"
  - id: record
    label: "試験の記録"
    meaning: "許可した試験の取り決めと当日のログが一致した送信元の試行を残す先"
  - id: decide
    label: "遮断の判断"
    meaning: "取り決めと当日のログが一致しない送信元の試行を回す先"
relationships:
  - from: trial
    to: record
    label: "許可した送信元と当日ログが一致"
  - from: trial
    to: decide
    label: "一致しなければ回す"
omitted:
  - item: "操作者、計画役、並列の実行役、資産の図、試行の図"
    reason: "公開面から見る単位は連続試行であり、内部の役割分担はこの図の分岐に不要なため"
  - item: "流量制御、異常検知、ボット判定、スキーマ検査、脅威情報"
    reason: "届く通信の検査の置き場所であり、許可した試験と遮断の分け方ではないため"
  - item: "公開アプリ以外の管理画面、診断用の入口、遠隔操作の入口をインターネットから消す作業"
    reason: "届いてはいけない面の設計変更であり、届いた試行の分岐とは別の判断なため"
  - item: "当番の遮断と解除の権限"
    reason: "遮断できるかの条件であり、送信元で分ける関係そのものではないため"
layout:
  direction: left-to-right
  aspect_ratio: "16:9"
evidence:
  - "正規の診断との境界: 契約に載った送信元の列は診断の記録に残し、載っていない列は止める判断へ回す。共有プロキシや当日に変わった送信元は、契約があっても当日の除外にならない"
