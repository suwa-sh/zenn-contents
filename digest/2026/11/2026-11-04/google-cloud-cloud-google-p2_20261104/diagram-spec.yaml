type: structure
title: "常時の費用は説明文で、本文は起動したときだけ"
message: "常時の費用は名前と説明。本文と付属は、起動したセッションだけが払う"
source: "notes/zenn/articles/google-cloud-cloud-google-p2_20261104.md"
components:
