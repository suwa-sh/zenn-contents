    reason: "図の主張は費用を払う主体の分離であり、起動判断の中身ではない"
  - item: "五つの規則、不合格の行、道具ごとの測定範囲"
    reason: "採用条件の一覧であり、常時費用と起動後費用の分離とは別である"
  - item: "一覧 30,000 文字と 8,000 文字、説明 1,024 文字"
    reason: "閾値の区別は確認項目に残し、図の関係には入れない"
layout:
