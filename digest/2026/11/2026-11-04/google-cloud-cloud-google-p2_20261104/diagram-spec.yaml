    meaning: "手順書を共通の置き場へ入れ、利用者がまとめてインストールする一覧"
  - id: level1
    label: "名前と説明"
    meaning: "セッション開始時に、カタログ内の全手順分が載る"
  - id: owner
    label: "カタログを入れた側"
    meaning: "リポジトリまたはワークスペース。起動しなくてもセッションごとに払う"
  - id: body
    label: "本文と付属"
    meaning: "手順書の本文と、スクリプト、参照、付属ファイル"
  - id: session
    label: "起動したセッション"
    meaning: "その手順を起動したときだけ、本文と付属を読む"
groups:
  - id: always
    label: "毎セッション"
    members: [level1, owner]
  - id: on_use
    label: "起動したとき"
    members: [body, session]
relationships:
  - from: catalog
    to: level1
    label: "開始時に全件載せる"
  - from: level1
    to: owner
    label: "起動しなくても払う"
  - from: level1
    to: body
    label: "起動したあと読む"
  - from: body
    to: session
    label: "そのセッションが払う"
omitted:
