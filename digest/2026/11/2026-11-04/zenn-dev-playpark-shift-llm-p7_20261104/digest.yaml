source:
  title: "シフト作成で不足ゼロが最短勤務の違反を隠す"
  url: null
  path: "notes/zenn/articles/zenn-dev-playpark-shift-llm-p7_20261104.md"
  primary:
    - title: "playpark「LLM vs 貪欲法 vs 混合整数計画」"
      url: "https://www.playpark.co.jp/blog/shift-scheduling-llm-vs-greedy-vs-mip-solver"
    - title: "Zenn 転載 shift-scheduling-llm-vs-greedy-vs-mip-solver"
      url: "https://zenn.dev/playpark/articles/shift-scheduling-llm-vs-greedy-vs-mip-solver"
  retrieved_at: "2026-11-05"
archetype:
  primary: decision
  secondary: [research]
one_liner: "シフトを順に埋めた3つの規模では、不足が0でも最短勤務の違反が22件、54件、67件と報告されている。別の置き方では、短すぎる勤務は営業時間そのものが短い日を除き候補を作らず、不足は時間帯と人数で返す。"
key_points:
  - claim: "ブログの表は3シナリオとも不足0で、最短勤務の違反を22件、54件、67件と報告している。不足だけを見ると最短勤務に気づかない"
    evidence: "LLMの下書きと貪欲法 / 三つのシナリオで支持できる範囲"
    status: fact
  - claim: "LLMの案は貪欲法の初期値にしか入らない。1枠でも必要人数に届かなければ捨て、生の案がそのまま出荷する表になる道はない"
    evidence: "LLMの下書きと貪欲法"
    status: fact
  - claim: "必要人数はソフト制約で、足りない1人時（不足1つに置く単位）の重みは1000、勤務1時間の重みは1。短すぎる勤務は、営業時間そのものが短い日を除き候補を作らない"
    evidence: "混合整数計画の式 / ソルバに渡した規則"
    status: fact
  - claim: "指示の「違反0」と「必要人数はソフト」は、人が足りない月では両立しない。不足を違反件数に入れて0を完了条件にすると、不足つきの表がテストの失敗になる"
    evidence: "エージェントへの指示と、不足の完了条件"
    status: fact
  - claim: "検査が最短勤務を見ていても、組み立てる側が下限より短い勤務を出せるなら、その勤務は表に残る。数える指標を増やしても、その勤務をまだ出せる間は足りない"
    evidence: "業務テストを二つの一覧に分ける"
    status: fact
mental_models:
  - type: structure
    key_message: "不足が0でも最短勤務の違反は別の検査。短すぎる勤務は営業時間そのものが短い日を除き候補から除き、不足は時間帯と人数で返す"
    reason_needed: "不足0と最短勤務を一つの完了条件に混ぜると、違反が隠れるか、不足つきの表が失敗になる"
example:
  description: "2026年10月の1か月。最短勤務の違反は、5人が22件、15人が54件、40人が67件。いずれも不足0"
  hypothetical: false
  evidence: "LLMの下書きと貪欲法 の表"
applicability:
  - "割当の完了条件を、種類を混ぜた「違反0」の1本にしている"
  - "業務テストを、出せない形と、人数の不足（0でなくても表にしてよい）に分ける"
decision_criteria:
  - "表に出たら不合格の形は、候補を作る段階で除外し、例外の名前を書いているか"
  - "人数の不足は、時間帯と人数で返し、件数は別の検査にしているか"
  - "不足0を、最短勤務の検査の代わりにしていないか"
  - "人が足りない月で、ソフトな不足を違反件数の0に混ぜていないか"
  - "LLMの案を、必要人数の不足が残ったまま出荷する表にしていないか"
limitations:
  - "使える範囲は、この貪欲法の3つの規模と、記事が書いたソルバの手順まで。貪欲法一般へ広げると弱く、別の公式例（Google OR-Tools の従業員スケジューリング）は短い勤務を変数に出さない"
  - "3シナリオの入力、採点定数25個の中身、最短勤務の下限の数字は公開されていない。件数は再計算できない"
  - "「必ず守る」と「同じ結果（時間切れを除く）」は本文より強く、必要人数は不足へ逃がせる。返る割当は、時間切れ、ギャップ（上界と下界の相対差がこの割合以下なら探索を終えてよい）、罰則と勤務時間の合計が同じ別案、ソルバの版で変わりうる"
  - "紹介ページが生成前の制約として書く休憩、連勤上限、週次労働時間は、この比較の式に入っている証拠ではない。店長の上書きは別の記事の話"
unknowns:
  - "予約の固定と休暇の括弧内の数字の単位、1日の上限が時間か本数か、6通りと型6が同じものかは、比較記事に書いていない"
  - "小中大の固定シナリオが5人、15人、40人と同じかは、記事に書いていない"
  - "highs@1.15.4 で同じ最小例が10時台の不足を返すかは解いていない。内包するソルバのコミットは1.15.3と同じ"
reviewed: true
