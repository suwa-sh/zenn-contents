source:
  title: "朝の攻撃兆候確認で、赤を「人が動く必要」に揃える"
  url: null
  path: "notes/zenn/articles/zenn-dev-stock-inc-ai-daily-p7_20261108.md"
  primary:
    - title: "毎朝のセキュリティ確認をAIに任せたら、判定の基準が「人が動く必要があるか」に変わった"
      url: "https://zenn.dev/stock_inc/articles/ai-daily-security-check-criteria"
  retrieved_at: "2026-11-09"
archetype:
  primary: governance
  secondary: [decision]
one_liner: "朝の攻撃兆候の報告は、色を「今日だれが動くか」に揃え、検知の全件は赤でなくても別の記録に残す。"
key_points:
  - claim: "朝の読み取りは、平日の朝に許可された読み取りだけを行う。読むのは監視の数値とアラーム履歴、ログの検索、アカウントの管理操作の記録、通信を許す範囲の設定である。共有ノートには件数と色を書き、実行者、操作、未確認、走査したログの量は技術レポートに残す"
    evidence: "朝の読み取りエージェントとは / 読む操作と止まる操作 / 二つの出口"
    status: fact
  - claim: "最終的な5色は「人が動く必要があるか」である。赤はすぐ動く、黄は被害が未確認で人の確認待ち、緑は何かあったが説明がつくので黄にせず担当を付けない、青は何も起きていないので担当を付けない、白は見られていない範囲で共有ノートには出さない。ウェブの入口で遮断されただけの未調査も緑に混ざり得る。走査が届かなかった残りは黄ではなく、白と同じく共有ノートには出さず技術レポートに残す"
    evidence: "五つの色 / 完了条件"
    status: fact
  - claim: "緑にした操作も技術レポートに残す。共有ノートには送信元 IP と利用者の識別子を書かない"
    evidence: "二つの出口"
    status: fact
  - claim: "初期は何かが起きたら赤で、社員の通常作業でも毎週赤になった。公開記事は、毎週赤だとだれも赤を読まなくなる、と書いている。その後は、社員のアカウント、社内回線、パスワードに加えて別の確認を求める認証がすべて揃えば緑、1件でも違えば赤にする。証跡の停止のように、だれがやっても赤のものは残す"
    evidence: "色の基準が動いた順 / 状態と担当を分ける"
    status: fact
  - claim: "朝の読み取りの完了条件は、検知の網羅と今日の担当を別の出力にすることである。黄に期限のある確認担当は株式会社Stockの公開記事には無く元記事が足しているが、期限の長さはどちらにも書かれていない"
    evidence: "完了条件 / 公開本文に無いもの"
    status: fact
mental_models:
  - type: structure
    key_message: "共有ノートに出すのは赤、黄、緑、青だけである。緑は何かあった側、青は何も起きていない側で、どちらも担当を付けない。白は見えていない範囲で共有には出さず、赤でなくても実行者と操作は技術レポートに残す"
    reason_needed: "色を「今日だれが動くか」と、検知の全件の記録とを、同じ出口に混ぜないため"
example:
  description: "赤は証跡の停止のようにすぐ人が動く。黄は被害が未確認で人の確認待ち。白は見られていない範囲で、共有ノートには出さず技術レポートだけに残す"
  hypothetical: false
  evidence: "五つの色 / 二つの出口"
applicability:
  - "朝のセキュリティ確認の色を、検知の有無ではなく今日だれが動くかで揃えたい"
  - "共有する色と、実行者や未確認の記録を、別の出力にしたい"
  - "社員の通常作業で毎週赤になり、赤の意味が薄れた運用を直したい"
decision_criteria:
  - "作成、更新、削除、コンテナやデータベースへの接続、権限変更を、読み取りの許可に混ぜず、人が判断するまで止めているか"
  - "証跡の停止のように1件で人が動く事象を、直近7日の中央値（同じ長さの窓と比べる基準）へ吸収せず残しているか"
  - "操作の名前だけで鳴る警報（公開を塞ぐ操作でも同じ名前なら鳴る）と、見た範囲に無かったことを「無い」と言う断定の、両方を、証跡の停止を赤に残すこととは別に、そのまま色にしていないか"
  - "この朝の確認を、PC を開いていない日も動くリアルタイム監視の代わりにしていないか"
  - "規制や契約が人の日次閲覧を求めるとき、自動の色だけで足りるとしていないか"
limitations:
  - "株式会社Stockの1社の運用記録であり、他社で再現した測定データセットではない"
  - "直近7日の中央値は見逃しが無い方式としては読めない。遅い増加を平常へ取り込みうるという侵入検知一般の記述であり、この中央値が見逃した実測ではない"
  - "緑にするときの社員のアカウント、社内回線、パスワードに加えて別の確認を求める認証は、操作した主体が本人である証明としては読めない。盗んだセッションで認証済みに見える余地は一般論であり、当該環境の事例は未確認"
  - "黄の期限の長さ以外に、複数の色を1日にまとめる手順、手元の PC 以外へ読み取り権限を出すか、人が見た時刻は、株式会社Stockの公開記事に無い"
unknowns:
  - "冒頭の「3回」が本文のどの変更を指すか。日付は記事に無い"
  - "技術レポートの実ファイルに、色と材料と閲覧時刻が既にあるか"
  - "黄の自動投稿に担当と期限と再通知があるか"
  - "複数の色を1日の総合判定へどう一つにするか"
  - "手元の PC をやめて、読み取り権限を別の実行環境へ置くか"
reviewed: true
