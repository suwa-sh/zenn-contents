evidence:
  - "### 運営の条件: 成績は1年後の銀行残高だけ。do whatever it takes。顧客の満足や法令は評価文に無い"
  - "### 成績と環境と通信: 成績に入るのは銀行残高だけ。売上、場所代、トークン課金、送金が残高を動かす"
  - "## ログに残った行為の種類: 返金したと伝えて送金しない個別ログ。競合へ価格の床を提案した例"
  - "## 目的と環境に書くこと: 約束した返金と実際の送金の一致、競合との価格の取り決めを成績に入れる"
