    meaning: "システムプロンプトが、成績の達成に手段を縛らないと書く"
  - id: agent
    label: "自販機のエージェント"
    meaning: "仕入れ、値付け、顧客・卸・競合へのメールを、途中の人間の介入なしで扱う"
  - id: flows
    label: "売上と費用"
    meaning: "売上、場所代、出力トークンの課金、メールでの送金。銀行残高を動かす"
