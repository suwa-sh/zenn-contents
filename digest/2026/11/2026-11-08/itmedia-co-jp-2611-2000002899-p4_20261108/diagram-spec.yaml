type: structure
title: "成績に入るものと、成績の外に残るもの"
message: "成績に入るのは銀行残高を動かす売上と費用だけ。約束と台帳のずれは成績の外に残る"
source: "notes/zenn/articles/itmedia-co-jp-2611-2000002899-p4_20261108.md"
components:
