archetype:
  primary: decision
  secondary: [incident]
one_liner: "切替完了は、新基幹の起動に加え、出荷と繰越で渡したキーが一意に一件を指すまでです。"
key_points:
  - claim: "TOYO TIREの日本の初期トラブルは、1月から6月の営業利益影響が42億円である"
    evidence: "日本拠点で会社が書いた流れ / 注意点"
    status: fact
  - claim: "出荷先が分からないことは公開の冒頭、繰越が反映されないことは次の見出しである。二つの決算説明をテキスト化した範囲では、この障害の説明にその語はない"
    evidence: "切替完了の判定とは / 出荷先と月またぎは、どの資料の文か"
    status: fact
  - claim: "42億円の内訳は、販売23億円と製造19億円である"
    evidence: "日本拠点で会社が書いた流れ"
    status: fact
  - claim: "2026年1月の日本拠点の移行で、国内向けの出荷が乱れた"
    evidence: "日本拠点で会社が書いた流れ"
    status: fact
mental_models:
  - type: structure
    key_message: "渡したキーで、新基幹が倉庫の現物と出荷の同一件を指す"
    reason_needed: "起動の先にある完了条件が、どの識別子とどの一件の関係か"
example:
  description: "42億円は1月から6月の営業利益影響である。関税の42億円は四半期ごとの別の行で、上期の営業利益の減少約107億円も別の行である"
  hypothetical: false
  evidence: "42億円に見える別の行"
applicability:
  - "基幹切替の完了を、起動の先まで決めるとき"
  - "出荷と繰越の試験を、切替前に置くとき"
  - "42億円を営業利益影響として引用するとき"
decision_criteria:
  - "出荷先が空なら、切替前に不合格とするか"
  - "月の途中でも、繰越と未出荷が翌月の同じ一件に残るか"
  - "キーと、指す一件と、空で止まる業務を台帳に残すか"
  - "42億円を、在庫の簿価と別の行に書いたか"
  - "42億円の引用を、この会社の事例に限っているか"
limitations:
  - "キーの合格は、運用を基幹の手順へ合わせ終えたことまでは含まない"
  - "想定を超える受注で処理が追いつくかは、キーの空欄を見る試験では分からない"
  - "製造19億円は、四半期への配分には使わない"
  - "月またぎの見出しが、この会社の障害かは確定できない"
  - "有料本文が、出荷先が分からないことをこの会社の事象ではないと書いていれば、出荷の試験は仮説に戻す"
unknowns:
  - "有料本文が、出荷先不明の対象期間、本数、42億円の出典段落をどう書いているか"
  - "月またぎの見出しが、この会社の障害の説明か、特集の別の節か"
  - "8月7日に残っていた未出荷が、11月16日時点で残っているか"
  - "製造コストの内数△19億円が、1月から6月の製造コスト列△15億円とどう関係するか"
reviewed: true
