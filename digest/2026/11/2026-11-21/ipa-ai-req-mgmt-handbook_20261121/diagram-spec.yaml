  - "問い合わせ分類の受入条件に何を書くか (重大案件の再現率は、人が確認する前に AI が重大と判定した割合で測る)"
  - "問い合わせ分類の受入条件に何を書くか (「高リスクと判定したら人が確認する」という条件だけでは、通常と誤判定した重大案件は確認対象から外れる)"
