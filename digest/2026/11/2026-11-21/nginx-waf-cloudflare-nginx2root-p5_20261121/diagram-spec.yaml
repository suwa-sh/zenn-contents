type: structure
title: "プロキシの終端で塞がる経路と残る経路"
message: "プロキシで塞がるのは、終端を通る HTTP/2・HTTP/3 の経路だけ"
source: "notes/zenn/articles/nginx-waf-cloudflare-nginx2root-p5_20261121.md"
components:
  - id: attacker
