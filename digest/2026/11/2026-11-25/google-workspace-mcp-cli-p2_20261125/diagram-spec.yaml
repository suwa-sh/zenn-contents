evidence:
  - "Google Workspace MCPとは: 入口は製品別MCP、公式CLI、Agent Gatewayの3つ。データへ入るのはMCPとCLI。GatewayからMCPへつなぐのはGemini Enterpriseの任意構成。従来アプリはRESTのまま"
  - "システムコンテキスト図: 従来アプリはRESTへ、エージェントはMCPとCLIとGatewayへ。RESTとMCPとCLIはWorkspaceデータへ。GatewayはCloudのツールとAPIへ。GatewayからMCPは任意"
