source:
  title: "DeNAのAI社員はトークン使用量を勤務時間、上限を残業上限と呼ぶ"
  url: null
  path: "notes/zenn/articles/dena-itmedia-co-jp-aiplus-p3_20261125.md"
  primary:
    - title: "DeNAニュースリリース「AI社員 by DeNA」（2026-11-20）"
      url: "https://dena.com/jp/news/5481/"
    - title: "サービスサイト「AI社員 by DeNA」"
      url: "https://ai-shain.dena.com/"
    - title: "DeNA Engineering「同僚として組織に迎える」（2026-08-04）"
      url: "https://engineering.dena.com/blog/2026/08/ai-employee-introduction/"
    - title: "公式note「17体の1か月」（2026-11-10）"
      url: "https://note.com/dena_ai_shain/n/n52664780a88f"
  retrieved_at: "2026-11-26"
archetype:
  primary: governance
  secondary: [decision]
one_liner: "DeNAのAI社員（部署のエージェント）は、トークン使用量を勤務時間、上限を残業上限と呼びます。"
key_points:
  - claim: "アカウントは、個人に紐づかないエージェント用です。"
    evidence: "DeNAのAI社員とは（アカウントは特定の個人に紐づかない固有のもの。部署に配属する）"
    status: fact
  - claim: "削減時間は、AI社員が見積もった、人がやらなくて済んだ時間です。"
    evidence: "注意点 / 勤務時間と呼ばれるものが二つある（AI社員自身の日報・週報が、人がやらなくて済んだと見積もった時間）"
    status: fact
  - claim: "約52.6時間は、会計システム担当のAI社員が、8営業日の自分の日報と週報で見積もった削減時間です。"
    evidence: "52.6時間は2026年7月1日から10日の削減時間である（会計システムの開発・保守に配属。窓は8営業日。集計はAI社員自身の日報・週報）"
    status: fact
  - claim: "破棄するか、保留するか、人が再開するかは、公開されていません。"
    evidence: "残業上限は停止の手順としては公開されていない（上限に達した作業を破棄するか、保留するか、人が再開するかは確認できない）"
    status: fact
  - claim: "契約、発注、採用の最終判断は、人に残します。"
    evidence: "DeNAのAI社員とは（契約や発注の最終承認、採用の合否判定は人に残す）"
    status: fact
mental_models:
  - type: structure
    key_message: "勤務時間はトークン使用量の呼称です。削減時間とは別の数字です。"
    reason_needed: "削減時間の自己申告を、トークン使用量の呼称と同じ列で読まないため"
example:
  description: "先の約52.6時間は、そのAI社員の月の代表値ではありません。"
  hypothetical: false
  evidence: "52.6時間は2026年7月1日から10日の削減時間である（会計システムの開発・保守。52.6時間の週は1体あたりの月次の代表値ではない）"
applicability:
  - "AI社員の30人と17体を、同じ時点の人数と読む前です。"
  - "削減時間を、いつもの成果として書く前です。"
  - "上限の呼称を、停止手順として写す前です。"
decision_criteria:
  - "上限の期間と閾値を決める人を名指ししましたか。"
  - "上限に達した未完了は、保留して人が再開すると書きましたか。"
  - "人の評価に、勤務時間と呼ぶ消費を混ぜていませんか。"
  - "アカウントの発行主体を、契約の一文にしましたか。"
  - "費用、成果、勤務時間へ写した消費を三行に分けましたか。"
limitations:
  - "勤務時間について公開されているのは、呼称までです。"
  - "30人と17体の差を説明する名簿は、公開されていません。"
  - "Teams で頼めるかは、近日対応と、頼めるという説明に分かれます。"
  - "発行主体は、導入企業と書く資料と、提供側と書く資料があります。"
  - "料金は、初期費用と、使った分を含む月額です。"
unknowns:
  - "トークン使用量を時間へ換算する式と、集計の周期"
  - "上限を決める人の名前と、上限に達したあとの破棄・保留・再開"
  - "30人の内訳と、11月10日の17体との差を説明する名簿"
  - "Teams で仕事を頼めるのが、近日対応か、頼めると読める説明か"
  - "アカウント発行が導入企業か提供側か"
reviewed: true
