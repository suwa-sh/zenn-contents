archetype:
  primary: decision
  secondary: [governance]
one_liner: "この記事は、比較の正解と、許す違いと許さない違いと、切替の合否を別に置きます。"
key_points:
  - claim: "刷新はアプリとインフラを新しく作り、データベースの表構造と既存機能と業務ロジックは原則として維持する"
    evidence: "価格.comのDODAIとは"
    status: fact
  - claim: "現行と同じ振る舞いが条件で、仕様書から作った内側のテストは書いていない違いを合格にする"
    evidence: "どこまでがこの1実験の観察か"
    status: fact
  - claim: "管理システム1件で、方式と生成AIの組をそれぞれ1回だけ比べた"
    evidence: "二つの作り方"
    status: fact
  - claim: "細かい工程と同じ生成AIで目標だけ渡した方式は、データベースに接続できていない"
    evidence: "二つの作り方"
    status: fact
  - claim: "価格.comの刷新で今も使うのは、細かい工程の方である"
    evidence: "注意点 / 二つの作り方"
    status: fact
mental_models:
  - type: structure
    key_message: "切替の合否は、隠した入力で動いている新旧を比べて決める"
    reason_needed: "比較の正解、許す違いと許さない違い、切替の合否が別の置き場であることが、矢印の向きで見えるため"
example:
  description: "管理システム1件で、方式と生成AIの組をそれぞれ1回。細かい工程の内側の自動テストは 514/520、外から見た振る舞いは 32/65。目標だけ渡す方式の外は、別の生成AIで 65/65。"
  hypothetical: false
  evidence: "二つの作り方 / 採点の表"
applicability:
  - "現行と同じ振る舞いを、満たすべき条件にした作り直しのとき"
  - "外からの採点が無いとき"
  - "残りを増やす前に、手順を終えた画面も外から測るとき"
decision_criteria:
  - "テストは、現行から作った仕様書から作っていますか。"
  - "比較の正解は、動いている現行のコードと画面ですか。"
  - "許す違いと許さない違いは、採点の仕組みの外にありますか。"
  - "手順を終えたURLの割合を、切替の合否から外していますか。"
  - "作る側から隠した入力で、動いている新旧の振る舞いを比べましたか。"
limitations:
  - "2026年9月の本番はユーザー向け1カテゴリで、比べた管理システムとは別である"
  - "切り替えを決める側は、非公開の自作採点を再実行できない"
  - "外から見た点数の分母は、ページ数ともURLの数とも一致しない"
  - "認証、認可、画面権限の移行は未確認である"
  - "現行の不具合を正解に含めるかは、切り替えを決める側が別に決める"
unknowns:
  - "外から見た点数の1件が、ページなのかURLなのか"
reviewed: true
