  aspect_ratio: "16:9"
evidence:
  - "候補を足してから、人が決める（AIの候補は意思決定材料であり、そのまま採用しない。決めたシナリオは受入基準になる）"
  - "ストックの文書と、ハーネスの検査（依存の向きのテストや lint は毎回同じ結果になる）"
  - "維持するモデルを実装の入力にする（名前、多重度、ルールをテキストにし、コードの名前を現行のモデルへ極力合わせる）"
