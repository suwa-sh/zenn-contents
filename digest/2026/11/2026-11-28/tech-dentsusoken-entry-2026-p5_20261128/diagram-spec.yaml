evidence:
  - "隔離。ホストには認証情報、SSH エージェント、注入プロキシを残す。VM の中のエージェントが見るのは sentinel。注入プロキシは、宛先が許可と一致した HTTP にだけ、本当の認証ヘッダーを付けて外へ出す"
  - "隔離の図。agent は sentinel 付きの要求を proxy へ送り、secrets は proxy へ入り、proxy は一致ドメインへ実ヘッダーを出す"
  - "マウントと、VM から見える秘密。プロキシ管理が有効なとき、本当の資格情報はホストに残る。VM が見るのは sentinel"
