evidence:
  - "構造 / システムコンテキスト の mermaid（AIクライアントはMCP over HTTPSでリレーへ、拡張はWebSocketでリレーへ、リレーはツール結果をクライアントへ返す。クライアントは拡張へ直接つながらない）"
  - "利用 / サイトごとの同意（誰とつなぐかと、どのサイトを見せるかを別々に決める。未許可サイトの本文を読むときに承認窓が開く）"
  - "データ / 概念モデル（ページ本文と画像は呼び出しのあいだリレーを通過し、リレーのセッション情報としては保存しない）"
