archetype:
  primary: decision # 二つの公表の関門を並べ、切替前に足す欄を決める
  secondary: [governance] # 非機能の不合格だけで切替を止める署名欄
one_liner: >-
  年間数億円規模と書かれた SaaS の本番置換でも、完了は機能の消化では切らない。
  切替の前に、実装を指示した人とは別の人が、性能、セキュリティ、運用、デプロイの不合格だけで止められる欄を置く。
key_points:
  - claim: "たけ氏の記事は、旧 SaaS の実行エンジンを、開発1人と事業担当1人、実装は Claude Code で半年かけ本番まで進めた自己申告である。条件は、非機能を人間が制御し続けたことと、旧挙動を知る事業担当である"
    evidence: "## SaaSの本番置換と顧客別カスタマイズとは / ### たけ氏の記事が置き換えた実行エンジン"
    status: fact
  - claim: "旧利用料の「年間数億円」と、生成 AI を使う前に社内で取ったリプレイス見積もりの「数年ｘ数億円規模」は別対象の自己申告で、社名も原票も無い。前後比較は旧利用料と置換後の AWS 費（年間数百万円）だけで、人件費、AI の利用料、外部診断費は入っていない"
    evidence: "### 金額、一致、テスト、リリース回数"
    status: fact
  - claim: "三井住友ファイナンス＆リースの公式 PDF は、顧客別の画面を足す手法を、プロンプト入力時の制御、非機能の確定、生成後の独自検証など、と定義する。企業固有の画面や機能の開発を、6人で約半年を要すると想定したものと、1人で1週間で実現したものとして比較し、対象により異なると断っている"
    evidence: "### SMFLの公式リリースが定義したサービス / ### 速度の数字と、出典が分かれる関門"
    status: fact
  - claim: "「コードをほぼ読まない」と、人が仕様、テスト、境界を持ち続ける、は同じ記事に並ぶ。事業担当の役割は受け入れテストで、非機能の不合格を返す権限ではない"
    evidence: "### コードを読まない、という宣言の幅 / ## 非機能の不合格で切替を止める欄"
    status: fact
  - claim: "「振る舞いは100%一致させなければならない」は要求として書かれ、一致率の測定値は無い。互換の差分は実行エンジン側で吸収し、登録済みスクリプトは直さない"
    evidence: "### 金額、一致、テスト、リリース回数 / ### 二つの公表が置いた関門"
    status: fact
mental_models:
  - type: structure
    key_message: "署名欄が、四つの非機能の不合格だけで切替を止める。たけ氏の記事では、設計と切替が開発者本人に重なる。この欄は、たけ氏の記事と公式 PDF が満たした条件の写しではなく、発注側が切替の前に足す"
    reason_needed: "たけ氏の条件文は、人間が非機能を意識し AI を制御し続けた、と書き、別の名前の拒否権は出てこないため"
example:
  description: "デプロイと並行運用で踏んだとする三件のうち、管理系の大量処理が利用者画面を詰まらせた件は性能、古い JavaScript による 404 はデプロイに当たる。同時実行による重複記録は四つのどれか一つとは書かれていないので、署名欄の不合格理由には足さない"
  hypothetical: false
  evidence: "### 止める対象を四つに揃える"
applicability:
  - "外部 SaaS の実行エンジンを自社へ置き、切替の定義を契約に書くとき"
decision_criteria:
  - "署名欄の名前が、実装を指示した人とは別か"
  - "不合格の対象が、性能、セキュリティ、運用、デプロイの四つに揃っているか"
  - "たけ氏の金額と診断結果を、原票が無いのに見積もりや契約の根拠にしていないか"
  - "公式 PDF に書いてあることと、会見報道を、一つの出典に混ぜていないか"
limitations:
  - "署名欄に、実装を指示した人とは別の名前が無いと失敗する、という反例は今回の資料に無い。記事は本番稼働まで進んだと書く"
  - "納品前のソースコード診断と、内部のソースを前提にしない侵入試験の「緊急・高はゼロ」は本人の要約である。ベンダー名、診断基準、中・低の件数、開始前から不合格にする権限が契約にあったかは書かれていない"
  - "v1.0.0 以降、約5か月で62回の本番リリースがある、と記事は書く。障害対応か計画リリースかの内訳と、トラブル三件が切替の後かは不明である"
  - "決定論的テストと人手の最終確認は公式 PDF ではなく ITmedia の会見報道にある。非機能を確定する人が、プロンプトを書いた人と別人かは、公式 PDF からは決まらない"
  - "＠IT 訳の 2025年6月原稿は、自然言語で意図を伝え生成 AI に実装を委ねる開発を、現段階では本番に出さないよう推奨する。英語原文が 2026-11 の現行文面かは未確認で、たけ氏のシステムを検査した文書でもない"
unknowns:
  - "62回のリリースのうち、障害対応がどれだけか。トラブル三件が本番切替の後か"
  - "外部診断のベンダー名、診断基準、中・低の件数、開始前からの拒否権"
  - "非機能を確定する人が、プロンプトを書いた人と別人か"
  - "決定論的テストで、何を同じ入力とみなし、誰がテストを所有するか"
  - "2025年6月原稿の英語原文が、2026-11 時点の Gartner の現行文面か"
reviewed: true
