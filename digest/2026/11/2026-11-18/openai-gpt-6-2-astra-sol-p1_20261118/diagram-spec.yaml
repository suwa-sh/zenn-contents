  - item: "見た目が主でない画面操作から Sol への矢印"
    reason: "図の画面操作は見た目判断が主のものに限る。主でない作業は本文で Sol と書くため"
  - item: "公開単価、272,000 の倍率、Ultrafast、課金段"
    reason: "伝えたいことはモデル ID の置き分けであり、単価の境は本文に残すため"
  - item: "ChatGPT の GUI、Responses API、Agents API の三つの操作面"
    reason: "モデル ID の置き分けとは別の関係であり、実行者の違いは本文に残すため"
  - item: "gpt-6-astra、gpt-6.2-astra-law、Daybreak"
    reason: "経路に混ぜない ID と、セキュリティ試験の前提であり、作業から ID への矢印ではないため"
layout:
