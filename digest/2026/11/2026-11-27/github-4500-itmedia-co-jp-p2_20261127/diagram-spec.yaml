evidence:
  - "画面の文書と、入力の文書（同じ生のMarkdownが、人の画面とエージェントの入力で別の文書になる。issue、pull request、コメントで検証済みの2,281件は、すべてHTMLコメント）"
  - "画面の文書と、入力の文書の mermaid（raw から rendered と model に分かれ、model から visible と HTMLコメントの両方へ進む）"
