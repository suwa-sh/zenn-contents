omitted:
  - item: "READMEの不可視なUnicode、背景と同色の数式、CSSによる非表示"
    reason: "issue側の検証済みはすべてHTMLコメントで、図の主張は画面と入力の差だから"
  - item: "投稿者で隠しテキストを残すか落とすかの受付"
    reason: "伝えたいことは画面と入力が別の文書であること。受付の条件は本文の適用で扱う"
  - item: "攻撃の件数、用途の内訳、オフライン再生で従った件数"
    reason: "件数は核心ポイントと具体例に書き、図は関係だけを示す"
layout:
