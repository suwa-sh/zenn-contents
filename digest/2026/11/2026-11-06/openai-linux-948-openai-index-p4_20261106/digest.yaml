source:
  title: "OpenAIがLinuxカーネルで数えた権限昇格の修正案948件"
  url: null # Zenn 下書き (published: false)。公開 URL なし
  path: "notes/zenn/articles/openai-linux-948-openai-index-p4_20261106.md"
  primary:
    - title: "A thousand fewer paths to root"
      url: "https://openai.com/index/a-thousand-fewer-paths-to-root"
    - title: "Introducing GPT-6 Cyber"
      url: "https://openai.com/index/introducing-gpt-6-cyber/"
  retrieved_at: "2026-11-07"
archetype:
  primary: decision # 948 をどの単位で引用し、どの数を混ぜないか
  secondary: [research] # 公開記事の自己申告を、段ごとの件数として読む
one_liner: >-
  948は、ローカル権限昇格（低い権限から強い権限へ上がる欠陥）が動いた本数ではない。
  1,169本を畳んだ修正案の件数で、開示304件や取り込みとは別である。
key_points:
  - claim: "11月4日の記事の見出し、要約、ファネル図は、948を動作したエクスプロイトとも呼ぶ。1,169本と異なる修正案948件を分けているのは、詳細節だけである"
    evidence: "## 注意点 の冒頭"
    status: fact
  - claim: "情報漏えいの実証291件は、隔離した環境で再現した1,724件から分かれた別の枝で、1,169本との差ではなく、948にも入らない。948は、権限昇格1,169本をバリアント分析（似た欠陥を、異なる修正案の件数へまとめる段）で畳んだ数である"
    evidence: "## Linuxカーネル向け自律パイプラインとは の、図の直後の段落"
    status: fact
  - claim: "重大な所見（11月5日の記事が開示数に使う呼び方）304件は、修正案つきでメンテナ（カーネルの変更を本線へ取り込むかを決める人）に開示した数である。948全件を送ったとは書いておらず、取り込み件数でもない"
    evidence: "### 送った件数と、取り込んだ件数 / ## 四つの状態で書く"
    status: fact
  - claim: "修正案を作った側が報告前に見ることは、メンテナが本線へ取り込むことの代わりにならない。前者は外に出す前の関所、後者は差分と、いつ開示するかも決める関所である"
    evidence: "## 四つの状態で書く"
    status: fact
  - claim: "仮の賞金額（受け取った賞金ではなく、競技の1件あたりの額を948回掛けた評価額）には、満額を足す条件が規則に無いことを置く。約45倍（kernelCTF、すなわち対象カーネルと報酬を規則で定める競技、に合わせた別実行で、受理されれば約150万ドルという評価をその費用で割った比）には、その実行でメモリ割り当ての緩和を外したことと権限昇格21件の満額受理とは書いていないことを、5倍超（948件と、7月の重複を除いた権限昇格166件との比）には、費用もカーネルの時点も件数の定義も揃っていないことを、置く"
    evidence: "## 倍率には条件を添える / ### 費用と賞金の倍率 / ### 過去の実行と並べるとき"
    status: fact
mental_models:
  - type: structure
    key_message: "948は1,169本を畳んだ修正案であり、開示304件や取り込み件数ではない"
    reason_needed: "見出しが948を動作したエクスプロイトと呼び、304や取り込みと一段に読めるため"
example:
  description: >-
    引用は次の一文に揃える。OpenAIは、2026年10月中旬の実行で、動作したローカル権限昇格1,169本から異なる修正案948件を作り、2026年11月5日時点で重大な所見304件を修正案つきで開示した、と自ら書いている。取り込み件数は公開されていない。
  hypothetical: false
  evidence: "## 四つの状態で書く の引用の単位"
applicability:
  - "948を、動いたエクスプロイトの件数として引用しそうなとき"
  - "開示304件を、送付の完了や採用率の分子にしそうなとき"
  - "費用や賞金の倍率を、条件のない成果として並べそうなとき"
decision_criteria:
  - "948は修正案、1,169は動作したエクスプロイト、として分けたか"
  - "送付数は304件だけを引用し、11月4日の記事が書く数百件の報告と修正案を304に足していないか"
  - "スキャンと手動分析が10日で終わった時点の観測（本線でパッチ済みの61、本線の前のパッチ43、公開の場で報告または議論されている299）を、OpenAIの修正案が取り込まれた数として置いていないか"
  - "仮の賞金には満額を948回足す条件が規則に無いことを、約45倍にはメモリ割り当ての緩和を外したことと21件がそれぞれ満額で受理されるとは書いていないことを、5倍超には費用とカーネルの時点と件数の定義が揃っていないことを、それぞれの文に置いたか"
  - "カーネルの版、レビュー件数、数の包含が未知でも、948を修正案として引用することは止めず、止めるのは採用率、送付完了、賞金収入、モデルの単価比較である"
limitations:
  - "人が行単位で見た差分の件数、受理率、却下率は、記事に無い"
  - "10月の実行のカーネル commit と、デスクトップのディストリビューション名は、記事に無い"
  - "61、43、299、304、948が互いに含まれるかは、記事が結んでいない"
  - "11月4日の記事はこの実行のモデルを upcoming cyber model（これから出るサイバー向けモデル）と呼び、11月5日の記事は同じ948と1,724を GPT-6 Cyber の成果として書く。snapshot の ID は、どちらの記事にも無い"
  - "2026-11-06に公開の議論の場を検索した範囲では、メンテナが948件を確認した、または取り込んだ、という記事は見つからなかった。全メールを読み切った証明ではない"
unknowns:
  - "948件のうち、提案のままの件数と、OpenAIの修正案が取り込まれた件数"
  - "304件以外に、その後送られた件数"
  - "10月の実行のカーネル commit と、デスクトップのディストリビューション名"
  - "人が行単位で見た差分の件数と、却下した割合"
  - "再現しなかった分の、モデルの誤解析 3.1% の分母"
  - "61、43、299、304、948の包含関係"
  - "11月4日の upcoming model と、11月5日の GPT-6 Cyber が、API のどの snapshot か"
reviewed: true
