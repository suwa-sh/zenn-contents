source:
  title: "Bloombergのリポジトリ移行は決定的処理とLLMを段階で分ける"
  url: null
  path: "notes/zenn/articles/bloomberg-llm-arxiv-abs-p6_20261106.md"
  primary:
    - title: "Hybrid LLM–Deterministic Pipelines for Enterprise-Scale Code Migration at Bloomberg"
      url: "https://arxiv.org/abs/2611.05457"
  retrieved_at: "2026-11-07"
archetype:
  primary: decision
  secondary: [architecture]
one_liner: "Automated Uplift は、決定的な段階と、LLM が書いてよい成果物とを、型ごとに分ける。"
key_points:
  - claim: "決定的な処理（LLM を呼ばず、同じ入力に同じ手順を適用する処理）に固定するのは、型への分類、文脈の収集、プロンプトの組み立て、検証である。検証の規則はモデルに渡さない。検証に落ちた再実行は、エラーを文脈に足して LLM へ戻し、上限は 3 回である。合格後の PR 説明も LLM が書く"
    evidence: "## Automated Upliftとは / ## 段階ごとに固定する境界"
    status: fact
  - claim: "成果物の形はアーキタイプ（ビルド記述の揃い方で分けた型）で変わる。会社の定義まで揃った C++ は決定的な生成器だけである。CppBuild（CMake へ移す前の C++ ビルド方式の仮名）の定型では、LLM が JSON を抽出し、テンプレートが CMakeLists を書く。Python の包装（依存や設定を含め、配布できる形にまとめること）は、LLM がファイルを直接編集する"
    evidence: "## Automated Upliftとは / ## キャンペーンでLLMが書く差分"
    status: fact
  - claim: "抄録の 729 件（Python 31 と C++ 698）は 2026-06-30 時点のマージ件数である。評価対象の PR は 2,333 件で、過半数は判断が無い。判断が無いとは、開いたまま、または更新の無い PR を自動で閉じたもので、開発者が拒否して閉じた件数とは別である。論文が費用の中心として書くのは、所有チームのレビュー、テスト、配備である"
    evidence: "### 729件はマージ件数である"
    status: fact
  - claim: "PR を出さない判断と、未完成のまま出す判断は、再実行とは別の規則である。前者は、データ収集が安全に移行できないと示したときである。後者は件数の少ない型で、未完成とラベルした起点 PR（所有チームが仕上げる前提の PR）を出す"
    evidence: "## 検証に落ちたあとの手順 / ## 段階ごとに固定する境界"
    status: fact
  - claim: "人日は、構築チーム（このパイプラインを作った著者たち）の見積もりで、C++ がタスクあたり約 2 人日、Python が 1〜2 人日である。同じリポジトリの人手時間の前後も、所有チームの人日も測っていない"
    evidence: "### 人日と実行時間は実測の前後比較ではない"
    status: fact
mental_models:
  - type: structure
    key_message: "LLM が書いてよいものは、ビルド記述が揃っているほど検査できる形に狭まる。揃い切った型は LLM を通さない"
    reason_needed: "同じ 5 段階だと、どの型でも LLM がファイルを書く、と読むと見積もりの行が分かれる場所を誤る"
example:
  description: "2026-04-30 までに開いた評価対象の PR の、2026-06-30 時点の帰結。Python の包装はマージ 31（10.5%）、開発者が未マージで閉じた 64（21.8%）、判断が無い 199（67.7%）。C++ のビルド系はマージ 698（34.2%）、開発者が未マージで閉じた 165（8.1%）、判断が無い 1,176（57.7%）。分母は評価対象の PR である"
  hypothetical: false
  evidence: "### 729件はマージ件数である"
applicability:
  - "リポジトリが分かれ、所有チームが PR を受け取り、正しさをパイプラインの中でかなりのところまで検査できる移行を発注する"
  - "形式が揃い PR の前にビルドとテストが通る型と、ばらつく型を、見積もりの行で分ける"
decision_criteria:
  - "約 20 リポジトリ以下の型は、専用パイプラインを作らず、起点 PR か人手にする"
  - "触ってよい差分は、組んだ文脈の中のファイル編集か、スキーマ付きの抽出に限り、検証は LLM の自己判断に含めない"
  - "再実行の上限、PR を出さない条件、起点 PR は別箇条にし、「失敗したら決定的な処理へ戻す」とは書かない"
  - "費用は、生成の計算時間と、所有チームのレビュー、テスト、配備に分け、後者はこの論文の数値では埋まらない"
  - "上の人日を単価に使うなら、実測ではないと欄外に書く"
limitations:
  - "根拠は対照実験のない 1 社の経験報告である。仮説検定も信頼区間も無く、データとソースは公開されていない"
  - "候補（母集団の概数）は揃っていない。C++ は約 6,700 とタスク合計 6,121 で、PR 列の合計 2,137 と評価対象の C++ 2,039 も、差の説明が無い"
  - "論文の導入が引用する合格率 91.3% と 15.3% は、別論文のベンチマークの平均であり、このキャンペーンのマージ率ではない"
  - "Python と C++ の差は、検査の深さだけには帰せない。開始時期、リスクの見え方、レビュー支援、母集団の揃い方が同時に違う"
  - "1 つの変更が影響箇所へまとめて入るモノレポ（複数コンポーネントを 1 リポジトリに置く構成）では、リポジトリごとの PR 着地は同じ形にならない"
unknowns:
  - "モデル更新で外した前処理のどれかは、この記事の記述では特定されていない"
  - "チーム定義とコード生成の 2 型が、CppBuild 定型の内訳かは、論文の表と図だけでは対応づけられない"
  - "候補数の差（約 6,700 と 6,121、PR 列の合計と評価対象 2,039 の差）の説明は論文に無い"
  - "所有チームがレビュー、テスト、配備に使った人日は測っていない"
  - "ランタイムの本番ログを足したことによる精度の差は測っていない"
reviewed: true
