source:
  title: "Microsoft 365復旧後のメール遅配を1通の配送状態で切り分ける"
  url: null
  path: "notes/zenn/articles/microsoft-365-xtech-nikkei-p4_20261115.md"
  primary:
    - title: "Microsoft 365 Status、アクセスとメールフロー（2026-11-13 20:05 UTC）"
      url: "https://x.com/MSFT365Status/status/2121333700591857878"
    - title: "Microsoft 365 Status、残る顧客への復帰（2026-11-14 06:09 UTC）"
      url: "https://x.com/MSFT365Status/status/2121485746334777593"
    - title: "新しい管理センターのメッセージトレース"
      url: "https://learn.microsoft.com/en-us/exchange/monitoring/trace-an-email-message/message-trace-modern-eac"
    - title: "Graph sendMail"
      url: "https://learn.microsoft.com/en-us/graph/api/user-sendmail?view=graph-rest-1.0"
  retrieved_at: "2026-11-16"
archetype:
  primary: incident
  secondary: [decision]
one_liner: "Microsoft 365 の復旧後、再送は1通の配送状態で判断します。"
key_points:
  - claim: "サインインが先に戻っても、配送は追いつく途中になり得ます。"
    evidence: "時刻ごとの公式投稿 / 2026-11-13 20:05 UTC"
    status: fact
  - claim: "送信 API が返す 202 は、メールの受理です。"
    evidence: "送信 API が返す受理"
    status: fact
  - claim: "配送結果を見られないときは、送信者へ戻る知らせだけを届かなかった記録にします。"
    evidence: "トレースを開けない手順に残る記録"
    status: fact
  - claim: "Failed か未達通知のときだけ、同じ文面を送ります。"
    evidence: "障害窓の通常メールは、状態が確定してから再送する"
    status: fact
  - claim: "期限のあるコードや案内は、届くのを待たず、期限の前に新しいものとして送ります。"
    evidence: "障害窓の通常メールは、状態が確定してから再送する / ワンタイムパスワード、会議の開始、期限のある承認"
    status: fact
mental_models:
  - type: structure
    key_message: "期限の無いメールの同じ文面は、Failed か未達通知のあとで送る"
    reason_needed: "受理、配送の途中、Delivered を届かなかったことと分けるため"
example:
  description: "架空の例として、請求の PDF が Pending のままなら、同じ PDF をすぐ重ねない。"
  hypothetical: true
  evidence: "障害窓の通常メールは、状態が確定してから再送する"
applicability:
  - "期限の無い業務メールを再送する前"
  - "送信 API の 202 を完了にしているとき"
  - "配送結果を照会できない送信手順のとき"
decision_criteria:
  - "その通は、届いたか届かなかったかが決まっていますか。"
  - "Pending のあいだ、コネクタ、MX、送信経路を変えていませんか。"
limitations:
  - "11月14日の復帰は、残る顧客へのサービス復帰です。溜まったメールの処理完了は、この復帰では未確認です。"
  - "Delivered は、人が読んだことまでは示しません。"
  - "迷惑メールや検疫でも、状態は Delivered になり得ます。"
  - "届かなかった通数は、公開されていません。"
  - "事後報告書は、11月15日時点で未確認です。"
unknowns:
  - "管理センターの最終文が、キュー完了を含めて閉じているか"
  - "48 時間の延長がいつ戻ったか"
  - "自テナントの障害窓に、Pending のままのメールが残っているか"
reviewed: true
