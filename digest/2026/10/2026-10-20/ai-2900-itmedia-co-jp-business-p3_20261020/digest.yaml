source:
  title: "世田谷区の生成AI試行が示した約2900時間の数え方"
  url: null # Zenn 下書き (published: false)。公開 URL なし
  path: "notes/zenn/articles/ai-2900-itmedia-co-jp-business-p3_20261020.md"
  primary:
    - title: "ITmedia ビジネスオンライン、濱川太一（2026-10-19）"
      url: "https://www.itmedia.co.jp/business/articles/2610/19/news064.html"
    - title: "Genspark株式会社プレスリリース（2026-03-26）"
      url: "https://prtimes.jp/main/html/rd/p/000000007.000176655.html"
    - title: "世田谷区「DXの取組みの見える化」（ページ表示の最終更新日 2026-08-21）"
      url: "https://www.city.setagaya.lg.jp/01000/18436.html"
    - title: "世田谷区、2026年9月16日定例会の会議録"
      url: "https://www.city.setagaya.lg.jp/documents/29172/20260916teireikaiud.pdf"
    - title: "総務省「自治体における生成AI導入状況（令和7年度）」（令和8年4月24日版）"
      url: "https://www.soumu.go.jp/main_content/001070295.pdf"
  retrieved_at: "2026-10-21"
archetype:
  primary: governance # 削減時間の定義と、公的資料がどこまでその数字を支えているか
  secondary: [decision] # 発注側が効果の表にどの列を置くか
one_liner: >-
  約2900時間は、講演を伝える記事が置く14業務・約3カ月の合計である。
  確認や検討へ戻した分を引いた残りとしては、開いた公開資料から認定できない。
key_points:
  - claim: "約2900時間は、2026年8月27日の講演を2026年10月19日のITmediaが伝えた数字である。区の「DXの取組みの見える化」、3月30日の区長会見、9月16日の定例会会議録には、14業務も約2900時間も無かった"
    evidence: "冒頭 / ### 約2900時間を純減の空き時間とは読めない / ### 講演で語られたことと、区が測り終えたこと"
    status: fact
  - claim: "一例の150分は、整理から検討への移動であり、その人のその案件の総労働時間が150分減ったこととは別である。約2900時間の内訳に入るかは、記事に書いていない"
    evidence: "### 150分は整理作業から検討への移動 / ## 発注側が効果の表に置く列"
    status: fact
  - claim: "2026年3月26日の導入発表にある年間約2,000〜2,600時間は、業務ツールの利用ログではなく、対話型AIの1人あたり週約36分の削減を70名へ伸ばした予想である（70人×週36分×52週＝2,184時間は、その幅に入る）。約3カ月を13週と置いた同じ検算は546時間で、約2900時間とは別の集計であり、その桁の差は誤りの証拠にはできない"
    evidence: "## 世田谷区の生成AI試行とは / ### 週36分の年間見込みは別の予想"
    status: fact
  - claim: "同じ導入発表の、約150課×各10名の1,500名で年間約2.1万〜3.9万時間は、70名の試行結果ではなく、約2900時間を掛けない。東洋経済オンラインの事例スライドにある広報紙の校正（年間約54時間）は、約2900時間と足し引きしない"
    evidence: "## 世田谷区の生成AI試行とは / ### 別の媒体の業務時間は足し合わせられない / ### 同じ「時間」でも表が違う"
    status: fact
  - claim: "確認と修正の負担が増えていることは講演者の定性的な認識であり、増えた時間も修正回数も記事には無い。発注側はグロス、再投入、ネット、定義、期間と人数と業務名を同じ表に置く"
    evidence: "### 確認と修正の負担増は時間になっていない / ## 発注側が効果の表に置く列 / ## まとめ"
    status: fact
mental_models:
  - type: structure
    key_message: "約2900時間、一例の150分、年間の見込み、全庁の試算は別の箱である。ネットは再投入を引いた差であり、記事の純減（確認や検討へ戻した分を引いた残り）と同一ではない"
    reason_needed: "別資料の時間を一つの純減へまとめると、講演の報道を全庁試算や空き時間の実績として使えるように見えてしまうため"
example:
  description: "計画の整理は240分から90分になり、空いた150分は検討へ戻した。グロスも再投入も記事上は150分で、この1件のネットはゼロに見える。150分が約2900時間の内訳に入るかは不明なので、この1件を14業務全体のネットには広げない"
  hypothetical: false
  evidence: "## 世田谷区の生成AI試行とは / ### 150分は整理作業から検討への移動 / ## 発注側が効果の表に置く列"
applicability:
  - "自治体やベンダーの「削減時間」を、自分の成果表へ載せるとき"
  - "生成AIの試行で、効果測定の票に何を置くか決めるとき"
  - "講演で語られた時間を、全庁の人数へ掛けてよいか判断するとき"
decision_criteria:
  - "その時間は、元の作業から減った時間か、確認や検討へ戻した分を引いた残りか"
  - "自己申告か、標準時間×件数か、ツールのログか、が書いてあるか"
  - "期間、人数、業務名が、その時間と同じ行にあるか"
  - "週36分の年間見込み、全庁の試算、別媒体の業務時間を、約2900時間へ足したり掛けたりしていないか"
  - "確認、差し戻し、再生成の増分を、時間か少なくとも有無と件数で票に持っているか"
limitations:
  - "約2900時間の式、14業務の一覧、その人数に試行の70名が含まれるか、約3カ月の開始日と終了日は、開いた資料に無い"
  - "同じ記事のアンケートは、伴走のあとで指示の出し方と成果物の品質が上がった、という別の問いであり、確認時間の増分を集計した調査ではない"
  - "9月16日以外の会議録はこの確認範囲に無く、登壇スライドの原本が残っているかも開いた資料に無い。読めた会議録では、約2900時間は会議での応答の成果指標になっていない"
  - "総務省の令和7年度調査は、自治体の回答例を並べ、見込みと実績が混ざる。削減時間は監査済みの全国統計ではなく、世田谷区の約2900時間はその調査時点より後で資料に無い"
  - "式と確認時間を引いたネットが公開され、そのネットに再投入が残っていないと分かるなら純減として扱える。確認の増分がグロスに対してごく小さいと測られたならネットはグロスに近い。どちらも開いた資料には無い"
unknowns:
  - "約2900時間は、自己申告か、標準時間×件数か、ツールのログか"
  - "約2900時間を計上した人数に、試行の70名が含まれるか"
  - "「約3カ月」の開始日と終了日"
  - "確認、差し戻し、再生成に増えた時間。ゼロに近いか、150分の再投入のように元の短縮を食い尽くすか"
  - "登壇スライドの原本が残っているか"
  - "9月16日以外の会議録に、同じ数字があるか"
reviewed: true
