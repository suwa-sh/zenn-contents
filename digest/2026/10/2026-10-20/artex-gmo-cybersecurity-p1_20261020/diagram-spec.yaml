    label: "送信元、対象パス、許可の有無"
    meaning: "許可のない試行として扱う前に確かめる3つ。許可の有無は、許可した記録があるかどうか"
  - id: unauthorized
    label: "許可のない試行"
    meaning: "送信元、対象パス、認可が揃ったときの扱い"
