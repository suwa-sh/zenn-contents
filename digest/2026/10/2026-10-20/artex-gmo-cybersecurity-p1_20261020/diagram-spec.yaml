type: structure
title: "許可の台帳と連続試行"
message: "台帳に無い連続試行は先に調べ、許可が無いと分かったときだけ許可のない試行になる"
source: "notes/zenn/articles/artex-gmo-cybersecurity-p1_20261020.md"
components:
