archetype:
  primary: governance # 許可の台帳と連続試行を、製品名より先に置く
  secondary: [incident] # 攻撃元インフラでの使用確認と、公開本文が届かない範囲
one_liner: >-
  GMOサイバーセキュリティ byイエラエは、2026年10月19日、日本企業向け侵害の攻撃元でARTEXの使用を確認したと書く。
  防御の単位は製品名ではなく、許可の台帳と、そこに無い連続試行（周期と継続がある一連）である。
key_points:
  - claim: "ARTEXは、LLMを接続して使う自律型ペネトレーションテストのオーケストレーションである。操作者が目標と範囲を渡し、plannerが意図を切り、workerが1件ずつ実行する。結果は資産図（会社に属する共有の台帳）と探索図へ書き戻され、承認ゲートと認証済みタブの取り込みは、公開面の列挙とは別経路である"
    evidence: "## ARTEXとは / ### 承認ゲートとコンソール / ### 1回の探索の流れ"
    status: fact
  - claim: "2026年10月19日の増分は、前回のツール名のない推定から、攻撃元インフラ上のARTEX使用確認へ進んだことである。調査したインフラの標的は約20社、うち9社が同業種で、観測範囲ではほぼ日本のみである。確認した標的のうち、2026年9月から10月に漏えいの公表を出しているのが8社で、約20社の内数かは本文だけでは確定できない"
    evidence: "## 2026年10月19日の記事で増えた観測 / ### 社数の分母"
    status: fact
  - claim: "この公開本文の結論に含めないのは、同じ記事の後半で挙がる、AIを使った攻撃インフラ6台の全部がARTEXであること、韓国の金融機関キャンペーンと同一犯であること、日本側が認証後まで進んだことである。6台の各台をARTEXとは書いていない。韓国との「同じ手口」は推察である"
    evidence: "### 確認の表明 / ## いまの公開本文から言えること"
    status: fact
  - claim: "公開資料の到達は三層に分かれる。外部の公開面から始まる資産、操作者が渡した認証済み通信、足がかりの先（侵入のあと、対象上での実行や、さらに奥のホストへ進む範囲）である。日本の事案がどの層かは、GMOの本文に無い"
    evidence: "## 公開資料の上で到達が分かれる三層"
    status: fact
  - claim: "防御で見る単位は製品名でもUser-Agentでもない。許可の台帳と、台帳に無い連続試行（周期と継続がある一連）を同時に見る。台帳に無いものは先に調べ、送信元、対象パス、許可の有無が分かり、許可が無いときだけ、許可のない試行とする"
    evidence: "## 防御側は許可の台帳と連続試行を同時に見る"
    status: fact
mental_models:
  - type: structure
    key_message: "台帳に無い連続試行は、送信元、対象パス、許可の有無を調べ、許可が無いときだけ許可のない試行になる"
    reason_needed: "製品名の検知に戻らず、台帳に無い試行は調査であり、許可が無いと分かってから許可のない試行になると示すため"
example:
  description: >-
    正規の診断として台帳に残す代表は、対象（ホスト、パス、環境）と承認者である。ほかの項目は元記事の防御の節にある。
  hypothetical: false
  evidence: "## 防御側は許可の台帳と連続試行を同時に見る"
applicability:
  - "公開記事が、自律型ペネトレーションテストの名前を攻撃元インフラに結びつけたとき"
  - "診断に似た連続試行を、攻撃として残すか正規の診断として残すか決めるとき"
  - "製品名やUser-Agentだけを検知条件にする提案を見るとき"
decision_criteria:
  - "公開本文が「使用を確認」と書いているか、「同じ手口」や「推察」と書いているか"
  - "その確認が、公開面、認証済み通信、足がかりの先のどれに対応するかが本文にあるか"
  - "連続試行の送信元が、その期限の許可の台帳にあるか"
  - "対象パスが、許可した公開面の中か、ログインしないと届かないAPIか"
  - "製品名やUser-Agentを、単独の決定条件にしていないか"
limitations:
  - "公開本文に、個々のリクエストと各社の侵害結果を結ぶログは無い。読者が追えるのは、調査主体による確認の表明までである"
  - "6台のうちARTEXと確認できた台数、前回記事の数百IPと続報のインフラが同じ送信元かは、閉じていない。前回の数百IPは特定事案の説明ではない、と記事自身が断っている"
  - "製品名も単一のUser-Agentも、使用や侵害成功の決定的証拠にはしない、と元記事が引くAhnLabは書く。別名の再配布とは、製品名や画面を変えて配り直した版のことであり、GMOが観測したホストがそれらの版だった証拠ではない"
  - "試行間隔だけを攻撃とみなすと、正規の診断と死活監視に当たる。台帳への書き忘れも、不一致だけでは攻撃と閉じない"
  - "製品のREADMEは利用を、所有するか明示的に認可された対象に限ると書く。これは、日本向けインフラがどの機能を使ったかの記録ではない"
unknowns:
  - "日本側の確認が、公開面の探索、認証済み通信の取り込み、足がかりの先のどれに対応するか"
  - "6台のうちARTEXと確認できた台数"
  - "前回記事の数百IPと、続報のインフラが同じ送信元集合か"
  - "韓国側のlikelyとmoderate confidenceを、日本側の確認がどこまで共有するか"
  - "上流リポジトリが解決できない理由が、削除か、非公開か、移転か"
reviewed: true
