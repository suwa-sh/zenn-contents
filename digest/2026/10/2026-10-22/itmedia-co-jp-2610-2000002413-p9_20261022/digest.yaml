source:
  title: "侵害されたアットリンクを再稼働せず別環境へ移す案内の読み方"
  url: null # Zenn 下書き (published: false)。公開 URL なし
  path: "notes/zenn/articles/itmedia-co-jp-2610-2000002413-p9_20261022.md"
  primary:
    - title: "株式会社メドレー「当社サービス『アットリンク』への不正アクセス及びサービスの一時停止に関するお知らせ」2026年10月15日"
      url: "https://ssl4.eir-parts.net/doc/4480/tdnet/2895027/00.pdf"
    - title: "アットリンク「アットリンクへの不正アクセスおよびサービスの一時停止に関する最新情報」（最終更新の表示 2026年10月22日10時）"
      url: "https://at-link.net/information/%e3%82%a2%e3%83%83%e3%83%88%e3%83%aa%e3%83%b3%e3%82%af%e3%81%b8%e3%81%ae%e4%b8%8d%e6%ad%a3%e3%82%a2%e3%82%af%e3%82%bb%e3%82%b9%e3%81%8a%e3%82%88%e3%81%b3%e3%82%b5%e3%83%bc%e3%83%93%e3%82%b9%e3%81%ae/"
    - title: "同じページの Wayback（最終更新の表示 2026年10月20日23時）"
      url: "https://web.archive.org/web/20261021050957/https://at-link.net/information/%e3%82%a2%e3%83%83%e3%83%88%e3%83%aa%e3%83%b3%e3%82%af%e3%81%b8%e3%81%ae%e4%b8%8d%e6%ad%a3%e3%82%a2%e3%82%af%e3%82%bb%e3%82%b9%e3%81%8a%e3%82%88%e3%81%b3%e3%82%b5%e3%83%bc%e3%83%93%e3%82%b9%e3%81%ae/"
    - title: "NIST SP 800-61 Rev. 2（2012年8月、Computer Security Incident Handling Guide）"
      url: "https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-61r2.pdf"
    - title: "厚生労働省「医療情報システムの安全管理に関するガイドライン」第7.0版 システム運用編"
      url: "https://www.mhlw.go.jp/content/10808000/001716295.pdf"
  retrieved_at: "2026-10-23"
archetype:
  primary: decision # 再稼働、別環境、医院側の受付を被害範囲の確定前から分けて書く
  secondary: [incident, governance] # 停止と案内の読み方、委託先との役割分担
one_liner: >-
  メドレー（アットリンクの提供者）は、止まったアットリンクを再稼働せず別環境へ移すと案内した。
  10月22日10時、別環境の開始は遅れ、目処は無い。手順を書く側は、医院側の代替を、その開始とは別に書く。
key_points:
  - claim: "2026年10月20日23時の公式案内は、これまでの系統（これまで提供していたアットリンクの環境）を再稼働せず、別環境の新サービス「@link クラウド β版」へ予約・患者データ等を移すと書いた。2026年10月22日10時の同じページは、10月22日朝7時以降としていた提供開始が不具合で遅れ、目処は立っていないと書いた。不具合の内容は書いていない"
    evidence: "冒頭 / ## アットリンクとは / ### 2026年10月22日10時の分かれ方 / ### 朝7時は再開が完了した時刻ではない"
    status: fact
  - claim: "787件は、漏えいが確定した医療機関数ではない。2026年10月15日の適時開示（株式会社メドレーが出した開示文書）は、漏えいの対象となる可能性のある医療機関は、最大で、アットリンク等を利用している全医療機関（787件）だと書いている"
    evidence: "### 787件は確定した漏えい件数ではない"
    status: fact
  - claim: "器（別環境）を新しくする案内と、移すデータが健全であることは別である。公式が移すと書くのは予約・患者データ等までで、known good（汚染されていないと扱えるバックアップの世代）とも、不正に作られた ID の無効化とも書いていない"
    evidence: "三つの分岐の表「データの扱い」 / ## 戻さないことを唯一の手順にはしない / ## 手順に先に置く四つの確認 の 3"
    status: fact
  - claim: "患者向けのアットリンクアプリと Web 予約は、2026年10月22日10時の本文でも停止の列にある。運用マニュアルと予約一覧ファイルは、10月16日19時と10月22日10時の公式が案内している"
    evidence: "### 停止のままの機能 / ### 停止中に医院へ案内されたもの / 三つの分岐の表「この事案で公表されたか」"
    status: fact
  - claim: "手順を書く側は、被害範囲が確定する前から、同じ系統へ戻す案と別環境へ移す案を両方残す。メドレーが再稼働しないと決めたことは、再稼働しないことが常に正しい証明には使わない"
    evidence: "## 戻さないことを唯一の手順にはしない / ## 手順に先に置く四つの確認 の 1 / ## まとめ"
    status: fact
mental_models:
  - type: structure
    key_message: "別環境へ移す案内は、医院側の受付代替と、移すデータの健全性確認を済ませたことではない"
    reason_needed: "再稼働しない、という一文に三つの確認が同時に済んだように読めるため"
example:
  description: "はらメディカルクリニックの告知（Wayback、ページ更新 2026年10月17日）は、電話集中を避けるため別システムを転用して臨時予約サイトを作ったと書いている。同じページは、アットリンクを電子カルテとは別に、予約と受付に使っていると書いている"
  hypothetical: false
  evidence: "## 戻さないことを唯一の手順にはしない"
applicability:
  - "委託先の予約受付が止まったとき、医院の手順を先に書く担当"
  - "別環境への移行案内を、移すデータの健全性と分けて読む担当"
decision_criteria:
  - "運用マニュアル、予約一覧、電話、臨時予約、患者が聞く先が、別環境の開始とは別に名指しされているか"
  - "委託先だけが持つ資料と、医院が見られる運用情報が、拡大防止、原因究明、対外説明で事前に分かれているか"
limitations:
  - "2026年10月22日時点の公式には、移行項目の閉じた一覧、旧環境を止めたか消したか、院内機器を含むか、漏えいの有無が無い"
  - "NIST SP 800-61 Rev. 2（インシデント対応のガイド）の Appendix G は、一から作り直すか known good から戻すかの文であり、別環境へ移す決定そのものではない。この分岐が後継の Rev. 3 に残るかは、この記事は判断しない"
  - "告知が言うオンプレミス型とクラウド型の区別が、製品ページの院内サーバ（@linkパッケージ）と医療機関ごとのクラウド（@link STC）の区別と同じかは、告知だけでは閉じない。β版がどちらの設置向けかも書いていない"
  - "厚生労働省の「医療情報システムの安全管理に関するガイドライン」第7.0版は、侵害された系統を起動するな、とは書いていない。書いているのは、代替、ネットワークの分離、バックアップが既に影響を受けている可能性、不正 ID の無効化、非常時の役割分担である"
  - "2026年10月21日の別告知は、PHP の脆弱性を理由に一部製品を止めたと書いている。10月22日10時時点の同じページは対策を終えたものから再開したと書き、そのページにアットリンクの記載は無く、原因が同じだとは公式は書いていない"
unknowns:
  - "移行した予約・患者データ等の項目の閉じた一覧"
  - "旧環境を止めた、または消した時刻と、院内のオンプレミス機器を含むか"
  - "移したデータが known good であること、不正に作られた ID を無効化したこと"
  - "不具合の内容と、次の開始時刻"
  - "漏えいの有無、漏れた項目、対象になった医療機関の確定"
reviewed: true
