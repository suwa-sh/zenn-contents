archetype:
  primary: governance
  secondary: [decision]
one_liner: "2026年10月15日、AnthropicはMETRの6人に、リスク評価チームとおおむね同水準の社内アクセスを与え始めた。出版は拒否できない。学習や配備を止める権限は、公開ページには無い。"
key_points:
  - claim: "対象はMETRの6人で、他のMETR職員はこの仕事から隔離される。渡すのは会社の機材、オフィス、リスク評価チームとおおむね同水準の社内ツールとシステムである。共有しない例は顧客データ、弁護士秘匿特権、モデルアーキテクチャで、アーキテクチャを原則として外す理由は漏えいリスクが高くリスク評価との関連が通常低いことである。関連が高いときの共有には社内の明示的な承認が要る。この関与は、他組織が自社や顧客、パートナーの情報を得る経路にはしない。"
    evidence: "冒頭 / METRへの従業員相当アクセスとは / 6人が使う条件"
    status: fact
  - claim: "出版の対象はリスク水準、インシデント、実務の分析で、Anthropicに出版の拒否権は無い。狭い事前カテゴリの削除は要求でき、METRは削除した中身を明かさずに、その削除が妥当だったかを公に述べてよい。第1層（SecureBio）は出版にAnthropicの承認が要る。第3層（METR）は従業員相当のアクセスに、第2層と同様の出版権が付く。第2層に組織名は、10月15日の文章には無い。"
    evidence: "6人が使う条件 / 評価者の三つの階層 / 見てから出版するまでの経路"
    status: fact
  - claim: "公開された権限は、見る範囲、書く自由、削除への反論までである。学習、出荷、配備を止める条項は、10月15日の文章にもAmodeiの9月のエッセイにも出てこない。METRは、役割は証拠を集めて渡すことで、開発や配備は決めないと書いている。公開ページに付与が無いことと、非公開契約に停止権が無いことは別である。"
    evidence: "注意点 / 一次資料が支える読み"
    status: fact
  - claim: "従業員相当の比較対象はリスク評価チームであり、表現は roughly on par と、エッセイの mostly comparable である。AI Evaluator Forum の書簡第5項が求める、高度な権限を持つ自社従業員や上級の内部従業員と同じ、とは書かれていない。METR自身も10月14日の提案で、書簡第5項の真の従業員レベルのアクセスは要求しないと書いている。10月15日の契約がこの限界を引き継いだかは、どちらのページも書いていない。"
    evidence: "従業員相当の比較対象"
    status: fact
  - claim: "外部評価を受ける側は、見える範囲と止める権限を別の条項に分ける。削除した中身を明かさずに妥当性を書ける条項は、10月15日の公開条件から写せる。止められるかは、その条項を別に書かない限り、この発表からは出てこない。出版に発注者の承認が要る第1層は、第3層の出版権とは別物として見積もる。"
    evidence: "見える範囲と止める権限 / 発注者が契約に書く二つの項目"
    status: interpretation
mental_models:
  - type: structure
    key_message: "第1層は出版に承認が要り、第3層は従業員相当のアクセスと拒否できない出版を持つ"
    reason_needed: "同じ発表の中に承認が残る調査と、拒否できない出版が並ぶ。一語の「社内アクセス」にまとめると、第1層と第3層が同じ権限に見える"
  - type: behavior
    key_message: "第3層は分析を出版でき、Anthropicは拒否できず、狭いカテゴリだけ削除を要求できる"
    reason_needed: "拒否権が無いことと、削除要求と、削除の妥当性を中身を出さず述べられることが、一つの出版手続きの別々の段だから"
example:
  description: "METRの6人は、会社の機材とオフィスを使い、社内ツールとシステムはリスク評価チームとおおむね同水準である。他のMETR職員は隔離され、働き方はAnthropicのセキュリティ基準の下である。除外例以外では、アライメントリスクを担当する同僚に話すのと同じように情報を共有するよう、従業員は促される。出版対象はリスク水準、インシデント、実務の分析で、出版の拒否権は無く、狭い事前カテゴリの削除は要求できる。"
  hypothetical: false
  evidence: "6人が使う条件"
applicability:
  - "外部評価や委託で、入る人数、比較する内部チーム、触れるシステム、除外リスト、機材、期間を契約に書くとき"
  - "従業員相当や社内に入れた、という発表を、比較対象の文言と先行する接触と切り分けて読むとき"
  - "出版に発注者の承認が残る契約を、第3層の出版権とは別の見積もりにするとき"
decision_criteria:
  - "比較対象はリスク評価チームか、書簡第5項の上級の内部従業員か"
  - "出版の拒否権は無いか。それとも発見の出版に発注者の承認が残るか"
  - "削除できるのは、あらかじめ決めた狭いカテゴリか。不利だから削除できる、とは書かれているか"
  - "学習、出荷、配備を止められるか。止められないなら、その旨を報告書に書く義務があるか"
  - "関与を切れるのはどちらか。切ったとき、書きかけの報告と、切られたという事実を公開できるか"
  - "評価者への資金は、被評価会社が直接出しているか。METRは被評価会社から資金を受けない、と自分に課している"
limitations:
  - "契約本文は非公開である。公開ページに付与が無いことと、非公開条項が無いことは別である"
  - "10月15日の削除の例は、顧客データ、弁護士秘匿、モデルアーキテクチャである。文言は例示であり、この三つが完全なリストとは読めない。エッセイは、セキュリティ上敏感なもの、法的秘匿、商業上敏感なもの、第三者の機密を削除でき、不利だからという理由では削除できない、と書く。どちらのリストが今回の契約を支配するかは公開されていない"
  - "出版を拒否できない、は10月15日の宣言である。この条項で書かれた報告書は、2026年10月16日時点ではない"
  - "参加は任意である。会社が関与を止めうること、その圧力で評価者が相手を刺激しにくくなること、より緩い評価者を選べることを、METRは提案の限界として書いている。不都合な報告の前に契約を終える経路は、拒否権の代わりになりうる"
  - "常駐検査官の制度が持つ是正や停止の命令は、公開されたMETRの役割には含まれない。類推は厳密ではない、とAnthropicは断っている"
  - "社内情報への接触は、2026年3月の約3週間と、2026年9月9日の調査契約に先行例がある。新しいのは、6人、会社の機材とオフィス、リスク評価チームとおおむね同水準、出版の拒否権が無い、という組み合わせである。9月9日の契約と10月15日の常駐が同一だとは、どちらのページも書いていない"
  - "10月15日の文章は、報復からの保護にも、不都合な結論のあとでも資金が続く仕組みにも触れていない"
  - "未公開モデルを審査する、フロンティア企業として初めて社内に入れた、という二次報道の記述は、一次文書と一致しないため元記事は採っていない"
unknowns:
  - "非公開契約に、停止権、持出禁止、報復からの保護があるか"
  - "6人の終期と、見るモデルの範囲"
  - "2026年9月9日の初期8週間の契約と、10月15日の6人の常駐が同一か"
  - "削除カテゴリの完全なリスト。エッセイの商業上敏感と、不利だから削除できない、が今回の契約に残るか"
  - "METRがこの取り決めを自サイトで確認しているか。公開されているMETRの文章は、10月14日の方針と提案である"
  - "打ち切られたとき、書きかけの報告と、切られたという事実を公開できるか"
