source:
  title: "AnthropicがMETRの6人に与えた従業員相当のアクセス"
  url: null
  path: "notes/zenn/articles/anthropic-metr-ft-content-p9_20261016.md"
  primary:
    - title: "An update on independent evaluators"
      url: "https://www.anthropic.com/news/an-update-on-independent-evaluators"
    - title: "We Must Pace the Frontier"
      url: "https://darioamodei.com/post/we-must-pace-the-frontier"
    - title: "A proposal for better informing the public about loss-of-control risks from frontier AI development"
      url: "https://metr.org/blog/2026-10-14-better-informing-the-public-about-loss-of-control-risks/"
    - title: "Minimum Conditions for Embedding Evaluators"
      url: "https://aievaluatorforum.org/initiatives/embedded-evaluation-letter"
  retrieved_at: "2026-10-17"
archetype:
  primary: governance
  secondary: [decision]
one_liner: "2026年10月15日、Anthropicは評価団体METRの6人に、社内のリスク評価チームとおおむね同水準のアクセスを与え始めた。出版は拒否できないが、学習や配備を止める権限は公開文書に無い。"
key_points:
  - claim: "「従業員相当」の比較対象は、全社員でも上級社員でもなく、自社のリスク評価チームである。顧客データ、弁護士秘匿特権、モデルアーキテクチャなどは共有しない。"
    evidence: "6人が使う条件 / 従業員相当の比較対象"
    status: fact
  - claim: "Anthropicは出版を拒否できず、事前に決めた狭いカテゴリの削除だけを要求できる。METRは削除の中身を明かさずに、その削除が妥当だったかを公に述べてよい。"
    evidence: "6人が使う条件"
    status: fact
  - claim: "同じ発表は評価者を三つの階層に分けている。第1層(SecureBio)は出版にAnthropicの承認が要り、第3層(METR)は承認なしで出版できる。"
    evidence: "評価者の三つの階層"
    status: fact
  - claim: "公開された権限は、見る、書く、削除に反論する、までである。METR自身も、開発や配備のgo / no-goは決めないと書いている。"
    evidence: "注意点"
    status: fact
  - claim: "外部評価を頼む側は、見える範囲と止める権限を別の条項として扱う。"
    evidence: "見える範囲と止める権限 / 発注者が契約に書く二つの項目"
    status: interpretation
mental_models:
  - type: structure
    key_message: "第1層は出版に承認が要り、第2層と第3層は承認なしで出版できる"
    reason_needed: "一語の「社内アクセス」にまとめると、第1層と第3層が同じ権限に見える"
  - type: behavior
    key_message: "第3層は分析を出版でき、Anthropicは拒否できず、狭いカテゴリだけ削除を要求できる"
    reason_needed: "拒否権が無いことと、削除要求と、削除の妥当性を述べられることが、一つの出版手続きの別々の段だから"
example:
  description: "METRの6人は会社の機材とオフィスを使い、社内ツールとシステムはリスク評価チームとおおむね同水準である。他のMETR職員は隔離される。出版対象はリスク水準、インシデント、実務の分析で、拒否権は無い。"
  hypothetical: false
  evidence: "6人が使う条件"
applicability:
  - "外部評価や委託診断の契約で、評価者に渡すアクセスと出版権を決めるとき"
  - "「従業員相当」「社内に入れた」という発表が実際に何を渡したかを読むとき"
decision_criteria:
  - "比較対象の内部チームはどこか(リスク評価チームか、上級社員か)"
  - "出版に発注者の承認が要るか、拒否権が無いか"
  - "削除できるカテゴリの完全なリストがあるか"
  - "学習、出荷、配備を止められるか。止められないなら、報告書にそう書く義務があるか"
  - "関与を打ち切れるのはどちらか。打ち切ったとき、書きかけの報告を公開できるか"
limitations:
  - "参加は任意で、会社は関与を止めうる。不都合な報告の前に契約を終える経路は、拒否権の代わりになりうる"
  - "METRが社内情報に触れるのは初めてではない(2026年3月のレッドチーム、9月の調査契約)。新しいのは、6人、会社の機材、出版の拒否権が無い、という組み合わせである"
unknowns:
  - "契約本文は非公開であり、非公開の条項に停止権があるかは分からない"
  - "削除できるカテゴリの完全なリスト(共有しない三カテゴリは例示)"
  - "「出版を拒否できない」条項で書かれた報告書は、2026年10月16日時点でまだ無く、履行のされ方は分からない"
