source:
  title: "連続不正アクセスの公開APIを台帳と認可で止める"
  url: null
  path: "notes/zenn/articles/ai-api-blogs-jpcert-or-jp-p6_20261016.md"
  primary:
    - title: "JPCERT/CC Eyes「連続不正アクセス事案の攻撃手法に関する調査」（2026-10-15）"
      url: "https://blogs.jpcert.or.jp/ja/2026/10/web_api_attacks.html"
    - title: "JPCERT-AT-2026-0030 直近で相次いでいる国内組織における不正アクセスに関する注意喚起（公開 2026-10-08、更新 2026-10-09）"
      url: "https://www.jpcert.or.jp/at/2026/at260030.html"
    - title: "JPCERT-AT-2026-0023 Metabase の SQL インジェクション（CVE-2026-72898）"
      url: "https://www.jpcert.or.jp/at/2026/at260023.html"
    - title: "NICT プレスリリース「アプリ解析からのサーバ攻撃」（2026-10-13）"
      url: "https://www.nict.go.jp/press/2026/10/13-1.html"
    - title: "NICT CYNEX Library 同名の注意喚起（2026-10-13）"
      url: "https://cynex.nict.go.jp/library/261013-01.html"
    - title: "ビットフォレスト WAF Tech Blog「AIエージェントによる攻撃を観測しました」"
      url: "https://www.scutum.jp/information/waf_tech_blog/2026/10/waf-blog-085.html"
  retrieved_at: "2026-10-17"
archetype:
  primary: architecture
  secondary: [decision, incident]
one_liner: "インターネットから応答する面の台帳を先に作り、未修正や認可なしの公開を停止条件にする。公表された送信元は、文書ごとのリストのまま照合する。"
key_points:
  - claim: "レート制限、認可、トークン寿命、不要な公開の停止は、台帳に行が無いと適用先が決まらない。行は、インターネットから応答する面である。"
    evidence: "## 公開面台帳の構築 / ### 公開APIの台帳を先に作る"
    status: fact
  - claim: "停止条件は侵入の成功ではなく、台帳上の面が未修正、認可なし、または設定ファイルやバックアップを露出したまま、インターネットから応答している時点に置く。"
    evidence: "## ベストプラクティス / ### 停止条件を侵入口の公開時点に置く"
    status: fact
  - claim: "公表された送信元は文書ごとのリストのまま、IP として完全一致で照合し、一つの攻撃元へ結合しない。一致してもその IP 単独では侵害を確定せず、期間と User-Agent とパスをセットで見る。"
    evidence: "### 概念モデル / ### 公表された送信元を自社ログで探す / ## 台帳に載せるデータ（2 つのリストを 1 つの攻撃元マスタに結合しない）"
    status: fact
  - claim: "アプリ内の秘密、署名、難読化はサーバの認可の代わりにしない。記事が番号まで照合した API1 は、主体と操作と対象オブジェクトで許可を決める。注意喚起が「両方が要る」と一文で書いたわけではない。外部 URL を取得する API は、同じく照合した API7（SSRF）への対策として、許可したホストをリダイレクトのたびに再判定し、許可外には接続する前に拒否する。"
    evidence: "### アプリ内の秘密を認可の根拠にしない / ### オブジェクト単位の認可をサーバで決める / ### 外部URLを取得するAPIの宛先を固定する"
    status: fact
  - claim: "検知は、他社 WAF のエージェント判定を自社ログへ輸入しない。同じ送信元の手順の変化を前後 8 時間の 1 本の時系列にし、1 種類の欠陥名で閉じない。週次で、本番ルート、バージョン、公表リストの差を台帳へ戻す。"
    evidence: "### 検知は手順の変化を1本の記録にする / ### しきい値は観測値を調査開始の目安にする / ### 週次で公開面と既知脆弱性を突き合わせる"
    status: fact
mental_models:
  - type: structure
    key_message: "台帳が穴の突合とゲートの適用先を決め、手順の変化は台帳へ戻る"
    reason_needed: "公開面台帳、既知の穴、ゲート、アクセスログ、手順変化の 5 単位の向きが、どこで止めるかの判断そのものだから"
  - type: structure
    key_message: "侵害指標は文書に付けたまま、公開面へは点検と対策だけをつなぐ"
    reason_needed: "話し手が複数あり、送信元リストを一つに結合すると、正規利用の注記と別観測を落とすから"
example:
  description: "記事が台帳の形として置いた例であり、実在の被害組織の行ではない。member-profile は自社が所有者、委託先が operator、kind は mobile-backend、audience は customer、internet_exposed は true、secret_in_client は false、外部 URL の取得は false、認可は object-level。staff-bi は audience が employee、internet_exposed が true、認可は network-only である。注意喚起が点検を求めた組み合わせは internet_exposed が true かつ audience が employee であり、network-only はその例の認可欄である。staff-bi の Metabase 行は、自社運用を未棚卸のまま置いた例で、使っていなければ作らない。本文が CVE 番号まで書いたのは CVE-2026-72898 だけで、使っている行に限って突合する。Metabase Cloud は、別紙が「対策済みだと Metabase が案内している」と書くため、同じ CVE の未確認行にはしない。operator が委託先でも、owner の台帳からは消さない。"
  hypothetical: true
  evidence: "### 公開APIの台帳を先に作る / ### 既知の穴を台帳へ突合する / ### 委託先と自社の境界を台帳に載せる"
applicability:
  - "自社または委託先が、インターネットからアプリ、API、管理系、BI を応答させている運用者"
  - "同じ時期に複数の公表主体から送信元リストが届き、自社ログと照合するとき"
  - "公開クライアントは解析される前提で、バックエンドの認証、認可、宛先制限を点検するとき"
decision_criteria:
  - "audience が employee または admin で internet_exposed が true の行を、顧客向け API より先に見る。公開を続ける行は、認可、レート制限、トークン寿命、ログの所在が埋まっていること"
  - "週次差分で増えたルートは、認可とレート制限が付くまで公開しない。修正版がある行を未適用のまま残さない。設定ファイルとバックアップの露出は、CVE が無くても停止条件に含める"
  - "CVE-2026-72898 は、自社が Metabase を使っている行だけを突合する。Metabase Cloud は、JPCERT-AT-2026-0023 が、対策済みだと Metabase が案内していると書くので、未確認のまま残さない。自社運用の詳細手順の正本は同別紙"
  - "送信元は文書グループの中で IP として完全一致させる。部分文字列では当てない。Eyes Appendix B の 3 件のうち 2 件は注意喚起ケース B の 9 月リストと重なる。残る 1 件は 2026-10-09 時点の注意喚起本文に無い。ビットフォレストの 3 件は、Eyes にもその注意喚起本文にも無い。ケース B の 9 月組とビットフォレストの 3 件には正規利用の注記があり、Eyes Appendix B にはその文が無い。重なる 2 件では、注意喚起の注記を落とさない"
  - "レート制限の閾値は注意喚起が指定していない。正規利用を見て決める。ログイン、パスワード再設定、SMS 送信のように負荷が高い機能は、閲覧 API と別のカウンタにする。コストが利用者に出る操作では、カウンタの鍵に操作名を含める。拒否した回数も残す"
  - "署名検証に通ることと、その利用者にそのオブジェクトの操作を許すことは、別の判定にする。正規アプリを経由しないクライアントを、レート制限の例外にしない。バージョンは本番で応答しているものを書き、リポジトリの宣言とずれていれば本番を優先する"
  - "ビットフォレストが自社の仕掛けで検知した場合に限るエージェント断定は、自社ログへ輸入しない。検証に名前が出たモデルを、攻撃者が使ったモデルとして扱わない"
  - "トークンは必要最小限の権限と有効期限を持たせ、漏えいが疑われたら失効できることを、台帳の secret_in_client と失効手順に紐づける。委託先の WAF にしかログが無い行は、公表された送信元の照合が自社だけでは終わらない。保存期間を過ぎたデータは残さない。地域が限定されるサービスでは、アクセス元の地域制限も注意喚起の汎用対策に含まれる"
limitations:
  - "注意喚起は、すべての事案で同一の攻撃手法が使われていることを示すものではない、とケース節の前に書く。類型は共通キャンペーンの ID ではない"
  - "AI の確度は資料で違う。Eyes は利用を確認したと書くが、判定手順とモデル名は本文に無い。CYNEX は、解析や脆弱性探索が効率化され、より多くのシステムに及ぶ可能性を書く。プレスリリースは、解析や脆弱性の発見が効率化され、広がる可能性を書く。確認と可能性を同じ強さにせず、二つの語句を一つの引用に混ぜない。ビットフォレストは、自社の仕掛けで検知した場合に限りエージェントと断定できると書き、漏れはあり得るとも書く"
  - "Eyes Appendix B の IP と、本文のサーバその 1〜3 の対応表は無い。その 3 は今回の攻撃と直接関係しない、と Eyes が書く。ビットフォレストが検出した 3 件にスマホアプリの User-Agent は無く、NICT が名付けた A2B の実例として結合しない。A2B は公開アプリの解析を起点にバックエンドを狙う類型の名前で、Eyes の IP リストとは別文書"
  - "ITmedia の要約は、8 時間弱の観測にある高速な探索、既知の欠陥への試行、ログインの集中を続けて書く。ブログの表では、それらは 10 段階の 1 件の中の別段階であり、問い合わせフォームへの連投は別の IP、スキャンのみは 3 件目である"
  - "記事中のレート制限の数値、調査開始の目安の桁、203.0.113.10 は例示である。注意喚起の指定値でも、公表された侵害指標でもない"
  - "NICT の PDF に書かれた侵害指標と、脆弱性ごとの確認手順は、この記事が本文に採用していない。マクニカの記事と、セキュアスカイ・テクノロジーの実践ガイドの中身も、根拠に使っていない"
  - "対象プロトコルを Eyes の本文に限ると、名前があるのは HTTPS と、その上の API である。ビットフォレストの表にある GraphQL や、段階の途中のメソッドを、Eyes の対象プロトコルとして書かない"
unknowns:
  - "Eyes が AI 利用と判断したログ、モデル、ツール出力は、2026-10-16 時点の本文に無い"
  - "Appendix B の IP と 3 台のサーバの対応は、記事内に無い"
  - "ビットフォレストの判定アルゴリズムは、ブログが意図的に公開していない"
  - "検証した 8 モデルのうち名前があるのは Qwen 3.8 Flash Next と GLM-5.3 Flash Next だけである。残り 6 つの名前はブログに無い。これらは検証用であり、攻撃者が使ったモデルではない。ITmedia は GLM の語尾とベンダー名がブログとずれる"
  - "注意喚起に例として出る User-Agent の版文字列が、そのパッケージの実在版かは未確認。記事は観測された User-Agent に留める"
