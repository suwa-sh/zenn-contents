source:
  title: "連続不正アクセスの公開APIを台帳と認可で止める"
  url: null
  path: "notes/zenn/articles/ai-api-blogs-jpcert-or-jp-p6_20261016.md"
  primary:
    - title: "JPCERT/CC Eyes「連続不正アクセス事案の攻撃手法に関する調査」（2026-10-15）"
      url: "https://blogs.jpcert.or.jp/ja/2026/10/web_api_attacks.html"
    - title: "JPCERT-AT-2026-0030 直近で相次いでいる国内組織における不正アクセスに関する注意喚起（公開 2026-10-08、更新 2026-10-09）"
      url: "https://www.jpcert.or.jp/at/2026/at260030.html"
    - title: "NICT プレスリリース「アプリ解析からのサーバ攻撃」（2026-10-13）"
      url: "https://www.nict.go.jp/press/2026/10/13-1.html"
    - title: "ビットフォレスト WAF Tech Blog「AIエージェントによる攻撃を観測しました」"
      url: "https://www.scutum.jp/information/waf_tech_blog/2026/10/waf-blog-085.html"
  retrieved_at: "2026-10-17"
archetype:
  primary: architecture
  secondary: [decision, incident]
one_liner: "インターネットから応答する面を台帳にまとめ、未修正か認可なしで応答している状態を止める。公表された送信元は、文書ごとのリストのまま自社ログと照合する。"
key_points:
  - claim: "台帳に行が無いと、レート制限・認可・トークン寿命・公開停止の適用先が決まらない。従業員向けの管理系や BI も被害面なので同じ台帳に載せる。"
    evidence: "## 公開面台帳の構築 / ### 公開APIの台帳を先に作る / ### 管理系とBIを公開面の棚卸しに含める"
    status: fact
  - claim: "止める基準は侵入の成功ではなく、既知の穴・設定不備・認可なしの面が応答している時点に置く。注意喚起は単一製品の脆弱性を共通原因としていない。"
    evidence: "## 公開資料が分ける特徴 / ### 停止条件を侵入口の公開時点に置く"
    status: fact
  - claim: "アプリ内の秘密・署名・難読化はサーバ認可の代わりにならない。オブジェクト単位の認可と外部 URL 取得の宛先制限をサーバで行う。"
    evidence: "### アプリ内の秘密を認可の根拠にしない / ### オブジェクト単位の認可をサーバで決める / ### 外部URLを取得するAPIの宛先を固定する"
    status: fact
  - claim: "公表された送信元リストは文書ごとに別で、正規利用の注記も違う。結合せず IP の完全一致で照合し、IP だけで侵害と断定しない。"
    evidence: "### 公表された送信元を自社ログで探す / ### 情報モデル"
    status: fact
  - claim: "観測された攻撃は同じ送信元の中で段階的にツールと手順を変えるため、単発のシグネチャで閉じず前後 8 時間を 1 本の時系列で見る。"
    evidence: "### 検知は手順の変化を1本の記録にする / ### しきい値は観測値を調査開始の目安にする"
    status: interpretation
mental_models:
  - type: structure
    key_message: "台帳が穴の突合とゲートの適用先を決め、手順の変化は台帳へ戻る"
    reason_needed: "5 つの作業単位の向きが、どこで止めるかの判断そのものだから"
  - type: structure
    key_message: "侵害指標は文書に付けたまま、公開面へは攻撃類型と対策だけをつなぐ"
    reason_needed: "公表元が複数あり、リストを結合すると注記と別観測の区別が落ちるから"
example:
  description: "記事が台帳の形として置いた例示の 2 行。顧客向けで委託先運用・オブジェクト単位認可の API と、従業員向けでインターネット公開・ネットワーク制限のみの BI。後者は注意喚起が点検を求めた組み合わせ。"
  hypothetical: false
  evidence: "### 公開APIの台帳を先に作る（記事内の例示 YAML。実在組織の行ではない）"
applicability:
  - "自社か委託先が、アプリ・API・管理系・BI をインターネットに公開している"
  - "複数の公表元から届いた送信元リストを、自社ログと照合する"
  - "公開しているモバイルアプリのバックエンドを点検する"
decision_criteria:
  - "従業員・管理者向けでインターネット公開の面を、顧客向け API より先に点検したか"
  - "本番ルートと台帳の差を週次で確認し、増えたルートは認可とレート制限が付くまで公開を止めているか"
  - "ログイン・パスワード再設定・SMS 送信を閲覧 API と別カウンタで制限し、拒否回数も記録しているか"
  - "外部 URL を取得する API で、リダイレクトのたびに許可先を判定し直しているか"
  - "ログが委託先の WAF にしか無い面を把握しているか"
limitations:
  - "AI 利用の確度は資料で違う。JPCERT/CC は確認したと書くが判定手順とモデル名は無く、NICT は効率化の可能性を書くにとどまる"
  - "ビットフォレストのエージェント判定は自社 WAF の仕掛けに依存し、手法は非公開。自社ログの判定には使えない"
  - "注意喚起は全事案が同じ手法だとは書いていない。ビットフォレストの 3 送信元にスマホアプリの User-Agent は無く、A2B の実例とは扱えない"
  - "記事中のレート制限の値と調査開始の目安は例示で、注意喚起の指定値ではない"
unknowns:
  - "JPCERT/CC が公表した IP と、調査した 3 台のサーバの対応"
  - "ビットフォレストの判定方法（意図的に非公開）"
