type: structure
title: "公開面を止める5つの作業単位"
message: "台帳が穴の突合とゲートの適用先を決め、手順の変化は台帳へ戻る"
source: "notes/zenn/articles/ai-api-blogs-jpcert-or-jp-p6_20261016.md"
components:
  - id: inventory
    label: "公開面台帳"
    meaning: "インターネットから応答する面の一覧。所有者、想定利用者、埋め込み秘密、外部 URL の取得、ログの所在を行に持つ"
  - id: vulnset
    label: "既知脆弱性と設定不備の一覧"
    meaning: "台帳の各行について、本番のバージョン、修正済みか、設定ファイルやバックアップが別パスに出ていないか"
  - id: gate
    label: "認証・認可・レート制限・宛先制限"
    meaning: "主体、操作、対象オブジェクト、宛先 URL、回数を見て許可または拒否する。埋め込み鍵だけの通過を認めない"
  - id: sensor
    label: "アクセスログ"
    meaning: "時刻、送信元、パス、メソッド、ステータス、User-Agent を検索できる行にする。拒否した回数も残す"
  - id: phase
    label: "手順変化の記録"
    meaning: "同じ送信元のツールとパスの切り替わりを、1 本の時系列にする"
relationships:
  - from: inventory
    to: vulnset
    label: "行ごとに突合"
  - from: inventory
    to: gate
    label: "適用先を決める"
  - from: gate
    to: sensor
    label: "許可と拒否を残す"
  - from: sensor
    to: phase
    label: "同じ送信元を1本に"
  - from: phase
    to: inventory
    label: "台帳へ戻す"
omitted:
  - item: "公表主体、文書、攻撃類型、侵害指標"
    reason: "指標を文書に付けたままにする関係は、もう一枚の構造図で示すため"
  - item: "クライアント、攻撃元サーバ、WAF 製品、組織の内側の面の見取り図"
    reason: "リクエストが届く面の見取り図であり、防御側の 5 つの作業単位ではないため"
  - item: "委託先の release_by と logs_at"
    reason: "台帳の行の属性であり、別の箱にすると要素が 7 を超えて伝えたいことからずれるため"
  - item: "レート制限の数値、宛先の許可リスト、オブジェクト認可の関数"
    reason: "ゲートの中身であり、図の矢印を増やさないため"
layout:
  direction: "top-to-bottom。公開面台帳を上に置き、既知脆弱性と設定不備の一覧とゲートへ分岐し、ゲートからアクセスログ、手順変化の記録へ下り、手順変化の記録から公開面台帳へ戻す"
  aspect_ratio: "16:9"
evidence:
  - "## 公開面の構造 / ### コンポーネント（公開面台帳、既知脆弱性と設定不備の一覧、認証・認可・レート制限・宛先制限、アクセスログ、手順変化の記録の 5 箱と、その順の矢印）"
  - "## 公開面台帳の構築（レート制限、認可、トークン寿命、不要な公開の停止は、台帳の行が無いと適用先が決まらない）"
  - "### レート制限を機能ごとに分ける（拒否した回数もログに残す）"
  - "### 週次で公開面と既知脆弱性を突き合わせる（本番との差分を台帳へ戻す）"
