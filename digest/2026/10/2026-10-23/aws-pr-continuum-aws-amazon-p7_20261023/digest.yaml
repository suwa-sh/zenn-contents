source:
  title: "コード脆弱性の検出から修正案の配送までを行うAWS Continuum"
  url: null # Zenn 下書き (published: false)。公開 URL なし
  path: "notes/zenn/articles/aws-pr-continuum-aws-amazon-p7_20261023.md"
  primary:
    - title: "AWS News Blog: AWS Continuum for code vulnerabilities is now generally available（2026-10-22、Esra Kayabali）"
      url: "https://aws.amazon.com/blogs/aws/aws-continuum-for-code-vulnerabilities-is-now-generally-available/"
    - title: "What's New（2026-10-22）"
      url: "https://aws.amazon.com/about-aws/whats-new/2026/10/aws-continuum-for-code-vulnerabilities-is-now-generally-available/"
    - title: "User Guide: Viewing issues"
      url: "https://docs.aws.amazon.com/continuum/latest/userguide/cv-viewing-issues.html"
    - title: "AWS Continuum 料金（2026-10-23 取得）"
      url: "https://aws.amazon.com/continuum/pricing/"
    - title: "AWS Security Blog: CyberGym-E2E（2026-10-05）"
      url: "https://aws.amazon.com/blogs/security/aws-continuum-sets-a-new-standard-in-autonomous-code-security/"
  retrieved_at: "2026-10-24"
archetype:
  primary: decision # 導入前に受入条件と権限の境界を決める
  secondary: [architecture] # 入力 → コンテキスト → issue → 修正案の配送
one_liner: "AWS Continuum のコード脆弱性機能は、検出の検証から修正案の配送までを自動で行い、マージは人に残る。issue ごとに証拠の強さが違うので、証拠の種類・却下条件・直してよい範囲を導入前に分ける。"
key_points:
  - claim: "選んだ GitHub.com リポジトリか同一アカウントの S3 zip と、任意の collector（AWS 構成を読む収集）から、コンテキスト（コードと構成を検出が参照できる形にまとめたもの）を作る。finding（脆弱性の候補）を検証・優先度付けしたものが issue になる"
    evidence: "冒頭 / ### 入力 / ### 検出と issue"
    status: fact
  - claim: "修正案は既定で自動配送され、GitHub なら pull request、S3 なら continuum-patches/ 配下の patch になる"
    evidence: "### 修正案の配送"
    status: fact
  - claim: "証拠レベル（コンソールが issue に付ける区分）と Proof（示される根拠の種類）は issue ごとに違い、実行して確かめられる根拠が無い issue もある。Static proven と source analysis だけの issue を、サンドボックスで再現済みとは読まない"
    evidence: "### 検出と issue / ## 注意点 / ### 証拠の強さ"
    status: fact
  - claim: "自動マージは現行機能ではなく、News Blog は自動適用を将来形とし、GitHub App は自分ではマージしないと書く。修正の自動適用について文書にある現行の制御は配送のオン／オフ（patchCreationPolicy）だけで、What's New の Learn / Enforce mode（提案と承認の段階 / guardrail 内で自律させる段階）を指定する操作は無い"
    evidence: "## 注意点 / ### 自動適用と Enforce"
    status: fact
  - claim: "AWS 自身の計測 CyberGym-E2E（C/C++ の OSS 920 タスク）で、パッチ後も機能テストを保てた率は 89.0%、ベンチマークが選んだ脆弱性を直した率は 37.8% である。顧客環境で意図した欠陥が直る率には使えない"
    evidence: "## 注意点 / ### CyberGym-E2E は顧客環境の精度ではない（表の S3 と S4）"
    status: fact
mental_models:
  - type: structure
    key_message: "現行の自動は修正案の配送までで、マージは人に残る"
    reason_needed: "「検証済み」「自動で直す」という語から、マージまで任せられると誤読しやすいため、自動と人の境界を 1 枚で示す"
example:
  description: "料金ページの例では、100 万行・脆弱性 100 件・1 件 1 CIU（推論の課金単位、1 CIU = 10 USD）の仮定で合計 1,200 USD。料金は、保護する行数に対する月額のコンテキスト料と推論料の 2 つでできている"
  hypothetical: false
  evidence: "### 料金 / ### 料金例は仮定である"
applicability:
  - "GitHub.com か S3 上のコードについて、検出だけでなく修正案（GitHub なら pull request、S3 なら patch）まで受け取りたいとき"
  - "導入可否を、検出精度の宣伝文句ではなく受入条件と権限の設計で決めたいとき"
decision_criteria:
  - "issue ごとに証拠の種類（静的解析だけ / サンドボックスで再現 / 実行できる根拠なし）を分けて記録するか"
  - "誤検知として却下する条件を、マージ権限を持つ人とは別のチェックにしているか"
  - "直してよい範囲（触ってよいパス、依存更新の取得元ドメイン、設定、テスト）を先に決めたか"
  - "最初の pull request で、作者のログイン、対象ブランチ、CI をスキップするかを記録するか"
  - "1 つの environment（リポジトリを束ねる単位）に 10 リポジトリ超、GitHub と S3 以外の取り込み、N. Virginia と Oregon 以外の Region のどれかを前提にするなら、account team に確認したか"
limitations:
  - "1 件が何 CIU になるかと端数の丸めは公開されていない。料金ページの例はどれも 1 件 1〜2 CIU の仮定で、コード脆弱性機能の無料枠も料金ページでは確認できない"
  - "保管はリクエストの起点になった Region だが、推論は地理的区域の中で Region 外でも処理され得る。サービス改善のための収集は現時点で無いが、将来はあり得る"
  - "FAQ の「学習に使わない」は別機能（ペネトレーションテスト）の見出し下の文で、コード脆弱性機能の同じ文はこの FAQ には無い"
unknowns:
  - "pull request を作る GitHub のログイン、GitHub App の permission 一覧、対応言語の一覧"
  - "What's New の Learn / Enforce と patchCreationPolicy が同じスイッチか"
  - "公開リポジトリへの pull request を拒むか"
reviewed: true
