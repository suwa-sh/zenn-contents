source:
  title: "能動的サイバー防御のアクセス・無害化は誰が実施を決めるか"
  url: null # Zenn 下書き (published: false)。公開 URL なし
  path: "notes/zenn/articles/yomiuri-co-jp-politics-20261024-p7_20261025.md"
  primary:
    - title: "読売新聞「ＧＭＯの『能動的サイバー防御』緊急要請、政府関係者『求めに応じ発動決める制度ではない』」（2026-10-24）"
      url: "https://www.yomiuri.co.jp/politics/20261024-GYT1T00257/"
    - title: "GMOインターネットグループ「お名前.com デスクトップクラウドサービスに対するサイバー攻撃について（第4報）」（2026-10-24 11:50時点）"
      url: "https://group.gmo/info/alert/20261024/"
    - title: "警察官職務執行法第6条の2"
      url: "https://laws.e-gov.go.jp/law/323AC0000000136"
    - title: "自衛隊法第81条の3"
      url: "https://laws.e-gov.go.jp/law/329AC0000000165"
    - title: "アクセス・無害化措置の運用に関する指針（令和7年12月26日 国家安全保障会議決定）"
      url: "https://www.cas.go.jp/jp/siryou/pdf/20251226_unyoshishin.pdf"
  retrieved_at: "2026-10-26"
archetype:
  primary: governance # 誰が要件を認定し、誰の承認と指揮で実施するか
  secondary: [incident] # 2026-10-24 の GMO 公表を、実施決定と分けて読む
one_liner: >-
  ここで扱う能動的サイバー防御は、アクセス・無害化措置（攻撃サーバーへ接続し、記録の確認や消去）である。
  2026年10月1日から実施でき、企業の具申（実施を求める申出）は、実施を決める申請ではない。
key_points:
  - claim: "実施の権限は、警察官職務執行法（警職法）第6条の2と自衛隊法第81条の3にある。強化法（重要電子計算機に対する不正な行為による被害の防止に関する法律）は根拠の整備であり、権限そのものではない"
    evidence: "冒頭 / ### 法令と施行日 / ## まとめ"
    status: fact
  - claim: "警察経路の起点は、サイバー危害防止措置執行官が加害関係の通信もしくは電磁的記録、またはその疑いを認め、放置すれば生命、身体または財産に重大な危害のおそれがあり、緊急の必要があることである。原則はサイバー通信情報監理委員会の承認と、警察庁長官等の指揮である。第6条の2第2項は業種を重要インフラに限らない"
    evidence: "### 警察が措置をとるとき"
    status: fact
  - claim: "自衛隊の通信防護措置は、自衛隊法が限定した重要電子計算機に対する特定不正行為に限る。特定重大支障のおそれが大きく、自衛隊の特別の技術または情報が必要不可欠で、国家公安委員会の要請または同意があり、自衛隊が対処する特別の必要があると総理大臣が認めるときに、内閣総理大臣が命じ、部隊等は警察と共同して実施する"
    evidence: "### 自衛隊が通信防護措置をとるとき"
    status: fact
  - claim: "GMOインターネットの公表第4報（2026年10月24日）が示すのは、補償の発表、10月22日の警察への相談、政府への具申である。「発動第1号」は同社の位置付けで、政府が実施を決めた一次資料は同報に無い"
    evidence: "### 2026年10月に公表された事案の流れ / ### 同社が書いた「発動第1号」 / ## 企業の求めは、実施を決める申請ではない"
    status: fact
mental_models:
  - type: structure
    key_message: "企業の具申は実施の決定ではない。実施を決めるのは法令上の二つの経路である"
    reason_needed: "具申、警察経路、自衛隊経路、実施の記録の境界が、文章だけだと一つの申請に見えやすい"
example:
  description: "お名前.comデスクトップクラウドへの不正アクセスについて、GMOは見舞金（一律5,000円。金銭被害の有無を問わない）、代替サービス6か月無償、同社が不正取引と認めた実現損失の補償を発表した。「国内外の70を超える証券会社・FX会社等」は、攻撃者とみられる者からの連絡として書かれた数で、同社が被害を確定した件数ではない"
  hypothetical: false
  evidence: "### 2026年10月に公表された事案の流れ / ### 証券会社・FX会社等の数"
applicability:
  - "侵害のあと、補償、警察への相談、政府への具申を同じ記録に残しそうなとき"
  - "企業の緊急要請を、無害化を実施した決定と読む報道を見るとき"
  - "生命、身体、財産への危害を、特定の業種に限る話として片づけるとき"
decision_criteria:
  - "政府が実施を認めた一次資料が無ければ、「具申済み、実施は未確認」と書く"
  - "警察への相談と、無害化の実施を、別の欄にしているか"
  - "補償を始める条件に、政府の反応を入れていないか"
  - "自衛隊経路に乗せるなら、特定不正行為と、自衛隊法が限定する重要電子計算機に当たるかを一次資料が示しているか"
  - "すでに出た被害だけでは対象外にならず、放置すれば重大な危害が生じるおそれが無いときや、緊急の必要が無いときは起点を満たさない"
limitations:
  - "この事案で政府が危害のおそれと緊急の必要を認めたか、実施したかは、一次資料が無い"
  - "日本経済新聞が伝える政府高官の発言は、会見録未確認の二次情報である。要請を受けたことと、実施を決めたことは別である"
  - "読売新聞の「実施したかを事案ごとに公表しない」は同紙の記述で、運用指針の本文には無い"
  - "一部の事業者の侵害報告は、無害化の申請ではない。この事案で、その報告が実施の経路になったとは、一次資料では言えない"
  - "GMOの第4報は、10月21日に、お名前.comデスクトップクラウドの全プランのサーバーを停止したと書く。同報にある、不正操作、情報の公開、ランサムウェアという予告が、停止後も「放置すれば重大な危害のおそれ」を満たすと政府が見るかは、認定が未公表である"
unknowns:
  - "政府がこの事案で危害のおそれと緊急の必要を認めたか。認めたとしても、実施したかを対外的に確認する一次資料は無い"
  - "対象の計算機が自衛隊法の重要電子計算機か、特定不正行為に当たるか。特定重要電子計算機に当たるかも未確認で、後者は自衛隊経路の分岐ではない"
  - "2026年10月24日の政府高官発言の会見録"
reviewed: true
