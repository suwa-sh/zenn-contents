source:
  title: "サブエージェントをメインループへ畳む条件"
  url: null
  path: "notes/zenn/articles/anthropic-claude-resources-p1_20261025.md"
  primary:
    - title: "Building agents: When to fold subagents into your main agent loop (Anthropic, 2026-10-22)"
      url: "https://claude.com/resources/articles/building-agents-when-to-fold-subagents-into-your-main-agent-loop"
    - title: "The anatomy of effective commerce agents (Anthropic, 2026-09-02)"
      url: "https://claude.com/resources/articles/the-anatomy-of-effective-commerce-agents"
    - title: "When to use multi-agent systems (and when not to) (Anthropic, 2026-01-23)"
      url: "https://claude.com/resources/articles/building-multi-agent-systems-when-and-how-to-use-them"
    - title: "How we built our multi-agent research system (Anthropic, 2025-06-13)"
      url: "https://www.anthropic.com/research/multi-agent-research-system"
  retrieved_at: "2026-10-26"
archetype:
  primary: decision
  secondary: [architecture]
one_liner: "サブエージェント（別の会話窓を持つ担当）を 1 つのモデルのループへ戻すかは、人数では切らない。残す条件に当たらないものだけを戻し、合否が入れ替わったタスクがあれば採用しない。"
key_points:
  - claim: "畳むとは、依頼を振り分けるルーター、手順を先に書く計画係、ドメイン別の担当というサブエージェントを、1 つのモデルのループへ戻すこと。外の実行基盤が生の結果を返すので、そのターンで計画を変えられる。専門の手順はスキルへ移り、本文は必要になるまで読まない"
    evidence: "## サブエージェントをメインループへ畳むとは"
    status: fact
  - claim: "計画を前の結果で変えたくても、先に残す条件を見る。測れた性能低下、捨ててよい並列、1 つのループのまま適切なツールを選べないかシステムプロンプトの指示の衝突、検証を別にする条件、会話を引き取る窓口のどれかに当たれば、別コンテキストに残す。測れる前は同じ窓に載せる"
    evidence: "## 探索と検証と専用の会話は残す / ## まとめ"
    status: fact
  - claim: "「ツールを選べない」は定義の個数ではなく、1 つのループのまま適切なツールを選べないこと。30 個から 50 個を超えて選択が落ち、原因が個数なら、残す前に tool search を使う。およそ 10 個未満なら先に全部載せる方がたいてい速い、と Claude の SDK の文書は書く"
    evidence: "## サブエージェントをメインループへ畳むとは / ## 1つずつ畳み、裏返ったタスクを見る"
    status: fact
  - claim: "畳む単位は 1 担当ずつ。前後を同じ端到端の評価で比べ、最終点が同じでも合否が入れ替わったタスクがあれば採用しない。10 例は開始に足るが、統計的な検出力の主張ではない"
    evidence: "## サブエージェントをメインループへ畳むとは / ## 1つずつ畳み、裏返ったタスクを見る"
    status: fact
  - claim: "外部の状態を変える能力は、担当を分けるかどうかでは決まらない。課金と、変更を確定する処理をループから外し、そのセッションでサーバが渡した ID だけを書かせ、上限を書いたあとの状態に掛ける。都度の承認は、この能力の代わりにならない"
    evidence: "## 書き込みは担当の分割では狭まらない / ## まとめ"
    status: fact
mental_models:
  - type: behavior
    key_message: "残す条件に当たる作業は、計画を書き換えても別コンテキストに残す。当たらない作業だけを同じコンテキストへ畳む"
    reason_needed: "担当の人数や、計画を変えるかどうかだけでは切れず、残す条件を先に見る流れが判断の中心だから"
example:
  description: "サポートのサンプルでは、あるサブエージェントを別の担当の側へまとめただけで、メインループへ戻していない。遅延は下がったが、注文参照のツールを持ったメインが、残っていた配送担当に配送日を聞かずに答え、通っていた手順が落ちた。この落ちは 2 回中 1 回だけで、2 回ではこのような退行を見落とす"
  hypothetical: false
  evidence: "## 1つずつ畳み、裏返ったタスクを見る"
applicability:
  - "複数の担当を本番で動かし、次の変更を品質、費用、遅延のどれで判定するかを決めたいとき"
  - "購買のように、返品が注文履歴とカートとカタログを同時に要する会話で、ドメインごとの分割を見直すとき"
  - "ループが外部の状態を書くとき、担当の数ではなく、書ける能力の有無を見直すとき"
decision_criteria:
  - "性能低下が測れているか（測れる前は同じ窓に載せる側）、捨ててよい並列か、ループのままツールを選べないかシステムプロンプトの指示が衝突するか、検証を分ける条件か、薬局や金融のように担当が会話を引き取る窓口か。当たれば残す"
  - "選択低下の原因が定義の個数なら、残す前に tool search を試したか"
  - "1 担当ずつ畳み、同じ評価で合否が入れ替わったタスクが無いか（最終点が同じでもあれば採用しない）"
  - "外部へ書くなら、課金と、変更を確定する処理をループから外し、サーバが渡した ID だけを書かせ、書いたあとの状態で上限を見ているか"
limitations:
  - "設計記事の比較（スキルを持つ単一が、全部入りのプロンプトとサブエージェント設計より品質で勝つことが多く、費用と遅延もしばしば低い）は、公開された実験計画ではない。社数、課題セット、効果量は無い"
  - "およそ 2 倍は 1 顧客の実行時間、90.2% は別モデル比較、80% はプロンプト削減とばらつき説明で、どれも畳んだ品質の倍率ではない"
  - "単一がマルチに常に勝つ、とは読まない。密に結びついた会話では単一が有利、幅を優先する探索ではマルチが有利、という公式の比較が両立する"
  - "付属の参照実装は、保守も貢献の受付もしていない。実モデル実行は 1 人、1 モデル、2 回で、測定値は解説から削除されている"
unknowns:
  - "「Opus 4.5 以降、単一ループで扱える量が増えた」は、何の量か書いていないので判定に使わない。Opus 5.5 と Fable 5.1 で推論過程を切れない、は製品ドキュメントと未照合である"
reviewed: true
