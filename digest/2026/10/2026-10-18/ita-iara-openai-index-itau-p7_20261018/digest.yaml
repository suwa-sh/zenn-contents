  title: "Itaúのia.iとIARAを設計レビューでどう読むか"
  url: null # Zenn 下書き (published: false)。公開 URL なし
  path: "notes/zenn/articles/ita-iara-openai-index-itau-p7_20261018.md"
  primary:
    - title: "OpenAI, How Itaú is building generative AI for its entire customer base (2026-10-16)"
      url: "https://openai.com/index/itau-generative-ai"
    - title: "Feito.Itaú, Itaú lança ia.i (2026-07-28、更新 2026-07-30)"
      url: "https://feito-itau.cloud.itau.com.br/itau-iai-superapp-inteligencia-artificial/"
    - title: "Mobile Time, Henrique Medeiros, ia.i の copiloto (2026-07-27)"
      url: "https://www.mobiletime.com.br/noticias/27/07/2026/itau-copiloto-ia-i-ai/"
