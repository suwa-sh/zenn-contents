source:
  title: "エージェントの1サイクルに入れるE2Eの範囲"
  url: null # Zenn 下書き (published: false)。公開 URL なし
  path: "notes/zenn/articles/e2e-future-architect-github-p5_20261018.md"
  primary:
    - title: "武田大輝. E2E テストのフィードバックループを小さくするためのプラクティス. フューチャー技術ブログ. 2026-10-16"
      url: "https://future-architect.github.io/articles/20261016a/"
    - title: "Playwright. Agents"
      url: "https://playwright.dev/docs/test-agents"
    - title: "Playwright. Parallelism"
      url: "https://playwright.dev/docs/test-parallel"
  retrieved_at: "2026-10-19"
archetype:
  primary: decision # 1サイクルに入れる確認の境界
  secondary: [architecture] # 随時・PR・日次の3段
one_liner: >-
  エージェントの1サイクルに入れるブラウザE2Eは、画面に出て、デプロイを待たず、必要な一部だけを回し、失敗を人のレポートへ残せるものに限る。
  全件はPRと日次の外に置く。
key_points:
  - claim: "武田の記事が扱うのは、画面から入りサーバ経由でデータベースへ届くWebのE2Eを、デプロイ待ちなし、並列、HTMLレポート、トレースのリンクで短く回す基盤である。APIの直叩きとモバイルは定義の外にあり、実行は実装中のローカル再実行、PRのGitHub Actions上のローカル全件、developに対する毎日02:00のクラウド全件の3段である"
    evidence: "冒頭 / ## E2Eの短いフィードバックループとは / ### 実行は3段"
    status: fact
  - claim: "本数の中心をブラウザE2Eへ移したとは扱わない。1サイクルの内側の既定は、実装エージェントが書き換えられないユニットと、サービス境界の統合である"
    evidence: "## 本数の中心はブラウザE2Eへ移していない"
    status: fact
  - claim: "GitHub Actionsの4コアで約160件が約13分、その半分以上が環境構築、という数字は著者の自己申告で、全件を1サイクルの内側に置くことを難しくする。ローカルE2Eの検出がクラウド日次を大きく上回ったという記述も自己申告で、件数や内訳は公開されておらず、一般の所要時間や検出率としては使えない"
    evidence: "### 速度と検出数の出どころ / ## 本数の中心はブラウザE2Eへ移していない の「約13分の自己申告」の段落"
    status: interpretation # 数字が自己申告なのは事実。全件を内側に置くことを難しくする、は約13分と環境構築が半分以上という記述に限った記事の読み
  - claim: "期待値の編集、プロダクト側の検証の無効化、失敗が人に残る前にパッチかskipへ寄りえるPlaywrightのhealerは内側の外に出す。緑は直したことの証明にはならない"
    evidence: "## 本数の中心はブラウザE2Eへ移していない の「内側の既定」と ### 期待値を直せる経路"
    status: fact
mental_models:
  - type: structure
    key_message: "1サイクルの内側は凍結したユニット、サービス境界の統合、4条件を満たす一部のブラウザE2E。外側はPRのローカル全件と毎日02:00のクラウド全件"
    reason_needed: "全件を内側に置くか、一部だけを入れるかの境界が、この記事の判断そのものだから"
example:
  description: >-
    架空の3件。画面のボタン文言は、凍結したユニットとサービス境界の統合を内側に入れ、4条件を満たすときだけその画面のブラウザE2Eも入れる。
    画面が無い課金Webhookの成否は、凍結したユニットとサービス境界の統合を内側に置き、ブラウザE2Eと画面の証拠だけでは局所化できない。
    全画面の回帰を1サイクルで回すことはせず、PRのローカル全件と日次のクラウド全件に残す。
  hypothetical: true
  evidence: "## ブラウザE2Eを内側へ入れる条件 / ## 本数の中心はブラウザE2Eへ移していない の「画面が無い変更、APIの直叩き、課金Webhook」の段落"
applicability:
  - "コーディングエージェントにWebの実装を任せ、1サイクルへ入れる確認の境界を決めるとき"
  - "画面に出る変更について、デプロイを待たず一部のブラウザE2Eを再実行できる基盤があるとき"
  - "全件のブラウザE2EをPRと日次に残し、内側はエージェントが書き換えられない確認にしたいとき"
decision_criteria:
  - "変更が画面に出るか"
  - "同じテストを、クラウドへのデプロイを待たずに再実行できるか"
  - "全件ではなく、その変更に必要な一部だけを回せるか"
  - "失敗した画面、データベースの前後、トレースを、期待値を直す前に人へ残せるか"
  - "実装エージェントが、期待値を編集したり、プロダクト側の検証を無効化したり、テスト自体を書き換えたりできないか"
limitations:
  - "結論がひっくり返るのは、公開された比較で、凍結したユニットとサービス境界の統合よりブラウザE2E中心の方が、欠陥の取りこぼしと待ち時間の両方が小さいと示されたとき、または全件が1サイクルに収まる時間で安定して終わる測定が出たとき"
  - "前提の「広がりつつある」は、計測された移行ではない。本数の中心を移すべきだという比較実験は、記事が参照した範囲には無く、これは無いことの証明ではない"
  - "画面が無い変更、APIの直叩き、課金Webhookの成否は、ブラウザE2Eと画面の証拠だけでは局所化できない"
  - "ユーザー行で分離できない外部アカウント、シーケンス、グローバル設定は、名前付きlockで直列にし、その資源の並列は落ちる。ファイル内まで並列にするには fullyParallel: true が要り、既定は false で、workers だけではファイル内は順に実行される"
  - "随時実行の所要時間、ローカルとクラウドの検出件数、武田の記事のシステムのトレースがX-Rayの既定サンプリングを通るか100%送出か、凍結したユニットと一部のE2Eを同じサイクルで回した待ち時間は公開されていない。この欠測は、本数の中心を移す判断は止めず、内側に全件のブラウザE2Eを置く判断だけを止める"
unknowns:
  - "エージェントのローカル随時実行が、GitHub Actionsの約13分と別に何分だったか"
  - "ローカルとクラウドで検出した不具合の件数"
  - "当該システムのトレースが、X-Rayの既定サンプリングを通しているか、100%送出か"
  - "Xのトレンドの実体が、松本の記事なのか、別のスレッドなのか"
  - "期待値を凍結したユニットと、必要な一部だけのブラウザE2Eを同じサイクルで回した待ち時間"
reviewed: true
