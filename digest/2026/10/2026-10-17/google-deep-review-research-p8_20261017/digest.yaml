source:
  title: "Deep Reviewは設計文書の未記載前提をどう返すか"
  path: "notes/zenn/articles/google-deep-review-research-p8_20261017.md"
  url: null # Zenn 下書き (published: false)。公開 URL なし
  retrieved_at: "2026-10-17"
archetype: mixed # architecture (4段の処理) + decision (報告の分け方・数値の引用範囲) + governance (保存条件)
one_liner: >-
  Google の Deep Review は、文書を節に分けて並行点検し、節間の整合と外部の根拠を確かめて報告を返す。
  設計レビューでは報告を「未記載の前提・本文と図表の不一致・改善提案」の3種に分け、採否と書き戻し先は人が決める。
key_points:
  - claim: "処理は4段 (分割 → 密度に応じた計算配分 → 全文を見ながら節を並行検証 → 統合・節間整合・外部根拠確認)。離れた節の食い違いは最後の統合段で見る"
    evidence: "## Deep Reviewとは > ### 4段の処理"
    status: fact
  - claim: "設計文書の未記載前提、プレゼンの要点と図表の一致は、公開ブログが挙げる『使い方の例』であり、設計資料での検出率・偽陽性率はどこにも無い"
    evidence: "### 点検の中身 / ## 注意点 冒頭"
    status: fact
  - claim: "89.7% は前身 PAT (Gemini 3.1 Pro) が、数式・証明の誤り 26 論文 29 件を、著者ら独自のグレーダで測った値。公開製品 (4 Argon) や設計資料の精度としては使えない"
    evidence: "### 89.7%の母集団とモデル (論文 Table 2)"
    status: fact
  - claim: "正しい証明を誤りとする失敗は未解決で、『指摘の大部分が根拠あり』と答えた著者も 55.8% (STOC) / 64.8% (ICML) にとどまる。だから採否と書き戻し先は人に残す"
    evidence: "### 正しい証明を誤りとする残課題 / ## 設計レビューの報告を3種に分ける"
    status: interpretation # 数値は論文の事実、そこから運用を導くのは記事の解釈
  - claim: "保存条件は一次ソース間で文言が3通り (学習に使わず1年保存 / 許可なく学習せず最大1年で削除 / 改善へのオプトインあり)。会議 PAT の7日削除は公開製品の条件ではない"
    evidence: "### 保存と外部検索 / ### 入力、保存、料金の文言差"
    status: fact
mental_models:
  - type: behavior
    key_message: "節ごとの並行点検のあと、最後の統合段で節間の整合と外部根拠を確かめてから報告を返す"
    reason_needed: "どの種類の指摘 (離れた節の矛盾など) がどの段で出るかを掴むには、処理の順序を見るのが早い"
  - type: structure
    key_message: "報告を3種に分け、種類ごとに別の欄へ人が書き戻す"
    reason_needed: "記事の実務上の結論。3種を1つの『仕様の修正』に混ぜないことが要点で、対応関係を図で見せると誤読しにくい"
example:
  description: >-
    (架空の例) 設計文書を Deep Review に通し、「キャッシュ無効化は単一リージョンを前提にしているが本文に記載がない」
    「構成図ではキューを経由するが本文は同期呼び出しと書く」「レート制限を追加してはどうか」の3件が返ったとする。
    1件目は未決の問いとして未決の欄へ (既に決めていたなら決定の欄へ記録)、2件目は欠陥候補の欄へ、
    3件目は改善提案の欄へ置く。3件目を『既に決めていた前提』として仕様に書き込まない。
  hypothetical: true
applicability:
  - "設計文書・プレゼン・論文などで、書かれていない前提や本文と図表の食い違いを、人のレビュー前に洗い出したいとき"
  - "週2回まで追加料金なしで試せる。超えたら自分の Gemini API キーで上限を上げる (40ページの目安は約 $3.00 〜 $20、製品 FAQ のみに記載)"
decision_criteria:
  - "報告を3種 (未記載の前提 / 本文と図表の不一致 / 改善提案) に分けてから採否する。書き戻す欄は指摘ごとに人が選ぶ"
  - "精度の引用は『PAT・26 論文 29 誤り・Gemini 3.1 Pro・独自グレーダ・89.7%』の範囲にとどめる"
  - "逆転条件: 公開製品で、設計文書の検出率と偽陽性率が著者以外の評価で同じ母集団定義で出たら、設計レビューの精度として引用してよい"
  - "未公開の仕様は、画面の保存3文言を並べて確認し、オプトインと1年保存を受け入れられなければ出さない"
limitations:
  - "画像としてしか残らない図は、プレーンテキストや画像が落ちた大きい PDF では照合できない。20MB (20×1024×1024 バイト) 超はクライアントが拒否する"
  - "入力形式は一次ソースで食い違う (ブログは PDF とテキスト、FAQ は Google Docs / Slides を含む、受付拡張子は docx・pptx・md・tex・html も含む)。複数ファイルの同時投入は告知時点で今後対応"
  - "著者調査の数字 (helpful 90.7% と 73.3% など) は、論文と ICML ブログで母集団が違う"
  - "外部の Web 検索をすることがある。Gemini API の deep-review ドキュメントは 2026-10-17 時点で 404"
unknowns:
  - "追加料金なしの Medium が会議パイロットと同じ計算予算か"
  - "20MB 未満の PDF・PPTX・Google スライドで、画像としての図表が検証に残るか"
  - "オプトインの初期値と、『Deep Review の改善』がモデル学習を含むか"
  - "外部検索のクエリに未公開文書の文が含まれるか"
  - "公開製品での偽陽性率と、設計文書での独立評価"
