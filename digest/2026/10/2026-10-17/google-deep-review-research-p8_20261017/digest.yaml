source:
  title: "Deep Reviewは設計文書の未記載前提をどう返すか"
  url: null # Zenn 下書き (published: false)。公開 URL なし
  path: "notes/zenn/articles/google-deep-review-research-p8_20261017.md"
  primary:
    - title: "Google Research, Analyzing technical documents with Deep Review (2026-10-14)"
      url: "https://research.google/blog/analyzing-technical-documents-with-deep-review/"
    - title: "Jayaram et al., Towards Automating Scientific Review with Google's Paper Assistant Tool (arXiv:2606.28277v1)"
      url: "https://arxiv.org/html/2606.28277v1"
    - title: "Deep Review 製品ページ"
      url: "https://research.google/deepreview/"
  retrieved_at: "2026-10-17"
archetype:
  primary: decision # 報告の分け方・数値の引用範囲・出すかどうかの判断
  secondary: [architecture, governance] # 4段の処理 / 保存条件
one_liner: >-
  Google の Deep Review は、文書を節に分けて並行で点検し、節をまたぐ整合と外部の根拠を確かめて報告を返す。
  設計レビューに使うなら、報告を3種に分けて、採否と書き戻し先は人が決める。
key_points:
  - claim: "離れた節どうしの食い違いは、各節の並行点検のあとの統合段で確かめる"
    evidence: "## Deep Reviewとは > ### 4段の処理"
    status: fact
  - claim: "設計文書の未記載前提や図表との一致は公開ブログの使い方の例にとどまり、設計資料での検出率と誤検出率は公開されていない"
    evidence: "### 点検の中身 / ## 注意点 冒頭"
    status: fact
  - claim: "89.7% は前身 PAT (Gemini 3.1 Pro) が数式と証明の誤り 26 論文 29 件を独自の採点で検出した値で、公開製品や設計資料の精度としては使えない"
    evidence: "### 89.7%の母集団とモデル"
    status: fact
  - claim: "正しい証明を誤りと言う失敗は未解決で、指摘の大部分に根拠があると答えた著者は 55.8〜64.8%。このため採否を人に残す"
    evidence: "### 正しい証明を誤りとする残課題 / ## 設計レビューの報告を3種に分ける"
    status: interpretation # 数値は論文の事実、運用の結論は記事の解釈
  - claim: "保存条件の文言は資料ごとに3通りあり、会議向け PAT の7日削除は公開製品の条件ではない"
    evidence: "### 保存と外部検索 / ### 入力、保存、料金の文言差"
    status: fact
mental_models:
  - type: behavior
    key_message: "節ごとの並行点検のあと、統合段で節間の整合と外部の根拠を確かめてから報告を返す"
    reason_needed: "節をまたぐ食い違いがどの段で見つかるかを、処理の順序で示すため"
  - type: structure
    key_message: "報告を3種に分け、種類ごとに別の欄へ人が書き戻す"
    reason_needed: "記事の実務上の結論。種類と書き戻し先の対応を図で見せると混同しにくい"
example:
  description: >-
    設計文書を通して「キャッシュ無効化が本文にない単一リージョンを前提にしている」
    「構成図はキュー経由なのに本文は同期呼び出し」「レート制限を足してはどうか」の3件が返ったとする。
    順に未決の欄 (決定済みなら決定の欄)、欠陥候補の欄、提案の欄へ置く。
  hypothetical: true
applicability:
  - "人のレビュー前に、書かれていない前提や本文と図表の食い違いを洗い出したいとき"
  - "週2回まで追加料金なしで試したいとき。超えた分は自分の Gemini API キーで払う (40ページで約 $3〜$20 の目安、製品 FAQ)"
decision_criteria:
  - "報告を3種に分けてから採否を決めているか"
  - "精度を引用するとき、PAT の数式・証明の測定 (89.7%) の範囲にとどめているか"
  - "未公開の仕様を出す前に、画面の保存条件 (1年保存、改善へのオプトイン) を受け入れられるか"
limitations:
  - "画像としてしか残らない図は、プレーンテキストや画像が落ちた大きな PDF では照合できない。20MB を超えるファイルは受け付けない"
  - "受け付ける入力形式の記述が資料ごとに違う。複数ファイルの同時投入は告知時点で今後対応"
  - "関連研究を探すため Web 検索をすることがある"
unknowns:
  - "検索クエリに未公開文書の文が含まれるか"
  - "20MB 未満の PDF や Google スライドで図表が点検に使われるか"
  - "オプトインの初期値と、Deep Review の改善がモデル学習を含むか"
  - "公開製品での誤検出率と、設計文書での独立評価"
