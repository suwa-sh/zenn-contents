source:
  title: "タイムズカー事案から分ける本人確認書類の保管場所と消去"
  url: "notes/zenn/articles/unitis-jp-24665-p6_20261017.md"
  retrieved_at: "2026-10-17"
  note: "ローカルの Zenn 下書き (published: false)。元記事の一次資料は UNITIS の徳丸浩氏インタビュー (2026-10-16) とタイムズモビリティ第2〜4報・FAQ・法令・通達"
archetype: governance
one_liner: >-
  本人確認書類は「原画像」と「残す記録」で扱いを分ける。原画像は確認後に消し、
  消す期限は事業部門の責任者が決め、実行は別の人が点検する。委託してもリスクは一部移るだけで、委託元の監督は残る。
key_points:
  - claim: "確認が終わると、原画像と、残しうる記録 (確認済みの記録 / 氏名・住所・生年月日 / 貸渡簿の運転者欄) は別の扱いになる。第4報が「保有しない」とした対象は原画像だけ"
    evidence: "## 本人確認書類の保管と消去とは > ### 確認のあと、記録は別の置き場所へ分かれる (図と表)"
    status: fact
  - claim: "置き場所は、サービス提供に必要か (Web から届く区画) か、保管するだけか (オフライン・社内の安全な区画) で分ける。透過型暗号は読み取り権限を奪われると元の形で読まれる"
    evidence: "### 徳丸氏が分けた保管と消去 (2〜3 段落目)"
    status: fact
  - claim: "eKYC への委託はリスクの『一部の移転』で、個人情報保護法第25条の監督は委託元に残る。多段のサプライチェーンも狙われるので外部は安全とは置かない"
    evidence: "### 徳丸氏が分けた保管と消去 (5 段落目) / ### 法令と通達が書く事項 (第25条) / ## 手順に置く五つの欄 > ### 移転と回避"
    status: fact
  - claim: "消去の期限は事業部門の責任者が法律等の根拠で決め、判断者とは別の人が半年〜1年に1回点検する。現場任せだと『消すのが怖いから残す』になる。監査部門には消去の判断を渡さない"
    evidence: "### 徳丸氏が分けた保管と消去 (6 段落目) / ### 決定者と点検者"
    status: fact
  - claim: "第22条の消去は努力義務で、『確認完了の時点で消せ』とは定めていない。即時削除は第4報 (運営会社) の選択であり、徳丸氏も法令も時刻を指定していない"
    evidence: "## 注意点 > ### 消去の条文が指定する時刻 / ### インタビューと、当日のルール変更"
    status: fact
mental_models:
  - type: structure
    key_message: "確認のあと、消す原画像と残す記録が分かれ、消す期限を決める人と点検する人も分かれる"
    reason_needed: "原画像・記録・決定者・点検者の 4 種の関係が記事の中心で、文章だけだと『何を消して何を残すか』『誰が決めて誰が見るか』が混ざりやすい"
example:
  description: >-
    タイムズカー事案 (元記事が扱う実例)。漏えいしたアカウントは約660万件、そのうち本人確認書類の画像を含むのは約160万件 (第2報・第3報)。
    2026-10-16 の第4報で、現会員の画像は「会員期間中は保有」から「登録確認完了後、即時削除」へ、退会会員の「退会後7年間保有」は廃止。
    現に保有する画像は申し出の有無を問わず 2026年10月末までに削除する。
  hypothetical: false
applicability:
  - "本人確認書類 (免許証・現住所確認書類など) の画像を受け取るサービスで、保管と消去の手順を設計するとき"
  - "eKYC 事業者への委託を検討するときに、自社に残る責任 (監督・消去の決定) を整理するとき"
  - "データ棚卸し (どこに何があるかの台帳) と、期限の決定・点検の役割分担を決めるとき"
decision_criteria:
  - "原画像の置き場所を 3 択で書く: Web から届く区画 / 保管専用の区画 (オフライン・社内の安全な区画) / 委託先"
  - "法令が原本の保管を求めるなら生データで持つ。求めないなら『確認済みの記録』か不可逆ハッシュでの照合を選べる (ハッシュの作り方次第で識別可能性が残る点に注意)"
  - "期限と消去は事業部門の責任者が決め、別の人 (情報システム・セキュリティが候補) が半年〜1年に1回点検して記録する"
  - "残す記録ごとに期間の根拠を分ける: 氏名・住所・生年月日は FAQ Q8 が法人税法等で7年、貸渡簿の運転者欄は通達で貸渡し終了から2年 (許可の対象と確認できた場合)"
limitations:
  - "約660万件はアカウント数で、免許証画像の件数ではない (画像を含むのは約160万件)"
  - "同日の FAQ Q8 は『運転免許情報および画像を7年保管』と書いたままで、第4報と併存している。更新漏れかどうかは公表から読めない"
  - "バックアップまで削除対象に含むという話は日経クロステックの伝聞で、第4報本文には『バックアップ』の語がない"
  - "第22条は第148条の勧告・緊急命令の列挙に含まれず、確認後に原画像を残すことを義務違反と同じ強さでは扱えない"
  - "徳丸氏は7年の長短を判断しておらず、即時削除も求めていない"
unknowns:
  - "タイムズカーの貸渡しがレンタカー通達の許可の対象かどうか (許可文書は未確認。当てはめは中程度の確度)"
  - "本件がクラウドで起きたかどうか (インタビュー自身が未公表と断っている)"
  - "FAQ Q8 の『運転免許情報』(画像以外の項目) まで消すかどうか"
