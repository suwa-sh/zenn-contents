source:
  title: "タイムズカー事案から分ける本人確認書類の保管場所と消去"
  url: null
  path: "notes/zenn/articles/unitis-jp-24665-p6_20261017.md"
  primary:
    - title: "徳丸浩氏に聞く、タイムズカー事案から考えるユーザーデータ管理 (UNITIS、2026-10-16)"
      url: "https://unitis.jp/articles/24665/"
    - title: "タイムズモビリティ 第4報 (2026-10-16)"
      url: "https://share.timescar.jp/news/2026/1016/1826.html"
    - title: "タイムズモビリティ ご質問と回答 (FAQ、最終更新 2026-10-16)"
      url: "https://corp.timescar.jp/mail/announce/faq.pdf"
    - title: "個人情報の保護に関する法律 第22条・第25条"
      url: "https://laws.e-gov.go.jp/law/415AC0000000057"
  retrieved_at: "2026-10-17"
archetype:
  primary: governance
  secondary: [incident]
one_liner: >-
  本人確認書類は、確認後に消す原画像と、根拠を持って残す記録に分けて扱う。
  消去の期限は事業部門の責任者が決め、別の人が点検する。
key_points:
  - claim: "第4報が登録確認後は保有しないとした対象は原画像だけで、氏名・住所・生年月日などの記録は別の根拠で残りうる"
    evidence: "## 本人確認書類の保管と消去とは > ### 確認のあと、記録は別の置き場所へ分かれる"
    status: fact
  - claim: "置き場所はサービス提供に必要か (Web から届く区画) か、保管するだけか (オフライン・社内の安全な区画) で分ける。透過型暗号は読み取り権限を奪われると元の形で読まれる"
    evidence: "### 徳丸氏が分けた保管と消去 (2〜3 段落目)"
    status: fact
  - claim: "eKYC への委託はリスクの一部の移転で、委託先の監督 (法第25条) は委託元に残る"
    evidence: "### 徳丸氏が分けた保管と消去 (5 段落目) / ## 手順に置く五つの欄 > ### 移転と回避"
    status: fact
  - claim: "期限は事業部門の責任者が決め、別の人が半年〜1年に1回点検する。現場任せだと『消すのが怖いから残す』になる"
    evidence: "### 徳丸氏が分けた保管と消去 (6 段落目) / ### 決定者と点検者"
    status: fact
  - claim: "第22条の消去は努力義務で消す時点を指定しておらず、即時削除は運営会社の選択である"
    evidence: "## 注意点 > ### 消去の条文が指定する時刻"
    status: fact
mental_models:
  - type: structure
    key_message: "確認のあと、消す原画像と残す記録が分かれ、期限を決める人と点検する人も分かれる"
    reason_needed: "何を消して何を残すか、誰が決めて誰が点検するかが文章だけだと混ざりやすい"
example:
  description: >-
    タイムズカー事案。漏えいは約660万アカウントで、うち本人確認書類の画像を含むのは約160万件。
    旧ルールは現会員が会員期間中、退会会員が退会後7年の保有。新ルールは登録確認完了後に即時削除し、保有中の画像も2026年10月末までに削除する。
  hypothetical: false
  evidence: "### 事案と、同日に出た文書"
applicability:
  - "免許証などの画像を受け取るサービスで、保管と消去の手順を作るとき"
  - "eKYC 事業者への委託を検討し、自社に残る責任を整理するとき"
  - "データの棚卸しと、期限の決定・点検の役割分担を決めるとき"
decision_criteria:
  - "原画像の置き場所は、Web から届く区画・保管専用の区画・委託先のどれか"
  - "法令が原本の保管を求めるか (求めなければ、確認済みの記録か元に戻せないハッシュでの照合を選べる)"
  - "期限と消去を決める事業部門の責任者と、別の点検者がいるか"
  - "残す記録ごとに期間の根拠があるか (例: 氏名・住所・生年月日は FAQ Q8 が法人税法等により7年)"
  - "貸渡しがある事業なら、貸渡し終了から2年残す貸渡簿を別の起点で管理しているか"
limitations:
  - "約660万件はアカウント数で、免許証画像の件数ではない"
  - "同日の FAQ Q8 は『運転免許情報および画像を7年保管』と書いたままで第4報と食い違う。更新漏れかは公表から読めない"
  - "バックアップも削除対象という話は報道の伝聞で、第4報本文には書かれていない"
  - "元に戻せないハッシュでも、作り方次第で個人を識別できる状態が残る"
unknowns:
  - "タイムズカーの貸渡しがレンタカー通達の許可の対象かどうか"
  - "FAQ Q8 の『運転免許情報』(画像以外の項目) まで消すかどうか"
