source:
  title: "第三者AIの銀行ログインを権限表の別欄に置く"
  url: "notes/zenn/articles/ai-ft-content-f49c8e39-f07f-p1_20261017.md"
  retrieved_at: "2026-10-17"
archetype: governance
one_liner: >-
  シティが拒んだのは「第三者AIが銀行の画面にログインし、そこで取引する経路」。
  読み取り・銀行自身のエージェント・画面外の送金レールとは分け、社内の権限表では
  口座を持つ金融機関の拒否を自社承認とは別の列に書く。
key_points:
  - claim: >-
      シティの言質は「第三者のAIエージェント/アシスタントが顧客口座へログインすること、
      およびデジタルバンキング内で直接取引すること」を許さない、という範囲。引用に認証方法の条件は無い。
    evidence: "## 第三者AIエージェントの口座アクセス制限とは > ### シティが言葉にした範囲 (FT 公式投稿 2026-10-16 の引用)"
    status: fact
  - claim: >-
      「残高が動く行為かどうか」「顧客の認証情報で入った操作だけ」という要約はシティの引用より狭い。
      ログインそのものも拒否対象に入っている。
    evidence: "## 注意点 > ### 引用より狭い読み"
    status: interpretation
  - claim: >-
      口座に触る経路は行為者と入口で分かれる。画面ログイン(第三者)・認可された読み取り・銀行自身のエージェント・
      許可制の引き落とし(ACH/即時払い)・識別子の取得・英国の支払い開始は、それぞれ別の入口。
    evidence: "### 口座に触る経路 (経路の表と mermaid 図)"
    status: fact
  - claim: >-
      権限表は4列で足りる: (1) 社内ハーネスが許すか (2) 口座を持つ金融機関が画面ログイン・直接取引を拒むか
      (3) その金融機関が認める読み取りか (4) 銀行自身のエージェントか画面外のレールか。
      列2の拒否の主体は自社の承認者ではなく金融機関の名前にする。
    evidence: "## 権限表の四つの列"
    status: interpretation
  - claim: >-
      読み取りは「資金が動かない」保証にならない。読み取った情報は銀行の外の次の操作を起動できるので、下流は別行にする。
    evidence: "### 画面の外のレールと、読み取りの下流 / ## 権限表の四つの列 (列3)"
    status: interpretation
  - claim: >-
      三行の無利息預金 約1.59兆ドルは残高の大きさであり、この週にエージェントによる流出が起きた記録ではない。
      3%で約477億ドルは仮計算。
    evidence: "### 預金の大きさと利息の仮計算"
    status: fact
mental_models:
  - type: structure
    key_message: "シティが拒んだのは、第三者が銀行の画面にログインして取引する経路だけ"
    reason_needed: >-
      「AIエージェントは銀行で一律禁止」と広く読みやすい。経路(入口)ごとに拒否の対象が違うことが、
      権限表の列を分ける根拠になるため、経路の分岐を1枚で見せる。
example:
  description: >-
    社内エージェントに、シティの法人口座から仕入先へ送金する案を出させる場合。
    列1(社内ハーネス): 次の状態の提案までに限るなら可。
    列2(シティが拒む画面経路): エージェントがシティの画面へログインして送金するなら、主体=シティ、結論=拒む、手段=空欄。
    列3(読み取り): 残高を見る接続は提供者名が埋まるまで未確認。読めたことを送金の許可にしない。
    列4(画面外のレール): 許可を受けた事業者の口座引き落としで送るなら列2には入れない。
  hypothetical: false  # 元記事が自ら示した例 (## 権限表の四つの列 の末尾の表)
applicability:
  - "AIエージェントに金融口座の操作(送金・残高確認など)を任せる社内の権限表・承認設計を作るとき"
  - "取引先の金融機関の方針変更を、自社の承認ルールと混ぜずに記録したいとき"
decision_criteria:
  - "その操作は銀行の画面へ第三者としてログインするか? → するなら列2(相手が拒む)。主体は金融機関名"
  - "認可された読み取りか? → 列3。ただし下流の操作は別行で判断し、読めたことを送金許可にしない"
  - "銀行自身のエージェントか、許可制の引き落とし等の画面外レールか? → 列4。『一律に拒否』には入れない"
  - "言質がある金融機関だけを列2に入れる (シティ=FT引用、JPM=決算コールCEO発言、Schwab/BofA=二次情報)。言質の無い銀行へ広げない"
  - "列の更新条件: シティが手段を公表 / 1033の仮差止解除 / 米国の相手が英国型の支払い開始を契約で認める"
limitations:
  - "FT本文は購読壁の内側。シティの言質は公式投稿の引用まで"
  - "JPM広報の検知の説明、Schwab CEO のテレビ発言、BofA の立場は二次情報"
  - "預金の数字と利息は仮計算であり、決算の費用項目でも観測された流出でもない"
  - "Wells Fargo・PNC・U.S. Bank が同週にブロックしたという一次情報は無い"
  - "JPM は将来の安全な接続にも言及しており、恒久的な不能とは読めない"
unknowns:
  - "シティの実装手段 (約款改定 / API停止 / ログイン検知) と、どの認証をエージェントとみなすか"
  - "読み取りを残す提供者名・開始日・対象口座"
  - "CFPB 1033 規則の仮差止の主文、英国 regulation 69 の各号"
  - "資格情報をモデルに見せない設計が Regulation E の『アクセス手段を渡した』に当たるか (判例なし)"
  - "ニューヨーク州オープンバンキング法案の成否"
