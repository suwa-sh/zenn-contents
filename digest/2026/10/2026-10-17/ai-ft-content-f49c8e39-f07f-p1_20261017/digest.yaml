source:
  title: "第三者AIの銀行ログインを権限表の別欄に置く"
  url: null
  path: "notes/zenn/articles/ai-ft-content-f49c8e39-f07f-p1_20261017.md"
  primary:
    - title: "Financial Times の投稿 (2026-10-16 20:40 UTC)"
      url: "https://x.com/FT/status/2111195504503595051"
    - title: "Financial Times の記事 (購読壁の内側)"
      url: "https://www.ft.com/content/f49c8e39-f07f-4177-9948-aabe55e5ed91"
    - title: "JPMorgan Chase 3Q26 決算コール文字起こし (AlphaStreet)"
      url: "https://news.alphastreet.com/j-p-morgan-chase-co-jpm-q3-2026-earnings-call-transcript/"
  retrieved_at: "2026-10-17"
archetype:
  primary: governance
  secondary: [decision]
one_liner: >-
  シティが拒んだのは、第三者のAIエージェントが銀行の画面にログインし、そこで取引する経路。
  社内の権限表では、この拒否を自社の承認とは別の列に書く。
key_points:
  - claim: >-
      シティの拒否は、第三者AIによる口座ログインと画面内での直接取引の両方にかかる。
      引用に認証方法の条件はなく、「認証情報を渡したときだけ」「残高が動くときだけ」は引用より狭い読み。
    evidence: "## 第三者AIエージェントの口座アクセス制限とは > ### シティが言葉にした範囲 / ## 注意点 > ### 引用より狭い読み"
    status: fact
  - claim: >-
      口座に触る入口は、画面ログイン・顧客が認可した読み取り・銀行自身のエージェント・許可制の口座引き落としに分かれ、
      拒否の対象は画面ログインだけ。
    evidence: "### 口座に触る経路 (経路の表と図)"
    status: fact
  - claim: >-
      拒否の主体は口座を持つ金融機関なので、権限表では自社の承認者の列と分け、主体の欄に金融機関の名前を書く。
    evidence: "## 権限表の四つの列 (列 2)"
    status: interpretation
  - claim: >-
      認可された読み取りでも資金が動かない保証にはならない。読んだ口座情報が銀行の外の送金を起動できるため、下流は別の行で判断する。
    evidence: "### 画面の外のレールと、読み取りの下流 / ## 権限表の四つの列 (列 3)"
    status: interpretation
mental_models:
  - type: structure
    key_message: "シティが拒んだのは、第三者が銀行の画面にログインして取引する経路だけ"
    reason_needed: >-
      「AIエージェントは銀行で一律禁止」と広く読みやすい。入口ごとに拒否の対象が違うことが、権限表の列を分ける根拠になる。
example:
  description: >-
    社内のエージェントに、シティの法人口座から仕入先へ送金する案を出させる。
    シティの画面にログインして送金するなら列 2 (主体はシティ、結論は拒む、手段は空欄)。
    許可を受けた事業者の口座引き落としで送るなら列 2 に入れず、残高を読めたことも送金の許可にしない。
  hypothetical: false
  evidence: "## 権限表の四つの列 (末尾の具体例の表)"
applicability:
  - "AIエージェントに送金や残高確認を任せる、社内の権限表や承認ルールを作るとき"
  - "取引先の金融機関の方針変更を、自社の承認ルールと混ぜずに記録したいとき"
decision_criteria:
  - "列 1: 自社のハーネスが許すか。次の操作の提案までに限るならここに書く"
  - "列 2: 第三者として銀行の画面にログインし取引するか。主体は金融機関の名前にする"
  - "列 3: 金融機関が認める読み取りか。読めたことを送金の許可にしない"
  - "列 4: 銀行自身のエージェントか許可制の引き落としか。『金融機関が一律に拒む』に入れない"
  - "列 2 に入れるのは発言の記録がある金融機関だけ (シティ・JPMorgan Chase は一次情報、Schwab・Bank of America は二次情報)"
limitations:
  - "FT の記事本文は購読壁の内側。シティの発言として使えるのは FT 公式投稿の引用まで"
  - "Wells Fargo・PNC・U.S. Bank が同週に遮断したという一次情報は無い。JPMorgan Chase は将来の安全な接続に言及しており、恒久的な禁止とは読めない"
  - "無利息預金約 1.59 兆ドル、3% で年約 477 億ドルは残高からの仮計算。この週に預金流出が起きた記録ではない"
unknowns:
  - "シティの実装手段 (約款の改定 / API の停止 / ログインの検知)"
  - "資格情報をモデルに見せない設計が Regulation E の『アクセス手段を渡した』に当たるか (判例なし)"
