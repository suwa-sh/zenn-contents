source:
  title: "Borderless LakehouseをGeminiの入口にするときの到達範囲"
  url: null
  path: "notes/zenn/articles/google-cloud-cloud-google-p7_20261017.md"
  primary:
    - title: "Bringing the borderless Lakehouse into the agentic era with innovations for Gemini"
      url: "https://cloud.google.com/blog/products/data-analytics/borderless-lakehouse-integrates-with-gemini/"
    - title: "About cross-cloud data access"
      url: "https://docs.cloud.google.com/lakehouse/docs/about-cross-cloud-data-access"
    - title: "Conversational analytics"
      url: "https://docs.cloud.google.com/bigquery/docs/conversational-analytics"
    - title: "Quotas"
      url: "https://docs.cloud.google.com/lakehouse/docs/quotas"
  retrieved_at: "2026-10-17"
archetype:
  primary: decision
  secondary: [architecture]
one_liner: >-
  Gemini の Data agent が読めるのは、連合したカタログと明示した knowledge source の内側だけ。
  読んだデータはカタログのリージョンに複製が残る。提供段階はブログでなく各ドキュメントで確かめる。
key_points:
  - claim: "発見時に取りにいくのはメタデータだけだが、読んだブロックはカタログのリージョンにキャッシュとして残る。「データを動かさない」はデータの所在地の保証にならない"
    evidence: "### メタデータの発見 / ### キャッシュと専用線 / ## 注意点 > ### コピーが残る箇所"
    status: fact
  - claim: "キャッシュには CMEK を使えない。CMEK 必須の組織ポリシーが効くと、キャッシュだけが無効になりクエリは走る"
    evidence: "## 注意点 > ### コピーが残る箇所"
    status: fact
  - claim: "ブログは一般提供（GA）と書くが、cross-cloud data access・caching・Iceberg V3 のドキュメントは 2026-10-15 時点で Preview。本番の前提にはドキュメントの表記を使う"
    evidence: "### ブログが generally available と並べた項目 / ## 注意点 > ### ドキュメントが Preview と書く範囲"
    status: fact
  - claim: "到達範囲は、ブログが掲げたクラウド・SaaS・オンプレミスへの到達より狭い。連合できるカタログの一覧にオンプレミスの表を読むコネクタは無く、Gemini の画面からカタログを作る手順も見つかっていない"
    evidence: "## 注意点 > ### 問題設定より狭い到達範囲"
    status: fact
mental_models:
  - type: structure
    key_message: "メタデータは連合で取りにいき、読んだブロックはカタログのリージョンに複製として残る (正本は相手クラウド)"
    reason_needed: "「データを動かさない」という説明と、キャッシュに複製が残る事実の違いを、要素と矢印で区別するため"
example:
  description: "EU の Amazon S3 のデータを us-east4 に作ったカタログ経由で BigQuery から読むと、キャッシュは us-east4 に置かれる。正本は EU に残るが、複製は us-east4 にもある"
  hypothetical: false
  evidence: "### キャッシュと専用線"
applicability:
  - "Databricks Unity Catalog・AWS Glue・Snowflake Horizon などにある Iceberg の表を、BigQuery の会話分析から読ませたい"
  - "取り込みパイプラインを作らずに、エージェントの参照先を増やしたい"
decision_criteria:
  - "連合するカタログ・namespace・表 (カタログあたり table 10,000、namespace あたり table 300)"
  - "Data agent の knowledge source (上限 100。BigQuery のクエリは 500 GB of bytes processed まで)"
  - "キャッシュを置くリージョンが、CMEK 必須の組織ポリシーと衝突しないか"
  - "会話プロンプトの分析 (既定で有効。2026-11-23 より前はオプトアウトフォーム、同日以降は組織ポリシーで止める)"
  - "使う機能の提供段階を、ブログの一覧でなく各ドキュメントのページ先頭で見る"
limitations:
  - "Iceberg V3 は BigQuery からは読み取りのみ"
  - "Delta Lake のコンソール取り込みはデータのコピーで、Amazon S3 上のソースは扱えない"
  - "帯域はブログ（connection あたり 10 または 100 Gbps、可変の egress 料金を消す）と、Cross-Cloud Interconnect の文書（AWS は 400 Gbps、Dedicated は Google Cloud からの data transfer out を払う）で違う。性能と顧客事例の数値はベンダーの自己記述で、測定条件は公開されていない"
unknowns:
  - "リモート連合カタログに列単位の制御を掛けられるか (確認できたのはテーブル単位)"
  - "クロスクラウドクエリとキャッシュに固有の公開単価"
reviewed: true
