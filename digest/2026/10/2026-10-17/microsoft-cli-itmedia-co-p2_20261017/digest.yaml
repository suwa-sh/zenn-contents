source:
  title: "Microsoft社内のCLI測定が推定した三つのマージ済み件数"
  url: null
  path: "notes/zenn/articles/microsoft-cli-itmedia-co-p2_20261017.md"
  primary:
    - title: "Murphy-Hill, Butler, Savelieva. Adoption and Impact of Command-Line AI Coding Agents. arXiv:2607.01418v1 (preprint, 2026-07-01)"
      url: "https://arxiv.org/html/2607.01418"
  retrieved_at: "2026-10-17"
archetype:
  primary: research
  secondary: [decision]
one_liner: >-
  Microsoft 社内の CLI コーディングエージェント研究 (採録先の記載が無い preprint) が出した +24.0% / +24.9% / +11.4% は、
  それぞれ別の推定であり、「生産性が 24% 上がった」という一つの数ではない。
key_points:
  - claim: "採用研究 (Copilot CLI だけ。試行と継続) と成果研究 (Claude Code と Copilot CLI の両方。マージ済み件数) は母集団も式も別である"
    evidence: "## CLIコーディングエージェントの社内測定とは / ### 母集団の切り方 / ### 測定の並び"
    status: fact
  - claim: "+24.0% は 2026-01-05〜11 にどちらかの CLI を使った人の、事後 115 日の 1 人 1 日マージ済み件数を合成対照と比べた値。+24.9% は Copilot CLI だけを使う人の、その週に 1 度でも使った週を、+11.4% は Claude Code だけを使う人の利用週を、それぞれ同じ人の未使用週と比べた 1 人 1 週のマージ済み件数の差である"
    evidence: "## 三つの比率の定義 (表)"
    status: fact
  - claim: "利用週の差は関連であり因果としては読まれていない。2.2 倍の差は無作為割り当てではなく、道具の優劣を識別していない"
    evidence: "## 因果として読める範囲 / ### 件数は価値そのものではない"
    status: fact
  - claim: "初回利用を最も強く動かすのは同僚の利用 (同じ上司の上司を持つ同僚の 25% 以上が直近 14 日に Copilot CLI を使うと、初回利用のオッズは参照の 3.16 倍 (+216%) で、試す確率の 3.16 倍ではない) だが、同僚の影響と似た人が集まる効果は分けられない"
    evidence: "## 初回利用と継続の係数 / ### オッズと、4か月の点推定 / ### 結論を弱める条件"
    status: fact
  - claim: "自社に写すなら比率ではなく切り方 (試行・定着・早期コホートの反事実・同一人物の利用週・品質の 5 欄) をコピーする"
    evidence: "## 評価制度に載せる前の分岐 (表と末尾段落)"
    status: interpretation
mental_models:
  - type: structure
    key_message: "三つの比率は、別の研究・別の比較相手から出た別々の数である"
    reason_needed: "報道が 24% と 24.9% を同じ「生産性」としてまとめており、研究と Part の分岐を見ないと数の意味を取り違えるため"
example:
  description: >-
    ITmedia NEWS は 24% を「使わなかった場合より完了した仕事が 24% 増えた」と書いた。論文の +24.0% は
    1月5〜11日にどちらかの CLI を使った人の、事後 115 日の 1 人 1 日のマージ済み件数を合成対照と比べた値で、
    +24.9% / +11.4% は、その道具だけを使う人の利用週と、同じ人の未使用週の 1 人 1 週の件数の差である。
  hypothetical: false
  evidence: "### 報道が一つにまとめた比率"
applicability:
  - "社内で AI コーディングエージェントの効果を測る仕組みを設計するとき"
  - "「生産性 N% 向上」という報道を読むとき"
  - "評価制度や KPI に AI 利用の指標を入れるか決めるとき"
decision_criteria:
  - "自社ログで論文と同じ粒度の分子と母集団が取れる欄だけを評価に使う"
  - "試行と定着を分けて数える (ライセンス配布数を定着と呼ばない)"
  - "+24% 型の比較は合成対照に近い非利用者の系列があるときだけ置く"
  - "道具の順位付けは、仕事の割り当てが道具間で揃っている根拠があるときだけ"
  - "組織全体の推定値を個人の評価点に配らない"
limitations:
  - "マージ済み件数は価値・品質ではない。品質・差し戻し・レビュー待ちは未測定"
  - "PR は Azure DevOps の、28 日以内にマージされたものだけ。PR を小さく分ければ件数は増える"
  - "早期利用者は自己選択で、採用者側だけの衝撃は合成対照で吸収されない"
  - "著者は測定対象の一方の道具を作る会社の社員。観察は約 4 か月で、それより長い減衰は見えない"
unknowns:
  - "正確な人数・トークン支出 (費用対効果は計算できない)"
  - "元データの再解析と PubPeer 上の技術的反論は 2026-10-17 時点で未確認。見つかった外部コメントは、論文が既に書いた限界の繰り返しが中心で、独立した再推定ではない"
reviewed: true
