source:
  title: "Microsoft社内のCLI測定が推定した三つのマージ済み件数"
  path: "notes/zenn/articles/microsoft-cli-itmedia-co-p2_20261017.md"
  primary: "Murphy-Hill, Butler, Savelieva. Adoption and Impact of Command-Line AI Coding Agents. arXiv:2607.01418v1 (preprint, 2026-07-01)"
  retrieved_at: "2026-10-17"
archetype: research
one_liner: >-
  Microsoft 社内の CLI コーディングエージェント研究が出した +24.0% / +24.9% / +11.4% は、
  分子・比べる相手・含む道具が違う別々の推定であり、「生産性 24% 向上」という一つの数ではない。
key_points:
  - claim: "採用研究 (Copilot CLI だけ) と成果研究 (Claude Code と Copilot CLI の両方) は母集団も式も別である"
    evidence: "## CLIコーディングエージェントの社内測定とは / ### 母集団の切り方 / ### 測定の並び"
    status: fact
  - claim: "+24.0% は早期コホート (2026-01-05〜11 の利用者) の 1 人 1 日マージ済み件数を合成対照と比べた事後 115 日の値。+24.9% / +11.4% は同じ人の利用週と未使用週の差 (関連) である"
    evidence: "## 三つの比率の定義 (表) / ## 因果として読める範囲"
    status: fact
  - claim: "Part 2 は因果効果として読まれておらず、Copilot CLI と Claude Code の 2.2 倍差は道具の優劣を識別していない"
    evidence: "## 因果として読める範囲 / ### 件数は価値そのものではない"
    status: fact
  - claim: "初回利用を最も強く動かすのは同僚の利用 (skip-level の 25% 以上で +216%) だが、オッズの係数であり確率の倍率ではなく、影響と homophily も分けられない"
    evidence: "## 初回利用と継続の係数 / ### オッズと、4か月の点推定 / ### 結論を弱める条件"
    status: fact
  - claim: "評価制度に写すなら比率ではなく切り方 (試行・定着・早期コホートの反事実・同一人物の利用週・品質の 5 欄) をコピーし、観測できない欄は入力から外す"
    evidence: "## 評価制度に載せる前の分岐 (表と末尾段落)"
    status: interpretation
mental_models:
  - type: structure
    key_message: "三つの比率は、別の研究・別の比較相手から出た別々の数である"
    reason_needed: "報道が 24% と 24.9% を同じ「生産性」として混同しており、二つの研究と二つの Part の分岐を見ないと数の意味を取り違えるため"
example:
  description: >-
    ITmedia の記事は 24% を「使わなかった場合より完了した仕事が 24% 増えた」と書くが、論文の +24.0% は
    早期コホートを非利用者から作った合成対照と比べた 1 人 1 日のマージ済み件数であり、「使わなかった週」との比較ではない。
    「使わなかった週」との比較は Part 2 の +24.9% / +11.4% のほうである。
  hypothetical: false
applicability:
  - "社内で AI コーディングエージェントの導入効果を測る設計 (試行・定着・件数を別の式で置く)"
  - "報道や二次記事の「生産性 N% 向上」を読むときに、分子・比較相手・母集団を確かめる"
  - "評価制度や KPI に AI 利用の指標を入れるかを判断するとき"
decision_criteria:
  - "自社ログで論文と同じ粒度の分子と母集団が取れる欄だけを評価入力に残す"
  - "+24% 型の比較は合成対照かそれに近い非利用者系列があるときだけ置く"
  - "利用週の比較は人の固定効果を入れた週次パネルがあるときだけ置く"
  - "道具の順位付けは、仕事の割り当てが道具間で揃っている別証拠があるときだけ"
  - "個人評価に組織レベルの +24.0% を配らない (推定単位はコホートか人の週次の関連)"
limitations:
  - "マージ済み件数は産出の代理であり価値・品質ではない。品質・差し戻し・レビュー待ちは未測定"
  - "PR は Azure DevOps だけ、28 日以内にマージされたものだけが分子に入る"
  - "Part 1 は自己選択した早期利用者で、採用者側だけの衝撃は合成対照で吸収されない"
  - "用量反応 (週 3 日 +15.0% / 週 5 日以上 +50.1%) は関連であり原因ではないと著者が書く"
  - "著者は測定対象の一方の道具を作る会社の社員。preprint v1 で査読済みではない"
  - "観察窓は 2026-01-05〜04-29 の約 4 か月。16 週より長い減衰は見えない"
unknowns:
  - "正確な人数・部門別の利用率・トークン支出 (費用対効果は計算できない)"
  - "レビュー相手の継続オッズの点推定"
  - "窓の中の道具選択が、窓直後の Claude Code から Copilot CLI への移行方針とどれだけ独立か"
  - "他社で同じ合成対照を組んだときの符号"
  - "外部の再解析・反論 (2026-10-17 時点で未確認。未確認は批判が無いことの証明ではない)"
