source:
  title: "エージェントの経験を知識に変えてスキルを育てる WikiSkill の三層構造"
  url: null
  path: "notes/zenn/articles/wikiskill_20261015.md"
  primary:
    - title: "WikiSkill: Compiling Agent Experience into Persistent Knowledge for Skill Evolution (arXiv:2608.27454v1, Tang et al., 2026-08-27)"
      url: "https://arxiv.org/abs/2608.27454"
  retrieved_at: "2026-10-17"
archetype:
  primary: architecture
  secondary: [research]
one_liner: "エージェントの実行経験を「生の軌跡・wiki・スキル」の三層に分けて、スキルを育てる手法。スキルは検証点が過去最良を上回ったときだけ採用し、同点も不採用。wiki は不採用でも残す。"
key_points:
  - claim: "知識 (wiki) とスキルを別の層に置くので、スキルを巻き戻しても wiki に溜めた失敗の原因や成功手順は消えない。"
    evidence: "## WikiSkill とは > 1 反復の 4 要素 / ## 特徴"
    status: fact
  - claim: "推論エージェントには wiki を渡さない。wiki を読むのは Wiki 管理者とスキル提案者。推論にも wiki を渡すと Gemini-3.5-Flash の 4 ベンチマーク平均は 63.7 から 60.9 に下がる。下がる理由 (軌跡がスキル開発の材料として弱くなる) は論文の仮説。"
    evidence: "## 運用 > アブレーションの設定を固定する (論文 Table 3)"
    status: fact
  - claim: "採用は検証点が過去最良を厳密に上回るときだけで、同点も不採用。不採用案の差分は採否履歴 (skill-impact) に残り、次の提案で同じ修正を繰り返さない。"
    evidence: "## 利用方法 > ゲートの判定 / ## ベストプラクティス > ゲートは厳密改善のまま監査を残す"
    status: fact
  - claim: "5 モデルすべてで既存のスキル進化手法 (Trace2Skill / EvoSkill / SkillOpt) を上回る。Qwen-3.5-9B + WikiSkill の平均 47.4 は、スキルなしの Qwen-3.6-27B (39.4) も上回る。"
    evidence: "## WikiSkill とは > 主結果 / ## 特徴 > モデル別の平均"
    status: fact
  - claim: "スキルは別モデルへ移せるが逆効果もある。Qwen-3.5-4B 由来の表計算スキルで Gemini-3.5-Flash は 50.5 から 18.1 に落ちる。"
    evidence: "## 運用 > 転移を別ランで測る / ## ベストプラクティス > 転移前に手順の粒度を見る"
    status: fact
mental_models:
  - type: structure
    key_message: "スキルは改善したときだけ採用し、wiki は不採用でも残す"
    reason_needed: "誰が何を読み書きするか (推論は wiki を読まない、ゲートはスキルだけ戻す) が理解の中心で、文章だけでは埋もれるため"
example:
  description: "ALFWorld (Qwen-3.6-27B) の事例。反復 0 でパターン take-examine-move-loop.md が wiki にできたが、その回の提案は不採用。反復 1 で「物を元の場所に戻さない」スキルが採用された。"
  hypothetical: false
  evidence: "## 構造 > コンポーネント図 (論文 Figure 3)"
applicability:
  - "同じ手続きで繰り返し失敗する作業"
  - "結果を 0〜1 の得点で自動採点できる作業"
  - "数学のように、モデルに依存しない手順を使い回したい作業"
decision_criteria:
  - "検証用のデータで自動採点できるか"
  - "スキルなしで検証が満点になっていないか (満点だと訓練を 1 回も回さずに止まる)"
  - "別モデルへ移す前に、移す先のモデルで検証したか"
  - "論文と比べるなら、3 回平均と採否の条件を揃えたか"
limitations:
  - "検証が 10〜18 件なのは LiveMath、SealQA、ALFWorld で、表計算は 40 件、長文は 24 件。小さい集合では 1 回の採否が揺らぐので、論文は 3 回の平均で対処"
  - "評価はスキル全文の注入だけ。スキルが増えたときの選択精度は未評価"
  - "同点を捨てるので、すぐ点数が動かない整理はスキルに残らない (知識は wiki に残る)"
  - "wiki の自動剪定はなく、長い進化では必要になり得る"
unknowns:
  - "公式実装は案内されていない。コミュニティ実装は論文の数値を再現する保証がない"
reviewed: true
