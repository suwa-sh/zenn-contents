source:
  title: "newmoのPR判定はコードが決め、レビュー待ちはラベルで数える"
  url: null
  path: "notes/zenn/articles/newmo-pr-tech-newmo-me-entry-p2_20261028.md"
  primary:
    - title: "newmo 技術ブログ（2026-10-27）プルリクエストのリスクを判定する仕組み"
      url: "https://tech.newmo.me/entry/2026/10/27/100000"
  retrieved_at: "2026-10-29"
archetype:
  primary: architecture
  secondary: [decision]
one_liner: "newmo の riskjudge は PR を approve と needs_human に分ける。承認の可否はコードが決め、LLM は所見を返すだけである。"
key_points:
  - claim: "人が必ず見る領域（認証、認可、個人情報、本番 DB マイグレーション、決済、インフラ、CI 設定）は原則 needs_human。通すのは CI の YAML のコメントだけの変更と、GraphQL と Protocol Buffers の出力型へのフィールド追加、enum 値の追加、description の文言変更だけで、決済などのパスへ効くとは書いていない。生成物だけの PR は approve だが、必ず人のパスと重なった先後は書いていない。中身が見えない差分（生成物を除いた差分が 512KB 超、または patch が返らない巨大ファイルやバイナリ）も needs_human"
    evidence: "### 機械ゲート / ### 生成物だけの承認 / ### ラベルと、見えない変更"
    status: fact
  - claim: "ゲートを通過した差分だけを LLM が読み、業務ロジックの変化、確信度、リスクを JSON で返す。LLM は approve を返さない"
    evidence: "### LLM ゲート"
    status: fact
  - claim: "残りの approve は決定式だけが返す。条件は除外パス、LLM の結果が無い、止めに相当するリスク、テストとドキュメント以外の業務ロジックの変化、確信度が 0 以上 1 以下の外か閾値未満。変化と確信度とリスクは JSON のその項目を見る。除外パスが人が必ず見る領域と同じ集合か、止めの値の並びは、記事が確定していない"
    evidence: "### 決定式 / ### 機械ゲート"
    status: fact
  - claim: "needs_human と判定した PR と、判定に失敗した PR（LLM の呼び出し失敗を含む）には needs_human ラベルが付く。待ち件数で新しい作業を止めることは条件にできるまでで、本番で強制したとは書いていない"
    evidence: "### ラベルと、見えない変更 / ### レビュー待ちの件数"
    status: fact
  - claim: "approve した PR がリリース後の不具合の原因になった割合は needs_human の半分ほどだが、needs_human に大きな変更や重要領域が集まるので単純比較できない。業務ロジックの変化で止めた PR のレビュー指摘率も approve とあまり変わらず、どちらも分母は無い"
    evidence: "### 効果の数字"
    status: fact
mental_models:
  - type: behavior
    key_message: "生成物だけと人が必ず見る領域は機械ゲートが決め、それ以外の承認は決定式が決める。LLM は所見を返すだけである"
    reason_needed: "生成物だけの approve を決定式の話に畳むと、ゲートで既に分かれる PR を見落とすため"
example:
  description: "生成物だけの PR は機械ゲートで approve する。必ず人のパスと重なった先後は書いていない。認証や決済などのパスと中身が見えない差分は機械ゲートで needs_human。ゲートを通過して決定式の 5 条件に当たらない PR は決定式が approve する"
  hypothetical: false
  evidence: "### 機械ゲート / ### 決定式 / mermaid flowchart TD"
applicability:
  - "必要承認が 1 のリポジトリで、bot の承認がその 1 枠を埋めてよいかを先に決めるとき"
  - "レビュー待ちをラベルで数え、エージェントが新しい実装を始める条件にしたいとき"
decision_criteria:
  - "承認の可否を出している場所が、LLM の文面か、終了コードか"
  - "needs_human に相当する状態を、どのゲートで決まったかまで残せるか"
  - "レビュー待ちの件数は、自分の待ち時間から決める"
  - "エージェントが書いた PR に人の承認を 2 つ求めるルールが残っているなら、判定 bot の Approve をその人数から外しているか"
  - "生成物だけの差分で、生成器のソースが同じ PR に無いものは、初期は人に残すか"
limitations:
  - "approve した PR がリリース後の不具合の原因になった割合は needs_human の半分ほどだが、needs_human に大きな変更や重要領域が集まるので単純比較できない。業務ロジックの変化で止めた PR のレビュー指摘率も approve とあまり変わらず、どちらも分母は無い"
  - "見逃した不具合の多くは呼び出し先や別ファイルの SQL など差分の外である。入力が差分とパスである限り、この型の見逃しは残る"
  - "コードオーナーでない作成者は人に固定されない。確信度の閾値（既定 0.80、重要領域 0.95）に 0.10 を足すだけである。足したあとを 1 で頭打ちにするかは記事にない"
  - "人がレビューした PR と、人が bot の承認を取り消した PR は、自動では承認し直さない。push で承認が消えることと、PR のコードを実行しないことは、ruleset と workflow が公開されていないので外部からは監査できない"
  - "重要領域か変更行数 1,000 超では LLM 判定を 3 回する。まとめは多数決ではなく、1 回でも懸念があれば懸念あり、確信度は最小を取る。懸念がリスクか業務ロジックの変化か確信度かは記事が分けていない。決済は人が必ず見る領域の列にも 3 回の例にも挙がり、両方に当たる PR をどの段で止めるかは書いていない"
unknowns:
  - "除外パスと、人が必ず見る一覧が同じ集合か"
  - "確信度に 0.10 を足したあとを 1 で頭打ちにするか"
  - "決済のように両方に挙がる PR を、機械ゲートと 3 回判定のどちらで止めるか"
  - "1 回の判定の懸念が、リスクか業務ロジックの変化か確信度か"
  - "1,000 行の変更行数が、生成物・テスト・ドキュメントを除いた行数と同じか"
  - "生成物だけの approve と、人が必ず見るパスが同じ PR で重なったとき、どちらが先か"
  - "git check-attr が base と head のどちらを見るか（head なら PR が linguist-generated を足して生成物だけの経路に入れる余地がある）"
reviewed: true
