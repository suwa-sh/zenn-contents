source:
  title: "個人向けChatGPTの業務利用を165活動で国別に見る"
  url: null # Zenn 下書き (published: false)。公開 URL なし
  path: "notes/zenn/articles/openai-100-165-chatgpt-ai-p7_20261028.md"
  primary:
    - title: "ChatGPT’s expanding world of work（OpenAI、2026-10-26）"
      url: "https://openai.com/index/chatgpt-expanding-world-of-work"
    - title: "Download data and methodology（OpenAI Signals v3.0、CC BY 4.0）"
      url: "https://openai.com/signals/data-download/"
    - title: "OpenAI Signals README Version 3.0（データ辞書 PDF）"
      url: "https://cdn.openai.com/signals/data-dictionary.pdf"
    - title: "How People Use ChatGPT（NBER Working Paper 34255、Chatterji et al., 2025）"
      url: "https://www.nber.org/papers/w34255"
    - title: "O*NET 31.0 Database（O*NET Resource Center）"
      url: "https://www.onetcenter.org/database.html"
  retrieved_at: "2026-10-29"
archetype:
  primary: research # 公開集計の範囲、数字、分類の一致、読む境界
  secondary: [decision] # 育成と評価で三つの層を混ぜない
one_liner: >-
  OpenAI が 2026年10月26日に公開した Signals v3.0 は、個人向け ChatGPT の業務メッセージを
  165 活動に分けた国別シェアである。評価項目の一覧にはならない。
key_points:
  - claim: "1行は、国・四半期・活動に対する、個人プランの業務関連メッセージのシェアである。組織向けプラン（enterprise）と Codex（辞書が enterprise のメッセージと並べ、この集計の外だと名指しする対象）は入らない。この二つを除くと、業務と技術の利用を過小にしうる。会話本文、送り手の職種、成果は列に無い"
    evidence: "冒頭 / ### メッセージから集計行まで / ### 1行が持つもの"
    status: fact
  - claim: "活動バケットは 165 個である。O*NET（米国労働省系の職業情報）の中間作業（IWA）のうち、個別に残す基準を超えた 164 個と、その基準に届かなかった活動を束ねた Other IWA である。分類器は 332 個から 1 つを選ぶか、どれにも定めない（Unclear）。シェアが小さいから既に個別の活動を Other へ移す規則ではない"
    evidence: "### メッセージから集計行まで / ### ファイル上の主な数字"
    status: fact
  - claim: "2025年第1四半期から2026年第3四半期までの 7 四半期すべてに行がある 74 か国を、国の大小で重みを変えず平均すると、各国内の上位 10 活動の合計は 0.560427 から 0.510520 へ下がる。発表文の 56.0% と 51.1% は、この再計算と小数第 1 位で一致する。差には利用構成の変化のほか、集計の不確実性と期間ごとの累積プライバシー予算の違いが影響しうる。寄与の内訳は、この公開値だけでは分からない"
    evidence: "### ファイル上の主な数字 / ### 差分プライバシーと時点の比較"
    status: fact
  - claim: "2026-07-01 始まりの四半期で、日本の最大は文書や資料を編集する 0.14505、次は視覚的なデザインや表示を作る 0.06663 である。米国も最大は同じ文書編集 0.17102、次が視覚デザイン 0.07629 である"
    evidence: "### ファイル上の主な数字"
    status: fact
  - claim: "IWA 分類の人間のみの Fleiss κ は Table 5 で 0.34 [0.23, 0.45]、業務の二値分類の人間のみの Fleiss κ は 0.66 [0.54, 0.76] である。検証入力は本番の ChatGPT ログではなく、WildChat の 100 件、人間の注釈者 2 人、332 分類である"
    evidence: "### 活動名の一致"
    status: fact
mental_models:
  - type: structure
    key_message: "この公開は個人プランの分類地図だけを出し、組織の利用量と人の判断は別の層で持つ"
    reason_needed: "シェアの大小から、組織の本番利用や、人に残す判断を推定しない、という境界が判断の中心なため"
example:
  description: >-
    2026年第3四半期の日本で先頭の文書編集（シェア 0.14505）を三つの層に置く。
    第1層では、個人プランの業務関連メッセージのうち分類器が文書編集へ振った割合が約 14.5% だと読む。
    第2層では、自社の本番利用量をこの 14.5% から推定しない。
    第3層では、チャットに出した文書の事実と対外的な責任を、ラベルとは別に人が持つかを書く。シェアの大小では分けない。
  hypothetical: false
  evidence: "## 育成と評価では三つの層を混ぜない"
applicability:
  - "個人プランに来た作業の種類を、国と時点で比べるとき"
  - "職種名ではなく、文書編集や視覚化のような粗い束で育成の問いを切るとき"
  - "チャットに来ない作業が雇用側に残る差を見るとき。公開元は、対応づけた米国職業の雇用加重タスクの約 43% が Other IWA だと書く（公開ブログの記載。同じ配布物の CSV には計算表が無い）"
decision_criteria:
  - "見ているのが個人プランのメッセージシェアか。enterprise と Codex は入っていない"
  - "日本で使うなら、2026年第3四半期の上位 5 活動（文書編集 0.14505、視覚デザイン 0.06663、言語・文化情報の解釈 0.04534、教育・職業上の助言 0.04250、マーケ素材の作成 0.03566）までに留め、それより下の順位を使っていないか"
  - "活動名を評価項目の正式名称にしていないか。IWA の人間一致が自社の作業一覧で実用に足るか、企業プランを同じ活動一覧で出した公開が個人プランと同じ順位を示すまでは、評価項目の一覧にしない"
  - "組織の利用量を、自社の enterprise または API のログか、作業時間の自己申告で別に取るか"
  - "束ごとに「チャットに出してよいか」と「人が最終判断を持つか」を分けて書き、シェアの大小では分けていないか"
limitations:
  - "測っているのは、個人プランに残り、削除されておらず、モデルの学習への利用を拒否していない、申告年齢 18 歳以上のアカウントのメッセージが、どの活動へ振られたかである。職が置き換わった割合でも、作業が完了した割合でもない"
  - "1 メッセージは 1 ラベルに潰れる。同じ意図の往復は複数回数えうる。単位は送り手の人数でも、作業の完了でもない。enterprise と Codex は除外され、辞書は business use を過小にしうると書く"
  - "活動名の検証は、本番の ChatGPT ログではなく、WildChat 100 件・人間の注釈者 2 人・332 分類である。近い活動が別ラベルになりうる。日本の行は、日本の職務記述ではなく、米国の職業リストへの分類結果である"
  - "国×活動の細かい順位は分母が公開されず、シェアの標準誤差の列も無い。重みとノイズのあとの実効メッセージ件数が 1000 を少し超えるだけの国では、小さい行は件数ノイズに対して不安定になりうる。この重みは、74か国を等加重する重みとは別で、日次の重み（標本の日別構成をその月の送信割合に合わせる。上限 1.5）である。2025年第1四半期を含む古い側のプライバシー予算（ε=5）は、2026年7月から9月の初回公開（ε=1）より緩い"
unknowns:
  - "Unclear を付けたメッセージがシェアの分母に残るかは、公開された列の説明には無い。個別に残す基準の数値も公開表に無い"
  - "約 43% の雇用加重が、どの職業とタスクの対応で計算されたかは、公開 CSV からは分からない。人数か時間かの内訳も CSV に無い"
  - "2026年7月始まりの四半期の国数は 76 で、2025年1月始まりの 90 より少ない。7四半期すべてに行がある 74 か国とは別の数え方である。76 まで減った理由は、利用の縮小か、実効メッセージ 1000 未満の国・四半期をまとめて出さない規則か、分母が列に無いので切り分けられない"
  - "work、schoolwork、other のどれが二値の work_related に入るかを辞書は書いていない。学習、転職、起業を同じ境界で落としているとは書かれていない"
  - "2026年10月26日のこの公開自体への独立した検証は、2026年10月28日時点では見つかっていない"
reviewed: true
