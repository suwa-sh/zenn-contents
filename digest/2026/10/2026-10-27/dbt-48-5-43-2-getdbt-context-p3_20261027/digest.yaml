source:
  title: "dbt Labsが同一スキル80回で比べた文脈の渡し方"
  url: null
  path: "notes/zenn/articles/dbt-48-5-43-2-getdbt-context-p3_20261027.md"
  primary:
    - title: "Showing our work: a controlled experiment in context engineering"
      url: "https://www.getdbt.com/blog/context-engineering-experiment-dbt-mcp"
    - title: "From analytics engineer to context engineer"
      url: "https://www.getdbt.com/blog/from-analytics-engineer-to-context-engineer"
  retrieved_at: "2026-10-28"
archetype:
  primary: research
  secondary: [decision]
one_liner: "実行前に作った要約（自前要約）は、通話を記録するサービスから渡した全文より手順の実行が安く速い。新しいプロジェクトまたはリポジトリの決定は、その全文では16/20、自前要約では0/20である。"
key_points:
  - claim: "タイトルのスキルは、通話から振り返りPDFを作る社内の手順で、変えたのはそこへ渡す文脈だけである。4通りは、通話を記録するサービスから渡す全文、同じ全文を Snowflake から読む、ベンダー要約、自前要約で、プロンプトは同じまま各20回である"
    evidence: "## 文脈実験とは / ### 固定した条件と変えた条件"
    status: fact
  - claim: "全文は約3万から7.2万文字。ベンダー要約は約500から600文字でデータベースの列へそのまま入る。自前要約は約1.2万から2万文字で、実行前に Snowflake の AI_COMPLETE で作った事実に基づく要約である。発言に無いことは足さず、分割・埋め込み・分類は入っていない"
    evidence: "### 4つの文脈源 / ### 自前要約の生成"
    status: fact
  - claim: "自前要約の手順の実行（指示、ツール呼び出し、PDF生成を含む全体）は、通話を記録するサービスから渡した全文に対し費用48.5%安（平均 $0.34 対 $0.66）、時間43.2%短（95.8秒対168.7秒）。このドルに、要約を作る課金を足した記述は無い"
    evidence: "### 実験記事が示した平均 / ### 百分率の分母"
    status: fact
  - claim: "品質は、その種類の詳細が出た回数であり、中身の網羅率ではない。ベンダー要約は日付、数値、肩書き、新規の決定、次の手順が0/20。自前要約は、記録サービスから渡した全文に対し、日付12/20対15/20、数値13/20対14/20、肩書き9/20対15/20、新規の決定0/20対16/20。次の手順は自前要約が16/20で、全文の2条件はどちらも11/20"
    evidence: "### 6分類の数え方 / ### 実験記事が示した平均"
    status: fact
  - claim: "2026-08-06の別記事にあるトークン約98%減は、文脈そのものの大きさの比較である。今回の百分率はスキル実行全体なので足さない。この80回は、文章を分割し埋め込み検索する型を測っていない"
    evidence: "### 別測定の98%とは足せない / ### ベクトル検索の効果ではない"
    status: fact
mental_models:
  - type: structure
    key_message: "自前要約はスキル実行を軽くするが、新しいプロジェクトの決定は出ない"
    reason_needed: "費用と時間の減りだけを読むと、決定が20回とも出ないことが落ちるため"
example:
  description: "通話サービス側の全文、ベンダー要約、自前要約の、スキル実行の平均費用・時間と、新規の決定が出た回数"
  hypothetical: false
  evidence: "### 実験記事が示した平均"
applicability:
  - "残す事実の種類を手順ごとにリストし、全文、ベンダー要約、自前要約を同じ課題で比べる"
  - "次の手順を具体にする目的で、自前要約を候補にする"
  - "要旨だけで足りる手順で、ベンダー要約を4つの中の最安として選ぶ"
decision_criteria:
  - "日付、数値、肩書き、新規の決定、次の手順が要るなら、ベンダー要約を既定にしていないか"
  - "決定と肩書きが毎回必須なら、この自前要約を全文の代わりにしていないか"
  - "費用を、要約の生成、文脈の取得、手順本体に分けて記帳しているか"
  - "この実行全体の削減率を、別記事の文脈サイズ約98%減と足していないか"
  - "この80回を、文章の分割、埋め込み、検索の効果として読んでいないか"
limitations:
  - "採点は表面化した回数である。数回の差は各20回の平均だけでは差と言い切れない。0/20と16/20は、その行の有無としては大きい"
  - "費用の減り48.5%に対し、平均トークンの減りは約33.5%である。差の理由は実験記事に無い"
  - "同じ全文を Snowflake から読む条件は、通話を記録するサービスから渡した全文（$0.66、168.7秒）に対し費用13.6%安、時間14.4%短、決定15/20で、全文同士の品質帯は近い。絞り込み列の中身は実験記事に無く、その列だけが13.6%の原因とはトークン減約3.2%からは切り分けられない"
  - "顧客データは非公開で、第三者は同じ80回を再実行できない"
unknowns:
  - "実行したモデル名、採点者、期待する文字列、要約生成の金額は実験記事に無い。決定の0/20が、要約に無かったのか、成果物まで届かなかったのか、採点の文言が狭かったのかも分かれていない"
  - "要約を毎回作り直してスキルを1回しか走らせないとき、何回再利用すれば元が取れるかは、生成のドルが非公開なので計算できない"
reviewed: true
