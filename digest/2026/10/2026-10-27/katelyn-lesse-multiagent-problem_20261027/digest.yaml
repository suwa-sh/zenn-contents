source:
  title: "マルチエージェントを本番で動かす4つの問題を一次資料で切り分ける"
  url: null
  path: "notes/zenn/articles/katelyn-lesse-multiagent-problem_20261027.md"
  primary:
    - title: "Katelyn Lesse の X の論考"
      url: "https://x.com/katelyn_lesse/status/2114542280535318557"
    - title: "Katelyn Lesse: エージェントの安全な構造とサンドボックス（2026-09-13）"
      url: "https://www.katelynlesse.com/blog/secure-agents-architecture-and-sandboxing"
    - title: "GKE: About Agent Substrate"
      url: "https://docs.cloud.google.com/kubernetes-engine/ai-ml/about-agent-substrate"
    - title: "Google Agent Identity の概要"
      url: "https://docs.cloud.google.com/gemini-enterprise-agent-platform/govern/agent-identity-overview"
    - title: "open-telemetry/semantic-conventions-genai"
