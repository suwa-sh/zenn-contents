source:
  title: "オンライン本人確認が券面画像からICへ移るとき、過去に預かった画像をいつまで残すか"
  url: null
  path: "notes/zenn/articles/ic-nikkei-p6_20261024.md"
  primary:
    - title: "犯罪による収益の移転防止に関する法律施行規則 (e-Gov)"
      url: "https://laws.e-gov.go.jp/law/420M60000F5A001"
    - title: "令和7年省令第3号に関する Q&A (警察庁)"
      url: "https://www.npa.go.jp/sosikihanzai/jafic/hourei/data/25062402qa.pdf"
    - title: "犯罪収益移転防止法の概要 2026年8月7日版 (警察庁)"
      url: "https://www.npa.go.jp/sosikihanzai/jafic/hourei/data/hougaiyou20260807.pdf"
    - title: "金融庁 2026年10月9日 注意喚起"
      url: "https://www.fsa.go.jp/news/r8/sonota/20261009/20261009.html"
    - title: "PayPay 2026年10月23日 発表"
      url: "https://about.paypay.ne.jp/pr/20261023/01/"
  retrieved_at: "2026-10-25"
archetype:
  primary: governance
  secondary:
    - decision
one_liner: "2027年4月1日、非対面の本人確認で、顔と券面の画像をセットで送らせる方式などが削られる。受付を変えた日は過去の画像を消してよい日ではなく、確認記録の添付として契約終了日等から7年残す。"
key_points:
  - claim: "2027年4月1日に削られるのは、顔と券面を同時に送る方式と、一般の写し送付である。根拠は犯収法施行規則の改正（令和7年省令第3号）で、給与振込口座など一部の写しは残る。容貌の画像と IC 内の情報、署名用電子証明書などは残る。原本または IC 情報は転送不要郵便と組んで残り、非居住者等の券面画像や書類送付も同じ組み合わせで残る。"
    evidence: "オンライン本人確認のIC移行とは / 削られる方式と残る方式"
    status: fact
  - claim: "IC へ移っても、容貌の画像は多くの経路で新規に届き続ける。金融庁の「IC チップ情報の読取に原則一本化」は、条文が残す方式より広い要約である。"
    evidence: "注意点 / 「顔写真のデータを預からなくなる」は、残る方式と合わない / 「IC に原則一本化」は条文より広い要約"
    status: fact
  - claim: "確認記録は契約終了日等から7年残し、添付の画像や IC 情報もその期間残し、書いた内容は消去できない。起算は、預金口座など契約終了日で終わる取引はその日、それ以外は取引の日が基本で、どちらの場合も、本人確認を省いた後日の取引が取引の日で終わりその日が基本の起算日より後ならその日へずれる。"
    evidence: "確認記録の作り方と保存期間 / 保存期間の起算日 / 添付と既記載の扱い"
    status: fact
  - claim: "個人情報保護法第22条の消去は努力義務であり、犯収法の保存期間中は利用の必要がなくなったとは言いにくい。方式を変えた日に過去の画像を消せ・消してよいと書いた警察庁・金融庁・個人情報保護委員会の文書は、2026年10月24日時点の確認範囲に無かった。"
    evidence: "個人情報保護法との関係"
    status: interpretation
  - claim: "確認した範囲には、受付方式の変更と同時に委託契約を改めよという明文は無かった。それでも委託先へ券面画像を提出させる条項が残っていれば、新しい受付が IC になっても画像は作られ続けるので、金融庁の注意喚起が求めるサードパーティリスク管理の点検に載せる価値がある。"
    evidence: "委託先との契約は、同じ日に直す義務があるか"
    status: interpretation
mental_models:
  - type: structure
    key_message: "受付方式の切り替えは新規受付だけを変え、過去の確認記録の保存期間には効かない。"
    reason_needed: "「受付を止めた日 = 過去の画像を消してよい日」という取り違えを、図の上で分けるため。"
example:
  description: "金融庁の前倒し要請 (2026年10月9日の注意喚起) にあたる、三井住友銀行の個人口座と PayPay の現行手順の比較。運転免許証の IC をオンラインの経路に残すかが揃っていない。"
  hypothetical: false
  evidence: "銀行と PayPay で、何が残っているか"
applicability:
  - "オンライン本人確認 (eKYC) の受付方式を変える立場で、何を止めて何を残すかを決めるとき。"
  - "過去に預かった券面画像の保存・削除の方針を見直すとき。"
decision_criteria:
  - "運転免許証の IC の扱いは銀行の個人口座とコード決済（具体例の PayPay）でも揃っていないので、他社の手順を写さず、やめる方式と法令上残る方式を一覧にしているか。"
  - "過去の確認記録を方式変更日に消さず、起算日が延びる取引を台帳に残しているか。"
  - "施行前に発送され施行後に届いた写しを、届いただけでは確認にせず、残る方式でやり直しているか（同省令の警察庁 Q&A No.4）。"
  - "委託先へ券面画像を出させる条項の有無を、金融庁が求める委託先の点検に載せているか。"
limitations:
  - "報道の見出しにある「3メガバンクが顔写真の本人確認を廃止」は公式発表より広い。公式に停止日を確認できるのは三井住友銀行の2026年10月23日だけで、みずほ銀行の2026年10月19日と三菱UFJ銀行の2026年5月は報道ベースの日付である。"
  - "PayPay の撮影申請の廃止は11月上旬までの予告で、10月24日時点の手順ページには撮影経路が残る。在留カード裏面の撮影画像は IC 情報ではなく、IC で現在の住居を確認できなければ住居を別に確認する必要がある (Q&A No.9)。"
  - "個人情報保護委員会の通則ガイドライン (3-4-1) には、法令で保存期間等が定められている場合は除く、という趣旨の注記があると元記事は読んでいる。運用前に本文の文言確認が要る。"
  - "非居住者等の対象者と対象取引、写しが残る一部取引の範囲は特定していない。三井住友銀行の法人口座やカードローンが同じ停止に含まれるかも確認できていない。"
unknowns:
  - "金融庁の注意喚起が踏まえるとする、内閣官房 (国家サイバー統括室) の同日 (2026年10月9日) の注意喚起の本文。"
  - "非居住者等の対象者と対象取引。写しが残る一部取引の範囲。"
  - "三井住友銀行の法人口座やカードローンが、個人口座と同じ停止に含まれるか。"
reviewed: true
