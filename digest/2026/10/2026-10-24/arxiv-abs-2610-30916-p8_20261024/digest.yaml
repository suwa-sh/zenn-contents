source:
  title: "コードを人が書かない開発で何が希少になるか、AI支援アジャイルの経験報告を読む"
  url: null # Zenn 下書き (published: false)。公開 URL なし
  path: "notes/zenn/articles/arxiv-abs-2610-30916-p8_20261024.md"
  primary:
    - title: "Weber, Zimmermann, Franceschetti. When Code Gets Cheap, Evaluation Gets Scarce: An Experience Report on AI-Assisted Agile Software Engineering. arXiv:2610.30916v1, 2026-10-22"
      url: "https://arxiv.org/abs/2610.30916"
    - title: "成果物パッケージ (Zenodo, 2026-10-22)"
      url: "https://doi.org/10.5281/zenodo.23337589"
  retrieved_at: "2026-10-25"
archetype:
  primary: research # 開発者1人の経験報告。数値は記述統計
  secondary: [decision, governance] # 見積の別枠とレビュー完了の定義 / 好みのゲートと硬いゲート
one_liner: >-
  AI 助手にコードを書かせ、採点アプリを作った論文の経験報告。反復を縛ったのはコードを書くことではなく、
  結果が正しく必要を満たすかを知ることだった。何を信じいつ止めるかを人が決める工学的判断も、別の不足として残った。
key_points:
  - claim: "評価が足りなかった原因は費用ではなく、検査を起動しない、検査が本物の環境の境界を踏まない、という怠り (neglect) だった。この事例で評価の費用はほとんど無かった。もう一つの不足は、失敗を診断し技術判断をする工学的判断である"
    evidence: "### 何を作ったか (§6.2) / ## 注意点"
    status: fact
  - claim: "要求は事前に書けるもの (仕様とテストで固定する) と、使って初めて分かるもの (動く候補を見て決める) に分かれる。3日目の成績面談用レポートはテストを通ったが、必要だった読めるフィードバックを外した"
    evidence: "### 事前に書ける要求と、使って初めて分かる要求"
    status: fact
  - claim: "付録が挙げた欠陥の最初の検出手段は、単体テスト0件、自動 UI スモーク0件、実環境 (ブラウザ、実行時のモデル API、配備) 7件、動くシステムを見た人4件だった。全欠陥の母数ではない"
    evidence: "## 注意点 (Appendix A の指標 M3) / ### テストが本物の環境を踏まなかった欠陥"
    status: fact
  - claim: "提案、編集、コミットを1回のやり取りでまたぐ助手では、好みのゲート (道具が強制しない習慣) は迂回され、人の監視は誰かが強制する規律になる (oversight inversion)。助手が main に書けないフックを入れたあと、基準日 (2026-07-09) までのコード変更27件はすべてプルリクエスト経由になった"
    evidence: "### 好みのゲートは迂回される / ### 判断を支える観察"
    status: fact
  - claim: "見積は実装と別に、機械で落とす合否、実物を見る人の地点、セッションをまたぐ証拠 (引き渡しメモや判断記録)、工学的判断、初回の配備、に分けるのが元記事の筆者の読みで、この事例と整合する。「評価」一語にまとめると、診断、配備、構造の維持が隠れるが、分けた効果は測定されていない"
    evidence: "## 見積には何を別枠で置けばよいか"
    status: interpretation
mental_models:
  - type: behavior
    key_message: "1周が閉じるのはテストが通ったときではなく、人が実データで振る舞いを確認したとき"
    reason_needed: "行単位の閲読をマージ条件から外したとき、代わりに何が完了を決めるかが流れの中の位置で分かるため"
example:
  description: >-
    実装は、設問 ID が試験をまたいで一意だという前提に立っていた。前提は記録されず後の要求で崩れ、
    一方の試験の編集が他方に現れた。この欠陥は約555の通過済みテストと自動 UI ハーネスを通り、人が実データで見つけて直した。
  hypothetical: false
  evidence: "### テストが本物の環境を踏まなかった欠陥 / ## 注意点 (Appendix A の指標 M3)"
applicability:
  - "エージェントに実装を任せる開発で、見積や1サイクルの完了定義を見直すとき"
  - "行単位のコードレビューをマージ条件から外すかを決めるとき"
decision_criteria:
  - "事前に書ける要求と非交渉条件 (どの要求よりも優先して守る条件) は、散文ではなくテストの断言 (assertion) にする"
  - "アーキテクチャの上限 (例: UI がインフラに直接依存する箇所の数) は、ラチェット (一度改善した水準へ戻れなくする仕組み) にする"
  - "モックの外 (ブラウザ、実行時のモデル API、配備、実データ) と使って初めて分かる必要には、実物を見る人の確認地点を毎周に置く"
  - "レビュー完了は「人が読んだか」ではなく、変更ごとの仕様とテスト、ラチェット、助手が main に書けない硬いゲート、で数える (§7.2)"
  - "前提は判断記録に再訪条件つきで残す"
limitations:
  - "開発者1人が開発者、利用者、領域の専門家を兼ねた自己報告で、数値は記述統計である。アプリのソースと試験データは非公開で、成果物パッケージにも入っておらず、独立した再現はできない"
  - "数字は時点が違う。開始から3営業日の時点はストーリー41、テスト415で、テスト804と、テストを除くコード約9,000行は、3日目の成績面談用レポートより後で、学生向けフィードバック版を足す直前の基準日 2026-07-09 の数字である。大学でのパイロット運用はその後の文脈である"
  - "基準日前のプルリクエスト61件のオープンからマージまでの中央値は約2.8分で、マージは人が読み終えた記録にならない"
  - "評価者が別の人で待ちが反復より長いなら、律速は価格より、評価者が生成に追いつく速さになる、と論文の著者は予測するが測定ではない。評価に別の人や専門性が要る現場では反復の利得が縮むという予測も未測定である。評価の待ち時間は記録されておらず、人の判断の遅延を時間に換算できない"
  - "論文の著者は ICSE 2027 の実務トラック (SEIP) の経験報告と位置づけるが、採録は 2026-10-24 時点で確認できない"
unknowns:
  - "評価の別枠を置いた見積と置かない見積で、どれだけ差が出るか"
  - "評価者が別の人のとき、待ち時間がどれだけ反復を縛るか"
  - "開発者と領域の人のペアで、三役兼任の速さをどこまで取り戻せるか"
reviewed: true
