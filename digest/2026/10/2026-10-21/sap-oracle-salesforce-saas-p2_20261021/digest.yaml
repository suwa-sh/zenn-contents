  title: "SAP・Oracle・Salesforceのエージェント経路で見積と承認と取消の主体を分ける"
  url: null # Zenn 下書き (published: false)。公開 URL なし
  path: "notes/zenn/articles/sap-oracle-salesforce-saas-p2_20261021.md"
