source:
  title: "GMOの社内RAGが申請と登録までの処理へつながる条件"
  url: null # Zenn 下書き (published: false)。公開 URL なし
  path: "notes/zenn/articles/gmo-rag-kn-itmedia-co-jp-p5_20261021.md"
  primary:
    - title: "GMOインターネットグループ「社内ナレッジを参照するAIが、業務フローまで自動化」2026-10-19"
      url: "https://group.gmo/news/article/10247/"
    - title: "GMOインターネットグループ「法人向けRAG『GMO AI RAG』提供開始」2026-06-30"
      url: "https://group.gmo/news/article/10081/"
    - title: "キーマンズネット「GMO、生成AIの『答えるだけ問題』を解消へ」2026-10-21"
      url: "https://kn.itmedia.co.jp/kn/article/2610/21/2000002373/"
    - title: "OWASP Gen AI Security Project, LLM06:2025 Excessive Agency"
      url: "https://genai.owasp.org/llmrisk/llm062025-excessive-agency/"
  retrieved_at: "2026-10-22"
archetype:
  primary: decision # 規則をどこで止め、1サイクルの終わりを何にするか
  secondary: [architecture] # 根拠を出す側と、処理する側の分担
one_liner: >-
  発表は、社内文書から根拠を出す側と、申請や登録を進める側を分けている。
  処理の終わりは、記事が台帳（結果の記録）の4状態に置く。
key_points:
  - claim: "2026年10月19日の発表は、GMO AI RAG（社内文書から参照箇所を出す側）とJOINT（業務システムからの取得、登録、承認、通知の流れを組む側）に役割を分けている。規程ファイルの更新が参照へ反映されるのは、次回の取り込み以降である"
    evidence: "## GMO AI RAGとJOINTの連携とは（役割の段落、更新の順序）"
    status: fact
  - claim: "発表は「稟議や申請まで自動化を広げられる」と書くが、申請済みなどの状態名、規則違反での拒否、拒否が期待と一致した割合は書いていない。下書き、拒否、人待ち、登録済みは、記事が置く終端名である"
    evidence: "## 注意点（発表の文言と記録の差）"
    status: fact
  - claim: "検索だけで止めると、必要な条文が取れなかった違反は通る。記事が勧める3段（検索は証拠、項目検査は金額や日付や必須添付や重複や権限を値だけで拒否する検査、高影響（権利、金、対外通知、設備）は人の承認）は、製品が保証する仕様ではない"
    evidence: "## 規則違反を止める位置"
    status: interpretation
  - claim: "1サイクルの終わりは、正しい文章が返ったことではなく、台帳の下書き、拒否、人待ち（人の判断が終わるまで登録へ進めない状態）、登録済みのどれかである。規程更新直後に更新前の参照のまま進んだ件数は、モデルの誤答に混ぜず、待ちの長さとして数える"
    evidence: "## 1サイクルの終わり方"
    status: fact
  - claim: "ベンダーのF1@10（上位10件についてのF1）は、根拠の一致、台帳の状態、取り込み待ちの代わりにしない"
    evidence: "## 1サイクルの終わり方（F1を代わりにしない）"
    status: fact
mental_models:
  - type: behavior
    key_message: "1サイクルは文章の返却では終わらず、台帳の4状態のどれかに着地する。検索の未ヒットは許可にしない"
    reason_needed: "根拠の有無、項目検査、人の承認が、どの終端状態へ分かれるかを一度に示すため"
example:
  description: "止め方は3段である"
  hypothetical: false
  evidence: "## 規則違反を止める位置（止め方の表）"
applicability:
  - "規程の更新直後は下書きまでで止め、次の取り込みが成功する前に登録済みへ自動で進めないとき"
  - "連携の見積もり前に、呼び出し方式と取り込み失敗時の参照を文書で確認するとき"
decision_criteria:
  - "1サイクルの終わりを、文章の返却ではなく下書き、拒否、人待ち、登録済みのどれかに置いているか"
  - "検索で根拠が取れない申請を、許可として登録へ進めていないか"
  - "金額、日付、必須添付、重複、権限を、登録の直前に項目の値だけで拒否しているか"
  - "権利を渡す、金を動かす、外へ知らせる、設備を操作するときは、人の承認が終わるまで登録済みにしていないか"
  - "呼び出し方式、取り込みの間隔と失敗時の参照、承認が必須になる条件が文書にあるか。無ければ登録済みまでの自動実行を前提にしていないか"
limitations:
  - "参考価格は GMO AI RAG の Enterprise版だけで、税別、インフラ費用は別である。RAG と JOINT の両方の代金ではない"
  - "チューンドRAG（検索精度の有料オプション）の F1@10 は、既存アルゴリズム比で約1.4倍から1.8倍という自己申告である。JQaRA（Wikipediaのクイズ）での数字であり、社内規程の受理率ではない"
  - "製品ページは「AIが常に最新情報を自動で学習します」とも書く。即時反映ではないという補足は、キーマンズネット編集部の文であり、ベンダーの注記ではない"
  - "JOINTの円建ての定価は公式発表に無く、利用規約は報酬を個別契約と申込書で定める。比較サイトの月額5万円からという表示は二次情報である"
unknowns:
  - "呼び出し方式、取り込み失敗時に参照する内容、どの遷移で承認が必須か、導入後の状態遷移の一致と取り込み待ちの件数は、2026年10月21日時点の公開資料では文書になっていない"
reviewed: true
