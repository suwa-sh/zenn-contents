source:
  title: "Vercel CIベータが選ぶタスクと残す既存CIの条件"
  url: null # Zenn 下書き (published: false)。公開 URL なし
  path: "notes/zenn/articles/vercel-ci-ci-cd-vercel-ci-p3_20261029.md"
  primary:
    - title: "Introducing Vercel CI（Vercel、2026-10-28）"
      url: "https://vercel.com/blog/introducing-vercel-ci"
    - title: "Vercel CI（Vercel Docs、last_updated 2026-10-28）"
      url: "https://vercel.com/docs/ci"
    - title: "Vercel CI Pricing（Vercel Docs、2026-10-28）"
      url: "https://vercel.com/docs/ci/pricing"
    - title: "About protected branches（GitHub Docs）"
      url: "https://docs.github.com/en/repositories/configuring-branches-and-merges-in-your-repository/managing-protected-branches/about-protected-branches"
  retrieved_at: "2026-10-30"
archetype:
  primary: decision
  secondary: [architecture]
one_liner: "GitHub の Linux タスクだけ Vercel CI を足し、失敗したチェックだけがマージを止める。影響判定の漏れは別のテストで見る。"
key_points:
  - claim: "Vercel CI（2026-10-28 公開のベータ）は、GitHub への git push に対し、turbo.json の ci タグが付いたタスクを選び、Linux の別マシンで実行する。入力が同じタスクは Remote Cache から戻し、失敗は pull request のチェックになり、branch protection のマージ条件にできる"
    evidence: "冒頭 / ## Vercel CIとは / ### 操作と、push からチェックまで"
    status: fact
  - claim: "選択の単位は package#task である。Pro は 1 CPU minute あたり $0.0035（1 CPU が 1 分で 1）。復元と影響外は課金せず、bootstrap は課金する"
    evidence: "### どのタスクが走るか / ### 環境変数と課金"
    status: fact
  - claim: "ブログの「2〜6 倍速い」と約 800 万タスク完了は、比較条件が非公開の自己申告である。導入の可否は速度以外で決める"
    evidence: "### 速度と件数 / ## どの条件なら足すか"
    status: fact
  - claim: "復元も、影響外（変更の影響外として走らなかったタスク）も、失敗にしない。GitHub では Success、skipped、neutral は required でもマージを止めない。Vercel CI がスキップ時に付ける区分はドキュメントに無い"
    evidence: "### 保護ブランチが見るもの"
    status: fact
  - claim: "足す条件は、ソースが GitHub、実行が Linux、起動が git push、リポジトリが単一の Vercel チーム上のプロジェクトに接続済み、タスクを turbo.json で表せ、Pro の単価で見積もれることである。それ以外は既存 CI に残す"
    evidence: "## どの条件なら足すか / ### プランと公開状態の文面 / ### 実行できる場所"
    status: fact
mental_models:
  - type: structure
    key_message: "失敗したチェックだけがマージを止める。影響判定の漏れは別のテストで見る"
    reason_needed: "足す範囲と、失敗にしない穴が、文章だけでは境界として残りにくいため"
example:
  description: "ドキュメントの最小例では、build に !ci を付けて選択から外し、test は build に依存しつつ ci を付ける。test が CI 対象なので、外した build も先に走る"
  hypothetical: false
  evidence: "### どのタスクが走るか"
applicability:
  - "エージェントが増やす pull request に、Linux タスクの失敗を早く返したいとき"
  - "小さい差分で、復元とスキップが待ちと CPU minute を同時に下げると見込むとき"
decision_criteria:
  - "最初の pull request で出たチェック名を記録してから required にする"
  - "inputs の外のファイルだけを変え、走らないかキャッシュのまま緑なら、そのファイルは branch protection の対象外と記録する"
limitations:
  - "ソースは GitHub のみ、ベースイメージは Linux のみ、トリガーは git push のみである。手動起動と定期実行は git push の外、macOS と Windows は Linux の外である"
  - "Turborepo の --affected の既定では、パッケージ内の 1 ファイルの変更でそのパッケージの全タスクが選ばれる。Vercel CI が同じ規則かはドキュメントに無く、ファイルパターンまで絞っているかも書いていない"
  - "passThroughEnv の値は再実行を決めるハッシュに入らない。inputs から落としたファイルが変わっても再実行されない"
  - "ブログは all plans と書くが、料金ページに Hobby の行は無い。CLI ページは 2026-10-07 のまま Private Beta と書く"
unknowns:
  - "fork の pull request の扱い、globalEnv の値がハッシュに入るか、デプロイ完了を待つ e2e が下流のハッシュを変えるかは、参照したドキュメントに無い。Vercel CI がスキップ時に付ける結果区分もドキュメントに無い"
reviewed: true
