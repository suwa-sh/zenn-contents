source:
  title: "エージェントの業務テストに委任・義務・状態変化を含める"
  url: null # Zenn 下書き (published: false)。公開 URL なし
  path: "notes/zenn/articles/arxiv-abs-2610-35978-p8_20261029.md"
  primary:
    - title: "Testing Agentic Service Systems: An Agentic Living Lab Methodology Across the Physical–Digital Continuum（Wang ほか、arXiv:2610.35978v1、2026-10-26）"
      url: "https://arxiv.org/abs/2610.35978"
    - title: "Ancillary（スキーマ、フィクスチャ、参照ランナー）"
      url: "https://arxiv.org/src/2610.35978v1/anc/README.md"
  retrieved_at: "2026-10-30"
archetype:
  primary: research
  secondary: [decision]
one_liner: "代理人の業務テストの単位は、エージェントとタスクの組ではなく、依頼者、委任、義務、世界の状態、証拠を束ねた1件である。"
key_points:
  - claim: "テストの1件は service episode（サービスの1件のやりとり）で、記録には依頼者、委任（代理人に許された操作の範囲）、世界の状態（コーディングへ写すときの実行前後では、ブランチ、チケット、デプロイ、外部チケット、請求など）、証拠を残す。相手（依頼者と約束を交わす側）との約束は、合意した手続きを通ったときだけ、協働上の義務になる"
    evidence: "### 1件の単位は service episode"
    status: fact
  - claim: "判定は1個の点数ではない。結果と義務、権限、協働（義務が今どの状態か）、継続（担い手や計画が変わったあとも閉じられるか）、証拠、人の作業、依頼者や相手方の得失を、別々の項にする"
    evidence: "### 1件の単位は service episode / ## コーディングエージェントのテストへ写す欄"
    status: fact
  - claim: "結果を伴う行為は発送の前に入場判定する。複数が当たるときの優先は、拒否、再承認（元の行為を止めて承認へ上げる）、待ち（発送せず条件と期限を残す）、許可の順である。許可は共有の予算や在庫を押さえる段階へ進むだけでまだ発送せず、押さえに失敗したら待ちに戻す"
    evidence: "### 入場判定と実行の鎖"
    status: fact
  - claim: "権限の取消はこれから先の行使を止め、既に発生した義務は残す。終了は履行と打ち切りを分けて明示する"
    evidence: "### 人の役割と4つの境界"
    status: fact
  - claim: "コーディングエージェントへ写す導入の欄は、依頼者、委任範囲、実行前と実行後の業務状態、完了を裏付ける証拠である。完了の証拠は差分、テスト結果、承認、外部の記録で、モデルの完了宣言は証拠にしない"
    evidence: "## コーディングエージェントのテストへ写す欄"
    status: fact
mental_models:
  - type: behavior
    key_message: "許可は即時の発送ではない。資源を押さえられてから発送し、押さえに失敗したら発送しない。拒否、再承認、待ちも照合に残す"
    reason_needed: "許可を成功や発送と読むと、資源確保の失敗や、拒否と待ちを照合に残す扱いを落とすため"
example:
  description: "リポジトリの所有者が、あるブランチへテストを足すよう依頼し、会話の途中で push の許可を取り消した、という構成であり、成功率の測定値ではない。差分とテスト結果は完了の証拠になり得る。取消後の旧権限での push と未レビューの完了は別の欄で見、どちらも未履行になり得る"
  hypothetical: false
  evidence: "## コーディングエージェントのテストへ写す欄"
applicability:
  - "完了が外部の業務状態や、他者に残る義務に依存するとき"
  - "出力は合うのに、権限を取り消したあとの push や、未完了の外部手続きが残るとき"
decision_criteria:
  - "実行完了、出力の一致、義務の履行、依頼者の価値（依頼者の得失）を、1個の点数に潰さない"
  - "終了時の状態と禁止行為の検査だけで、権限の失効と残る義務を拾えている環境では、依頼者、委任範囲、実行前後の業務状態、完了の証拠は足さない"
  - "出力は合うのに、無権限の push や未完了の外部手続きが既にあるなら、依頼者、委任範囲、実行前後の業務状態、完了の証拠を足す理由は論文の実証を待たない。足したあとの品質は別に測る"
  - "参照ランナーの合格は、入場の結論と未履行かどうかの一致に限る。許可、履行済み、副作用の不在の証明には使わない"
  - "Living Lab という呼称、ランナーの合否、会議への採録、有効性が実証済みであることは、検収の根拠にしない"
limitations:
  - "論文はエージェント品質の測定結果を報告していない。旅行と産業の例は著者が構成した設計であり、現場の測定値ではない"
  - "参照ランナーは、発送も、動いている世界の観測もしない"
  - "付属の説明は版 1.44、スキーマ見出しは v1.45 で、契約版は未解決である。2026年10月29日時点で SOC4IA 2026 の公開プログラムは未発表であり、著者記入の accepted は公開の採録リストとは別である"
  - "入場判定は、プロンプトインジェクション対策の証拠にはならない"
unknowns:
  - "スキーマ表記の 1.44 と v1.45 のどちらを契約版とみなすか"
  - "SOC4IA 2026 の公開プログラムと、会議後の論文集にこの論文が載るか"
  - "コーディング作業の業務状態を、作業ツリー、チケット、本番環境のどこに置くと、成果物があるだけの完了や未確認の遠隔効果を未履行として拾えるか（論文の測定範囲外）"
reviewed: true
