transitions:
  - from: diff
    to: kind
    label: "分類する"
  - from: kind
    to: typo
    label: "振る舞い不変"
  - from: kind
    to: behavior
    label: "手順が変わる"
  - from: kind
    to: io
    label: "入出力が変わる"
  - from: behavior
    to: human
    label: "期待と危害"
  - from: io
