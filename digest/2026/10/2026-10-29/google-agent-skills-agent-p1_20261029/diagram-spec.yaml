  - item: "新規スキルへの中央担当の重ね承認"
    reason: "既存の修正と、新しい手順書をカタログへ入れる承認は別であることは本文の確認項目に残し、差分の種類の矢印には入れない"
  - item: "スクリプトへ置く処理と本文に残す禁止の境界"
    reason: "止め方の分岐とは別の判断なので、確認項目に残す"
