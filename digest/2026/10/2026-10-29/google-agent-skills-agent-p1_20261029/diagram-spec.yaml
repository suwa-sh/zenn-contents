type: behavior
title: "差分の種類で止める"
message: "振る舞いが変わる差分だけを原子期待で比べ、振る舞いも停止条件も変わらない文言は版も評価も必須にしない"
source: "notes/zenn/articles/google-agent-skills-agent-p1_20261029.md"
states:
  - id: diff
    label: "差分"
    meaning: "手順書の変更。図に入るのは、小さいチームが止める条件を種類で分けるときの入口"
  - id: kind
    label: "変化の種類"
    meaning: "ツールの選び方や作業を止める条件が変わるか、手順が変わるか、入出力や必須ツールが変わるか"
  - id: typo
    label: "形式検査のみ"
    meaning: "誤字、リンク、生成した目次で、ツールの選び方も作業を止める条件も変わらない。版は上げなくてよい。評価レポートは必須にしない。生成物が機械で一致するなら人の確認は省略してよい"
  - id: behavior
    label: "原子期待で比較"
    meaning: "手順、作業を止める条件、コマンド、参照を読む順が変わる。版を上げ、既存は前の版、新規は手順書を渡さない実行と、1 項目に割った期待で比べる"
  - id: io
    label: "古い呼び出しも比較"
    meaning: "入出力や必須ツールが変わる。前の版との比較に、古い呼び出しの期待を足す。チームの規約では中位以上の版にする。仕様は強制しない"
  - id: human
    label: "人が確認"
    meaning: "期待が本番の失敗を切っているか、期待に書いていない危害、互換を壊してよいか。新規をカタログへ入れる承認は、この確認とは別"
groups:
  - id: no_eval
    label: "評価は必須にしない"
    members: [typo]
  - id: need_eval
    label: "評価を必須にする"
