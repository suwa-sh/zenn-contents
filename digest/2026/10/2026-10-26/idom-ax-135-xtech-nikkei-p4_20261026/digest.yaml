source:
  title: "IDOMの約135億円AXを台帳の更新権が分かれてから投資対効果の分母にする"
  url: null
  path: "notes/zenn/articles/idom-ax-135-xtech-nikkei-p4_20261026.md"
  primary:
    - title: "日経クロステック（2026-10-26）IDOM、顧客接点から基幹までをAXの対象に約135億円"
      url: "https://xtech.nikkei.com/atcl/nxt/column/18/03801/101900001/"
    - title: "IDOM（2025-01-06）IDOM Digital DriveとSalesforceの発表"
      url: "https://idom-inc.com/news/press/20250106-37210.html"
    - title: "IDOM（2026-04-14）2026年2月期 決算説明テキスト"
      url: "https://idom-inc.com/wp-content/uploads/2026/04/setsumei_text_20260414.pdf"
    - title: "IDOM（2026-10-14）業績予想との差異および通期業績予想の修正"
      url: "https://ssl4.eir-parts.net/doc/7599/tdnet/2894591/00.pdf"
    - title: "自動車公正取引協議会「支払総額に関する質問と回答」"
      url: "https://www.aftc.or.jp/contents/am/shiharai/faq.html"
  retrieved_at: "2026-10-27"
archetype:
  primary: decision
  secondary: [governance]
one_liner: "約135億円は日経の公開リードの数字であり、台帳の更新権が文書で分かれるまで投資対効果の分母にしない。"
key_points:
  - claim: "約135億円と「顧客接点から基幹まで」は、2026年10月26日の日経クロステックの公開リードにある。有料本文は未読である。同日までの適時開示に、この額も、同紙がIDOMの同日午後の発表と書いた Gulliver AX宣言の本文も無い。確定したプログラム予算としては読まない"
    evidence: "## 注意点（約135億円と「基幹まで」は公開リード） / ## 台帳の更新権が分かれるまで分母にしない / ## まとめ"
    status: fact
  - claim: "分母にするとは、その額で効果を割ることである。宣言または設計書が、エージェント（同紙の呼び方。製品は未記載）が更新してよい台帳と、人が確定する点（候補は在庫・契約・返金）を分けるまで分母にしない。分離が無ければ「基幹まで」は範囲の宣言であり、見積・承認・取消の主体を分けた実例にはならない"
    evidence: "## 台帳の更新権が分かれるまで分母にしない（更新してよい台帳と、人が確定する点。在庫、契約、返金はその確定点の候補）"
    status: fact
  - claim: "会社が金額つきで書いたデジタル投資は約135億円より小さく、会社は135億円との包含関係を書いていない。別の時期の金額を、135億円の内訳として足さない"
    evidence: "## 注意点 の金額の表 / 同じ節の「会社は、包含関係を書いていません」"
    status: fact
  - claim: "通期の営業利益を240億円から185.01億円へ下げた本文の理由は、上期の下振れと、下期の大型店の準備・設備、人員、買取を強める広告であり、AXを主因とは書いていない。デジタル投資の費用は、中間の期初想定410億円から432億円の差の一要素としてだけ確認できる"
    evidence: "## 注意点（利益を下げた理由は上期の下振れと下期の成長投資。卸の粗利は中間の差異で通期の節とは別。表の18,501百万円は185.01億円。販売費及び一般管理費は410億円から432億円）"
    status: fact
  - claim: "「成約率1ポイント超上昇、60億円増収へ」は2026年10月28日公開予定の見出しで、本文は無く実績としては未確認である。支払総額は、表示と違う条件で売ることと、総額の外への諸費用を禁じる。基準売価を画面に出す前に持つことは禁じておらず、顧客に示す支払総額の確定は別である"
    evidence: "## 注意点（本文は無く、増収の実績としては未確認。禁じているのは表示した総額と違う条件で売ること、諸費用を後から足すこと、商品化費用を別に請求すること）"
    status: fact
mental_models:
  - type: behavior
    key_message: "宣言本文か適時開示に3つがあれば、期間と内訳の側からプログラム予算として読み直す。無ければ報道の総額のまま。分母の条件は図の外にある"
    reason_needed: "報道の総額を、そのままプログラム予算の分母にすると、更新権の分離が無い範囲の宣言を実例として読んでしまう"
example:
  description: "約135億円は公開リードにあり更新権が分かれるまで分母にしない。10億円のCRM開発注記と、中間の販売費増の一要素であるCRMとAIの支出は、135億円に足さず、全体が135億円とは確認できない"
  hypothetical: false
  evidence: "## 注意点 の金額の表 / ## 下方修正と増収見出しを135億円へ結びつけない"
applicability:
  - "約135億円を、IDOMのAXの投資対効果の分母にしようとしているとき"
  - "通期利益の下方修正を、135億円の失敗として読もうとしているとき"
  - "未刊行の増収見出しを、135億円が戻った根拠にしようとしているとき"
decision_criteria:
  - "有料記事の本文に、対象システム、期間、委託範囲、更新権の有無があるか"
  - "2026年10月26日午後以降の会社ニュース、TDnet、EDINETに、宣言の語と135億円があるか"
  - "エージェントが更新してよい台帳と、人が確定する在庫・契約・返金が、文書で分かれているか"
  - "4億円（2027年2月期第1四半期のDX関連費の増）、761百万円（2026年3〜8月の無形固定資産の取得）、50億〜60億円（2025年の日経。会社発表に金額は無い）を、135億円へ足していないか"
  - "後続の本文が出たら、成約率1ポイントの母数と、60億円が増収として何を数えた額かを、見出しではなく本文で読むか"
limitations:
  - "内訳、期間、委託先、更新権の分離が有料本文にあるかは、公開リードからは分からない。有料本文は未読である"
  - "Gulliver AX宣言の本文が有料記事の中にあるのか、同日午後の別の会社資料として出たのかは、2026年10月26日時点では分かっていない"
  - "決算注記の10億円は、CRM開発の追加投資の総額とも、より大きい額の一部とも読める"
  - "連載目次の導入文にある「ベテランの値付け」と、10月29日予定の見出しの基準売価が同じかは、公開文では確認できない"
unknowns:
  - "有料本文に、内訳、期間、委託先、台帳の更新権の分離があるか"
  - "Gulliver AX宣言の本文が、有料記事の中か、別の会社資料か"
  - "10億円が追加投資の総額か、より大きい額の一部か"
  - "ベテランの値付けと基準売価が同じ対象か"
reviewed: true
