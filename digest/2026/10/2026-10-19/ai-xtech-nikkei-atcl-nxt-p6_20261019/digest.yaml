source:
  title: "AI前提のレガシー刷新で再浮上するデータ中心アプローチの発注範囲"
  url: null # Zenn 下書き (published: false)。公開 URL なし
  path: "notes/zenn/articles/ai-xtech-nikkei-atcl-nxt-p6_20261019.md"
  primary:
    - title: "鈴木慶太「AI前提のレガシー刷新、データ中心アプローチが意外な復活　CIOらが議論」日経クロステック、2026-10-19（公開1ページ目。2ページ目は元記事が未読）"
      url: "https://xtech.nikkei.com/atcl/nxt/column/18/03788/100700002/"
    - title: "日経BP「ITイノベーターズ会議」第46回プログラム"
      url: "https://events.nikkeibp.co.jp/event/2026/nxt2026itiall/"
    - title: "ITmedia「データ中心アプローチ」2011-09-09（二次情報。DOA の公開定義）"
      url: "https://www.itmedia.co.jp/im/articles/1109/09/news134.html"
  retrieved_at: "2026-10-20"
archetype:
  primary: decision # 発注の受入条件に、何を一行で入れるか
  secondary: [governance] # 会議の公開範囲と、手法の公開定義が、採れる範囲を止める
one_liner: >-
  リードの手法名は1980〜90年代のDOAだけである。
  一つの使い方に限り、人と生成AIが同じ名前で参照する項目名、値を決める属性、正本のシステムを、画面とバッチの切替日とは別に固定する。
key_points:
  - claim: "2026年10月19日の日経クロステックの公開リードは、生成AIを前提にしたレガシー刷新の要点として、1980年代から90年代の DOA（データを先に置き、機能を導く手法）を置いている。有料の2ページ目は未読なので、誰の発言かは割り当てられない"
    evidence: "冒頭、## まとめ、### 報道が置いている手法名、### 有料本文と発言の割り当て"
    status: fact
  - claim: "公開本文は「データ中心」を、マスタ統合、語彙、系統のどれかには分けていない。語彙のうち同じ名前で参照する項目名は受入に入れ、全社のマスタ統合と全社用語集の完成と系統は入れない"
    evidence: "## 発注の一行に入れる範囲（表）"
    status: fact
  - claim: "足す一文は登壇者の引用ではない。発注者が選ぶのは、DOA のうち参照キーの関数従属性に近い読みと、正本を一つ指す範囲だけである"
    evidence: "## 受入条件として固定する一文"
    status: fact
  - claim: "9月8日の第46回 ITイノベーターズ会議の公開プログラムには、現行を等価な Java 実行系へ先に移す手順、進化し続けるアーキテクチャ、コード解析から入る手順がある。受入の一行はこれらを禁止せず、切替判断のチェックを一つ増やす"
    evidence: "## 同じ日の手順は一つに畳まない、## 受入条件として固定する一文"
    status: fact
  - claim: "英語の data-centric AI は学習用データを体系的に作る規律であり、日本の DOA と同じ対象ではない。ベンダーが「データ中心」と言うときは、DOA、MDM（共有マスタの均一性を保つ規律）、用語集、系統、学習データの data-centric AI のどれかを書かせる"
    evidence: "### DOA と英語の data-centric、## 受入条件として固定する一文（直近でやることの3）"
    status: fact
mental_models:
  - type: structure
    key_message: "足すのは一つの使い方に限った項目名、値を決める属性、正本のシステムだけである。全社のマスタ統合、全社用語集、系統、意味の凍結は含めない"
    reason_needed: "リードの手法名を、マスタ・用語集・系統へ広げる読みと、同じ日の別手順を一つに畳む読みを、境界として一度に示すため"
example:
  description: "元記事が発注範囲に足す一文を、固定する中身、含めない中身、禁止しない手順の3列に分けたもの"
  hypothetical: false
  evidence: "## 受入条件として固定する一文、## 同じ日の手順は一つに畳まない"
applicability:
  - "生成AIを前提にしたレガシー刷新で、公開リードの「データ中心」を受入条件に落とすとき"
  - "画面とバッチの切替日とは別に、項目の正本を切替判断の文書へ足すとき"
  - "ベンダー提案の「データ中心」が、どの手法を指すかを書かせるとき"
decision_criteria:
  - "対象ユースケースの名前を空欄にしていないか"
  - "全社のマスタ統合、全社用語集、系統グラフ、意味の凍結、全社共有を前提にする流儀を、この受入に含めていないか"
  - "公開リードに無いマスタ、語彙、系統、切替日を、CIO や CDO の合意として発注書へ写していないか"
  - "有料本文が未読であることを理由に、受入を一行も足さない、としていないか"
limitations:
  - "2ページ目は未読なので、推奨の確度は中程度に留める。「AI Ready」の割り当て、決定項や正本への発言の有無（無かったとは断定しない）、「AIフレンドリー」の定義、リミニストリートの「AI-Ready化」が見出しと同じ対象かは未解決"
  - "本文が系統または全社マスタを、この会議の「データ中心」だと明示していたら、この一行は会議の要旨ではなく発注者の限定だ、と注記を強める"
  - "対象が一つのユースケースに収まらず、領域をまたぐ正本の衝突が切替の障害なら、マスタ統合の検討は別行で要る"
  - "エージェントが参照する主材料が項目の正本ではなくログと手順書なら、アクセンチュアの公開概要が挙げるログ、文書、有識者知識を、正本と同じ受入条件の別行に置く"
  - "企業名つきで「DOA の企業データモデルが刷新を止めた」公開事例は、参照した範囲では未確認である。確認できないことを、失敗が無いことの証明にはしない"
unknowns:
  - "2ページ目で、発言者は「AI Ready」データを、マスタ、用語、系統、切替条件のどれとして話したか"
  - "ディスカッションで、データ項目の決定項や正本に触れた発言があるか。公開1ページ目と公式プログラムには転載が無く、無かったとは断定しない"
  - "「AIフレンドリー」は本文で定義されているか"
  - "リミニストリート講演の「AI-Ready化」は、見出しの「AI Ready」データと同じ対象か"
reviewed: true
