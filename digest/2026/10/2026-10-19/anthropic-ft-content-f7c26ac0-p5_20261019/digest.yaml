archetype:
  primary: governance # 相手に見せる権限、渡さない希望、人に残す確定の分け方
  secondary: [decision] # 一枚の上限で切れるか、何を確定前の人に残すか
one_liner: >-
  人のために条件を話すエージェントには、相手に見せる委任と、渡さない希望と、名前のある人の確定を分ける。
  ツールの許可表（実行できる操作の一覧）は、相手から見た権限にならない。
key_points:
  - claim: "Financial Times（2026-10-18）は、Anthropic が法律グループと、人のために取引を取るエージェントの交渉の仕方を相談している、と報じた。取得できた段落は、交渉の仕方、人に戻す時機、相手を疑う度合い、署名した指示書の相談に読める。一件ごとの承認窓口だ、とは読めない"
    evidence: "### 抜粋から読める手続"
    status: interpretation
  - claim: "記録は三つに分ける。相手に見せる委任の表示、渡さない希望のメモ（撤退線を含む）、人に残す受諾。ツールの許可表（実行できる操作の一覧）は、相手から見た権限の表示にはならない"
    evidence: "### 相手に見せる記録と、渡さない記録 / ## 交渉の前に書く記録"
    status: interpretation
  - claim: "一枚の上限では、相手から見た権限は切れない。Project Deal では「攻撃的に交渉せよ」の売却確率への効果は 5.2 ポイント（p = 0.43）で、希望価格を統制すると価格差は約 +0.95 ドル（p = 0.275）に縮む。画面が会社の交渉役に見えるなら、内部の天井は民法 110 条の「権限があると信ずべき正当な理由」を消さない。消費者向け約款も事業者向け約款も、「天井の内側なら確認不要」とは書いていない"
    evidence: "### 一枚の上限では切れない理由"
    status: interpretation
  - claim: "Project Deal（社員 69 人、1 週間、実物を渡した run 186 件、総額は 4,000 ドルをわずかに超える）と Project Swap（社員 201 人が本を持ち寄り、エージェントが交換）は社内実験であり、顧客の代理交渉の製品発表ではない。Deal は政策と法の枠組みはまだ無い、と書き、脚注で途中の人の承認が無い設計を現実の配備の仕方から外している"
    evidence: "### 公開されている二つの実験 / ### 実験、求人、利用方針は別の文書 / ### 社内実験の母数"
    status: fact
  - claim: "賃金の変更、署名する法律文書、個人への法務の助言は、利用方針の改訂（2026-11-12 発効予定）を待たず、確定前の人を必須にする。約款が事業者間の価格交渉のすべてに一件ごとの人の確定を求めている、とまでは読めない"
    evidence: "### 渡さないメモと、人に残す確定"
    status: interpretation
mental_models:
  - type: structure
    key_message: "相手に見せる委任と、渡さない希望と、人に残す確定は別々である"
    reason_needed: "希望価格を委任の表示に書くと、相手は会話で引き出さなくても撤退線を読むため"
example:
  description: >-
    元記事が、交渉の前に分ける記録を三行にしたもの。
    委任の表示は相手に渡し、本人の氏名または商号、話してよい相手、提案で止めること、外れたら人に戻す条件、有効期限を書く。
    希望のメモは渡さず、希望価格、撤退線、譲れない条項の中身を書く。
    高リスクの受諾は、どちらの紙にも載せず人に残す。
  hypothetical: false
  evidence: "### 相手に見せる記録と、渡さない記録（三行の表）"
applicability:
  - "対外の交渉にエージェントを出す前に、見せる記録と渡さない記録を分けるとき"
  - "希望価格を、相手と話す文脈に置くかを決めるとき"
  - "賃金、署名文書、個人への法務助言を、利用方針の改訂日を待たずに人の確定にするとき"
decision_criteria:
  - "委任の表示は提案までで止め、公開する金額を撤退線そのものにしていないか"
  - "希望価格と撤退線を、相手と話す文脈に入れていないか"
  - "どのツールを押せるかを、相手から見た権限の表示にしていないか"
  - "画面が会社の交渉役に見えるとき、内部の上限だけで相手の信頼を切れると読んでいないか"
  - "賃金、署名文書、個人への法務助言は、2026-11-12 を待たず確定前の人を必須にしているか"
limitations:
  - "Financial Times の全文は、2026-10-19 時点で購読なしには開けない。抜粋は手続の相談に読めるが、後半が個別案件の承認に触れていない、とまでは言えない"
  - "プログラムが民法 99 条の代理人に当たるかは未決着である。発効中の利用方針（2025-09-15）の確定前レビューは、個人や消費者に直接当たる助言や決定が対象で、会社対会社の価格交渉がその文言に当たるか、2026-11-12 の改訂後に高リスクへ入るかは未決着である"
  - "Deal で攻撃的な指示の独立した効果は確認できていない。希望価格を操作して測った実験ではなく、高い希望価格との関連が残っただけである"
  - "Deal は自己選択の社員の pilot でギフトカード付きである。一般人口を代表しないのは Swap のページの留保である。この整理は法律意見ではなく、事務所名は取得できた抜粋に無い"
unknowns:
  - "Financial Times の全文が、個別案件の承認に触れているか"
  - "Anthropic が、この相談を自社の発表として出すか"
  - "相談先の法律事務所の名前"
  - "プログラムが民法 99 条の代理人に当たるか"
  - "会社対会社の価格交渉が、2025-09-15 版の「個人や消費者」に当たるか"
  - "2026-11-12 の改訂発効後、会社対会社の価格交渉が高リスクの推薦に入るか"
  - "相手に見せる委任の表示を、業界で相互に検証する仕組みが Anthropic の製品として現れるか"
reviewed: true
