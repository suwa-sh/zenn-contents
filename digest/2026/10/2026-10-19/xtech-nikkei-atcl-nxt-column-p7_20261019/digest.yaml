archetype:
  primary: governance # 職員発のスキル件数を、公開資料が分けている母数のどれで数えるか
  secondary: [decision] # 利用可能人数・アプリ本数・作成数・共有後の実行を、どの指標に使うか
one_liner: >-
  源内（政府職員向け生成AI）のスキル（実行できる業務の一式）は、
  利用可能人数、用意されたアプリ、工房（個人専用の開発環境）の利用許可、作成数、共有後の実行に分けて数える。
  2026年10月19日の実数は、利用可能人数とアプリの稼働までである。
key_points:
  - claim: "約18万人は大規模実証の対象、約16万人は2026年8月下旬時点で利用可能とされた人数である。スキルを作った人数でも、実行した人数でもない"
    evidence: "## 注意点 > ### 約18万人と約16万人 / ## 何を1件と数えるか の表の1段目"
    status: fact
  - claim: "府省庁の業務で稼働する行政実務用RAG（行政の業務向けアプリの一種）は20以上である。約30種類はデジタル庁内の内製、40種類以上は使えるアプリ、と別の書き方があり、20以上と合わせて一つの本数ではない"
    evidence: "## 職員が触れる面 の表と、その節の末尾"
    status: fact
  - claim: "1万から数万件は作成済みの件数ではない。説明資料が規模感の推測と見出しを付けた推計で、法律約2,100件と課長・室長クラス約4,000人から法律系6,000件と課室業務4,000件を置いたものである"
    evidence: "### スキル / ## 注意点 > ### 1万から数万件は規模感の推測"
    status: fact
  - claim: "源内マーケットプレイス（職員が作ったスキルを組織を越えて共有する仕組み）は企画・構想で未稼働である。審査を通った件数は公開資料に無く、仕組みが無い段階のゼロは定着の失敗の数ではない"
    evidence: "### 層の関係（マーケットプレイスは企画・構想） / ### 自由に共有できる、はデモ画面の文言 / ## 何を1件と数えるか の末尾"
    status: interpretation
  - claim: "作成、組織内での利用、政府横断の共有、基盤の変更は、別々の承認として読む。源内基準（利用者・管理者・開発者の役割を分ける文書）の目次と審査の検討は、承認が分かれることを示しているが、実装で既に分かれているとは書けない"
    evidence: "## 作成と共有と基盤変更を分ける"
    status: interpretation
mental_models:
  - type: structure
    key_message: "工房の利用許可は、何人に作る許可があるかという段であり、作成済み件数とは別。下の三段は公開された実数が無く、作成数がゼロという意味ではない"
    reason_needed: "利用可能人数を作成数へ読み替えたり、共有の仕組みが無いゼロを定着の失敗と書いたりしないため"
example:
  description: "規模感の推測は、法律約2,100件から法律系6,000件、課長・室長クラス約4,000人から課室業務4,000件を置いた。一つの法律から複数のスキルが生じ、複数の法律を一つのスキルにまとめることもある"
  hypothetical: false
  evidence: "### スキル / ### 1万から数万件は規模感の推測"
applicability:
  - "政府や自治体の生成AIで、職員が作った件数を政策の指標にするとき"
  - "利用可能人数や用意されたアプリの本数を、スキルの作成数へ読み替える報道を読むとき"
  - "共有の仕組みが無い段階のゼロを、定着の失敗として書くとき"
decision_criteria:
  - "数える段が、利用可能人数・用意されたアプリ・工房の利用許可（人数は未公表）・作成数・共有後の実行のどれか"
  - "1万から数万を、作成済みの件数として使っていないか"
  - "約16万人を、利用可能人数・作成者・実行者のどれとして読んでいるか"
  - "20以上、約30種類、40種類以上を、同じ母数にしていないか"
  - "ウェブの読み取り、個人領域からの外部通信、MCPやAPIの無断送信を、一つの禁止にまとめていないか"
limitations:
  - "専門的知識は不要、は操作を自然言語で行えるという説明の範囲である。工房は個人専用サーバー上の環境で、ファイル操作とコマンド実行を含み、生成結果の最終確認は職員自身が行う"
  - "大分市の Oita GENAI は2026年10月1日から自治体の閉域網の上の源内の公開OSSである。エージェントチャット、工房、スキル共有は市の発表に無く、国の工房の稼働開始ではない"
  - "エージェントチャットと工房がどの府省庁の何人にいつから試験提供されたかは、これらの公開資料には無い。日経クロステック（2026年10月6日）の有料本文は、元記事の時点で購読なしには開けていない"
  - "ウェブの読み取りを止めているとまでは書いていない。説明会FAQの外部通信不可と、工房の画面イメージの任意サイトの直接読み取りが同じ環境の同じ口を指すか、またMCPやAPIの制限が工房だけかは、資料からは決まらない"
  - "ログインに使う共通サービスで、漏えいした可能性がある個人情報は約24.6万件である（公表2026年9月11日）。源内のプロンプトやスキルが漏れたという記載は無い"
unknowns:
  - "エージェントチャットと源内工房の試験提供が、どの府省庁の何人にいつから始まったか"
  - "源内基準が2026年10月上旬の公表予定どおり出たか。確定本文のURLは未特定"
  - "説明会FAQの外部通信不可と、工房イメージの任意サイト直接読み取りが、同じ環境の同じ口か"
  - "大分市の調達仕様に、エージェントやスキル共有が含まれるか"
  - "ログイン基盤の事案の製品名とCVE、および源内テナントへの波及"
reviewed: true
