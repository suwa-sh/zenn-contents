source:
  title: "CNCFブログはエージェントの境界を許されたツール集合として整理する"
  url: null # Zenn 下書き (published: false)。公開 URL なし
  path: "notes/zenn/articles/cncf-cncf-io-2026-boundary-p6_20261030.md"
  primary:
    - title: "CNCF Blog \"The boundary problem in agentic AI is a platform problem\"（2026年10月29日）"
      url: "https://www.cncf.io/blog/2026/10/29/the-boundary-problem-in-agentic-ai-is-a-platform-problem/"
  retrieved_at: "2026-10-31"
archetype:
  primary: decision # 見えるツール集合を正本にする配置の比較
  secondary: [architecture, governance] # 四つの環と、レビュー済み差分だけが境界を変える規則
one_liner: >-
  エージェントが何をできるかの正本は、宣言したツール集合と、その集合への呼び出しごとの認可である。
  実行中の身元はその定義を書き換えられない。
key_points:
  - claim: "同心円は内側から身元、到達（接続してよい相手）、能力、データ（見てよいレコード）で、外側の環は内側の検証済み身元を鍵にする。能力は、保持してよいツールを宣言して決める関門と、ツールを呼び出すたびに認可する関門に分かれ、一覧に出るかと呼び出せるかはこの二段にある"
    evidence: "## Safe Operating Model とは / ### 四つの環 / ### ツールは能力の二段と要石にある"
    status: fact
  - claim: "要石は、権限を定義するオブジェクトを当の身元が書き換えない規則で、変更は人かパイプラインのレビュー済み差分に限る。エージェントに見せる一覧（見える集合）に残すのは、変更案、下書き、推奨、望む状態への pull request を出すツールだけである"
    evidence: "### 四つの環 / ### 採る配置"
    status: fact
  - claim: "プロンプトの禁止は意図の記録として残し、何ができるかの正本にはしない。メッシュはどのツールが見えるかの正本ではなく、標準入出力で子プロセスと通信する方式はこの層を通らない"
    evidence: "### 層を分けた範囲で残る結論 / ### 採る配置"
    status: fact
  - claim: "Safe Operating Model は、確認した範囲では CNCF の仕様名でもプロジェクト名でもなく、元のブログ本文は SPIFFE、Istio、MCP、OPA、Kyverno を名指ししていない。この名前の標準としては採用しない"
    evidence: "### この名前は筆者の整理である / ### 本文は製品名を出していない / ## 正本は宣言した能力の集合に置く"
    status: fact
  - claim: "確認した Istio と Linkerd の出荷時の既定は、接続を許す宣言が無い相手を拒否することではない。MCP では、認可に従わなくても仕様違反にはならず、一覧から許可外ツールを外すことも義務ではない"
    evidence: "### 到達の出荷時既定は拒否ではない / ### 許可外ツールを隠すことは MCP の MUST ではない / ### stdio はメッシュの到達を通らない"
    status: fact
mental_models:
  - type: structure
    key_message: "何ができるかの正本は、宣言したツール集合と呼び出しごとの認可であり、実行中の身元はその定義を書き換えられない"
    reason_needed: "正本の置き場と、変更を通す経路と、実行中の身元が触れない境界が、文章だけでは位置関係として残りにくいため"
example:
  description: >-
    エージェントの ServiceAccount が自分の Role を更新でき、その緩和を含む pull request がレビュー無しでマージされ、
    Argo CD の自動同期がクラスタへ反映すると、提案は権限を定義するオブジェクトの書き換え経路になる。
  hypothetical: false
  evidence: "### 採る配置"
applicability:
  - "エージェントへ渡す道具と、その追加や削除の経路を、プラットフォーム側で決めるとき"
  - "提案の pull request を境界変更の経路にする前に、必須レビューと自動同期の条件を見るとき"
decision_criteria:
  - "渡しているツールに、マージ、適用、承認、価格決定、資金移動、設定ファイルの書き込み、認可オブジェクトの更新が含まれるか"
  - "含まれていれば、それらを見える集合から外し、残す出力を提案と pull request に限ったか"
  - "境界を変えるリポジトリで、必須レビュー、バイパス、自動マージ、自動同期を確認し、権限を広げるパスだけ適用前に人の承認が残るか"
  - "見てよいデータの範囲を、メッシュに入れた帰結ではなく、データを持つ系の権限として別に置いているか"
  - "Safe Operating Model を CNCF の仕様や、元のブログが名指ししていない製品の推奨として扱っていないか"
limitations:
  - "この名前が CNCF リポジトリの全ファイルに無いかは、GitHub code search が 401 のため言い切れない"
  - "許可した集合の内側では、ツールの選択、引数、ツールの説明文と、通過済みのサーバによる実行中の一覧変更が残る"
  - "RBAC は加算のみで拒否の規則は無く、昇格防止はロールとバインドに書かれている。認可ポリシーやツール許可の設定の更新は、その検査の対象としては書かれていない"
  - "ワークロード身元は利用者の委任を運ぶ資格情報としては書かれていない。利用者とワークロードと認可文脈を一つのトランザクショントークンで運ぶ案は草案であり、そのトークンはワークロード身元の資格情報ではない"
  - "どの製品で、エージェントが実行主体のまま自分の MCP クライアント設定を書き換えられるかは、製品マニュアルまで確認していない"
unknowns:
  - "Safe Operating Model という文字列が、401 で見えなかった CNCF リポジトリのファイル内容に含まれるか"
  - "どの製品で、エージェントが実行主体のまま自分の MCP クライアント設定を書き換えられるか"
  - "トランザクショントークンの提案が、ワークロード身元と利用者委任の穴を埋める仕様になるか"
  - "記事の Figure 1 が、本文の環と異なる要素を描いているか"
  - "fifteen years の起算を、別の一次資料が否定するか"
reviewed: true
