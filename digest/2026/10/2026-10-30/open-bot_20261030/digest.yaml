source:
  title: "手元のAI CLIを常駐チームにするOpenBotの構造とデータ設計"
  url: null # Zenn 下書き (published: false)。公開 URL なし
  path: "notes/zenn/articles/open-bot_20261030.md"
  primary:
    - title: "nightly-labs/openbot"
      url: "https://github.com/nightly-labs/openbot"
    - title: "docs/ARCHITECTURE.md"
      url: "https://github.com/nightly-labs/openbot/blob/main/docs/ARCHITECTURE.md"
    - title: "Hosted servers"
      url: "https://github.com/nightly-labs/openbot/blob/main/docs/hosted-servers.md"
