source:
  title: "過去の記録をエージェントの記憶へ入れるとき、出来事・認知・保存の日付を分ける"
  url: null # Zenn 下書き (published: false)。公開 URL なし
  path: "notes/zenn/articles/zenn-dev-build-anotherme-p9_20261031.md"
  primary:
    - title: "谷口「古い記録をAIに渡すとき、3つの日付を分ける理由」(Zenn)"
      url: "https://zenn.dev/build_anotherme/articles/c433b4055e025d"
    - title: "SurrealDB Tri-temporal model"
      url: "https://surrealdb.com/docs/agent-memory/architecture/tri-temporal-model"
    - title: "Zep Facts"
      url: "https://help.getzep.com/facts"
    - title: "Mem0 Memory Timestamps"
